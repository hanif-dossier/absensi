name: Sinkron keuangan dari Docfarm
# Menyalin data Dashboard Keuangan Minyak (Docfarm) ke database aplikasi, supaya halaman Keuangan selalu terbaru.
# 21 Sep 2026: jadwal tiap jam dimatikan. Sumber keuangan sekarang berkas di laptop pemilik, dikirim n8n lewat
# alat/perbarui-otomatis.mjs setiap Excel penjualan disimpan. Docfarm tidak lagi ikut otomatis, jadi kalau jadwal
# ini tetap jalan, data Docfarm yang lebih lama akan menimpa data terbaru. Tombol manual tetap ada.
on:
  workflow_dispatch:
jobs:
  sinkron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node supabase/muat-keuangan.mjs
        env:
          SINKRON_KUNCI: ${{ secrets.SINKRON_KUNCI }}
