<style>
/* ---------- Warna: hijau minyak tua + emas minyak goreng. Semua komponen memakai token ini. ---------- */
:root{
  --dasar:#f2f5f1; --kartu:#ffffff; --kartu2:#f6f9f5; --garis:#dfe7de; --tinta:#16302c; --redup:#5f7570;
  --utama:#0f3d3a; --utama2:#1c5a54; --emas:#d59a1c; --emas-lembut:#fbf0d3;
  --naik:#1c7a4c; --naik-lembut:#e4f4ea; --turun:#b3362a; --turun-lembut:#fbe9e6;
  --r:24px; --r-kecil:16px; --bayang:0 10px 30px rgba(15,61,58,.08);
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --dasar:#0b1614; --kartu:#12211f; --kartu2:#172a27; --garis:#25403b; --tinta:#e9f2ee; --redup:#93aaa4;
  --utama:#123f3b; --utama2:#1e615a; --emas:#e8b54a; --emas-lembut:#3a2f12;
  --naik:#5fd39a; --naik-lembut:#143224; --turun:#f08a7d; --turun-lembut:#3b1d19; --bayang:0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--dasar);color:var(--tinta);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
.bungkus{max-width:1040px;margin:0 auto;padding-inline:16px}

/* ---------- Kepala ---------- */
.kepala{background:radial-gradient(120% 140% at 0% 0%,var(--utama2),var(--utama) 60%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 0 64px;
  border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.kepala::after{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(232,181,74,.55),rgba(232,181,74,0) 65%)}
.kepala .baris{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--emas)}
.kepala h1{font-size:clamp(26px,6vw,36px);line-height:1.1;margin-top:4px}
.kepala p{margin:6px 0 0;color:#cfe3de;font-size:13.5px}
.pil{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--utama);color:#fff;transition:transform .12s,filter .12s}
.pil:hover{filter:brightness(1.08)}.pil:active{transform:scale(.97)}
.pil.emas{background:var(--emas);color:#2a1e02}
.pil.halus{background:var(--kartu2);color:var(--tinta);box-shadow:inset 0 0 0 1px var(--garis)}
.kepala .pil{white-space:nowrap}
.pil.kaca{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(6px)}
.pil.bahaya{background:var(--turun-lembut);color:var(--turun)}
.pil.kecil{padding:7px 13px;font-size:13px}
.pil:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--emas);outline-offset:2px}

/* ---------- Kartu & keping ---------- */
.kartu{background:var(--kartu);border-radius:var(--r);padding:18px;box-shadow:var(--bayang);margin-top:16px}
.kartu h2{font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.angkat{margin-top:-44px;position:relative;z-index:2}
.besar{background:linear-gradient(135deg,var(--utama2),var(--utama));color:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--bayang)}
.besar .nilai{font-family:var(--serif);font-size:clamp(34px,9vw,46px);line-height:1.05;margin-top:2px}
.keping-baris{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.keping{background:rgba(255,255,255,.13);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.keping b{font-weight:700}
.kartu .keping{background:var(--kartu2);box-shadow:inset 0 0 0 1px var(--garis)}
.keping.merah{background:var(--turun-lembut);color:var(--turun);box-shadow:none}
.keping.hijau{background:var(--naik-lembut);color:var(--naik);box-shadow:none}
.kisi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kotak{background:var(--kartu2);border-radius:var(--r-kecil);padding:12px 14px}
.kotak .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--redup);font-weight:700}
.kotak .v{font-family:var(--serif);font-size:22px;margin-top:2px}
.kotak.emas{background:var(--emas-lembut)}
.kotak.merah{background:var(--turun-lembut)}.kotak.merah .v{color:var(--turun)}
.catatan{font-size:12.5px;color:var(--redup);margin-top:10px}

/* ---------- Hari (7 pil) ---------- */
.hari7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hari{border-radius:16px;padding:9px 2px;text-align:center;background:var(--kartu2)}
.hari b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup)}
.hari span{font-size:12px;font-weight:700}
.hari.hadir{background:var(--naik-lembut)}.hari.hadir span{color:var(--naik)}
.hari.libur span{color:var(--redup);font-weight:500}
@media (max-width:430px){.hari7{grid-template-columns:repeat(4,1fr)}}

/* ---------- Daftar baris (pengganti tabel di HP) ---------- */
.baris-data{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--garis);align-items:baseline}
.baris-data:last-child{border:0}
.baris-data .kiri{min-width:0}.baris-data .kiri small{display:block;color:var(--redup);font-size:12px}
.baris-data .kanan{text-align:right;white-space:nowrap;font-weight:700}
.baris-data.total{border-top:2px solid var(--garis);border-bottom:0;font-size:16px}
.minus{color:var(--turun)}

/* ---------- Tab pemilik ---------- */
.tab-baris{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;margin:14px -16px 0;scrollbar-width:none}
.tab-baris::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:var(--kartu);color:var(--redup);box-shadow:inset 0 0 0 1px var(--garis);cursor:pointer}
.tab.aktif{background:var(--utama);color:#fff;box-shadow:none}
.tab.mati{opacity:.5;text-decoration:line-through}
.tab.tambah{background:transparent;box-shadow:inset 0 0 0 1.5px var(--emas);color:var(--emas)}

/* ---------- Baris karyawan di ringkasan ---------- */
.orang{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:var(--r-kecil);background:var(--kartu2);margin-bottom:10px;cursor:pointer;border:0;width:100%;text-align:left}
.orang:hover{filter:brightness(.98)}
.orang .nama{font-family:var(--serif);font-size:18px}
.orang .bayar{font-family:var(--serif);font-size:20px;text-align:right}
.orang .rinci{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.orang .keping{font-size:12px;padding:4px 10px;background:var(--kartu)}
.orang.kosong{opacity:.55}
.garis-batang{grid-column:1/-1;height:6px;border-radius:6px;background:var(--garis);overflow:hidden}
.garis-batang i{display:block;height:100%;background:linear-gradient(90deg,var(--emas),var(--utama2));border-radius:6px}

/* ---------- Penyunting minggu ---------- */
.minggu{background:var(--kartu2);border-radius:var(--r-kecil);padding:14px;margin-bottom:12px}
.minggu-kepala{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.minggu-kepala .no{width:74px}.minggu-kepala .per{flex:1;min-width:170px}
.isian{background:var(--kartu);border:1.5px solid var(--garis);border-radius:14px;padding:9px 10px;width:100%;min-width:0}
.isian.angka{text-align:right}
.kisi7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kisi7 label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);font-weight:700;text-align:center;margin-bottom:3px}
.kisi7 .isian{padding:8px 4px;text-align:center;font-size:13.5px}
@media (max-width:620px){.kisi7{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sub-judul{font-size:12px;font-weight:700;color:var(--redup);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hasil{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hutang-baris{display:grid;grid-template-columns:130px 1fr 110px 110px 170px auto;gap:6px;margin-bottom:8px;align-items:center}
@media (max-width:820px){.hutang-baris{grid-template-columns:1fr 1fr;background:var(--kartu2);padding:10px;border-radius:var(--r-kecil)}.hutang-baris .lebar{grid-column:1/-1}}

/* ---------- Menu beranda pemilik ---------- */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-top:16px}
.tabel-pb{width:100%;border-collapse:collapse;font-size:13.5px}.tabel-pb th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);font-weight:700}
.tabel-pb th,.tabel-pb td{padding:8px 6px;border-bottom:1px solid rgba(127,127,127,.18);text-align:left;vertical-align:top}.tabel-pb tr:last-child td{border-bottom:0}
.tabel-pb .angka{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.bungkus-tabel{overflow-x:auto}
.ubin-pb{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}.ubin-pb>div{background:var(--kartu);border-radius:14px;padding:12px 14px;box-shadow:var(--bayang)}
.ubin-pb .label{margin:0}.ubin-pb .nilai{font-family:var(--serif);font-size:24px;line-height:1.1;margin-top:4px}.ubin-pb small{color:var(--redup);display:block;margin-top:4px}
.ubin{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--kartu);border:0;border-radius:var(--r);padding:16px;box-shadow:var(--bayang);cursor:pointer;color:var(--tinta);text-decoration:none;transition:transform .12s}
.ubin:hover{transform:translateY(-2px)}.ubin:active{transform:scale(.98)}
.ubin b{font-family:var(--serif);font-weight:600;font-size:18px;margin-top:8px}
.ubin small{color:var(--redup);font-size:12.5px;line-height:1.35}
.ubin .ik{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--naik-lembut);color:var(--utama2)}
.ubin .ik.emas{background:var(--emas-lembut);color:var(--emas)}
@media (prefers-color-scheme:dark){.ubin .ik{color:var(--naik)}}

/* ---------- Bilah simpan ---------- */
.bilah{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);margin-top:18px;background:var(--kartu);border-radius:999px;box-shadow:0 12px 34px rgba(15,61,58,.22);
  padding:8px 8px 8px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.bilah .st{font-size:12.5px;color:var(--redup);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bilah .st.ok{color:var(--naik)}.bilah .st.salah{color:var(--turun)}.bilah .st.ubah{color:var(--emas);font-weight:700}

/* ---------- Masuk ---------- */
.masuk{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 90% at 10% 0%,var(--utama2),var(--utama) 55%,#07211f)}
.masuk-kartu{width:min(420px,100%);background:var(--kartu);border-radius:32px;padding:28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.tetes{width:58px;height:58px;border-radius:20px;background:var(--emas-lembut);display:grid;place-items:center;margin-bottom:14px}
.masuk h1{font-size:28px}.masuk p{color:var(--redup);margin:6px 0 18px;font-size:14px}
.medan{display:block;margin-bottom:12px}
.medan span{display:block;font-size:12px;font-weight:700;color:var(--redup);margin-bottom:5px}
.medan input{width:100%;background:var(--kartu2);border:1.5px solid var(--garis);border-radius:18px;padding:14px 16px;font-size:16px}
.medan input.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:700}
.pemisah{display:flex;align-items:center;gap:10px;color:var(--redup);font-size:12px;margin:16px 0 12px}
.pemisah::before,.pemisah::after{content:"";flex:1;height:1px;background:var(--garis)}
.pil.unduh{width:100%;padding:14px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--utama);color:#fff}
.pesan-salah{background:var(--turun-lembut);color:var(--turun);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}

/* ---------- Lembar tawaran pasang (muncul sendiri dari bawah) ---------- */
.tawar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:30;max-width:460px;margin:0 auto;background:var(--kartu);color:var(--tinta);border-radius:26px;padding:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.38);display:flex;gap:12px;align-items:center;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
.tawar.muncul{transform:none}
.tawar img{width:54px;height:54px;border-radius:16px;flex:none}
.tawar .isi{flex:1;min-width:0}.tawar .isi b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}.tawar .isi span{font-size:12.5px;color:var(--redup);line-height:1.3;display:block}
.tawar .aksi{display:flex;flex-direction:column;gap:6px;flex:none}
@media (prefers-reduced-motion:reduce){.tawar{transition:none}}

/* ---------- Keuangan: kalimat ringkasan + alur omzet -> laba bersih ---------- */
.kalimat{font-size:14.5px;line-height:1.65;background:var(--kartu2);border-radius:var(--r-kecil);padding:12px 14px;margin:0 0 12px}
.alur .baris-data{border-bottom:0;padding:9px 12px}
.alur .baris-data .kiri{font-weight:600}
.alur .alur-hasil{background:var(--kartu2);border-radius:14px;margin:6px 0;font-size:16px}
.alur .alur-akhir{background:var(--emas-lembut);font-size:18px;padding:13px 12px}
.alur .alur-akhir .kanan{font-family:var(--serif);font-size:22px}

/* ---------- Harga toko (pemilik mengisi, karyawan membaca) ---------- */
.kepala .tab-baris{margin:16px -16px 0;padding-bottom:0}
.kepala .tab{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.kepala .tab.aktif{background:var(--emas);color:#2a1e02}
.daftar-toko{display:grid;gap:10px;margin-top:12px}
@media (min-width:640px){.daftar-toko{grid-template-columns:1fr 1fr}}
.toko{background:var(--kartu2);border-radius:var(--r-kecil);padding:12px 14px;min-width:0}
.toko.mati{opacity:.55}
.toko-nama{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2}
.toko-nama .keping{font-family:var(--sans)}
.toko-nama .pil{padding:3px 11px;font-size:15px;line-height:1.2;flex:none}
.toko-harga{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hp{display:block;min-width:0}
.hp .l{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--redup);font-weight:700}
.hp .l small{letter-spacing:0;text-transform:none;font-weight:500}
.hp b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;margin-top:2px}
.hp small{display:block;color:var(--redup);font-size:11.5px;margin-top:2px}
.hp .isian{margin-top:3px;padding:8px 10px}
.isian.ubah{border-color:var(--emas);background:var(--emas-lembut);font-weight:700}

/* ---------- Dialog ---------- */
.tirai{position:fixed;inset:0;background:rgba(5,20,18,.55);backdrop-filter:blur(3px);display:grid;place-items:end center;z-index:20;padding:16px}
@media (min-width:640px){.tirai{place-items:center}}
.dialog{width:min(440px,100%);background:var(--kartu);border-radius:28px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.dialog h3{font-size:21px;margin-bottom:6px}
.pin-besar{font-family:var(--serif);font-size:40px;letter-spacing:.18em;text-align:center;background:var(--emas-lembut);border-radius:20px;padding:14px;margin:14px 0}
.tombol-baris{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="akar"></div>

<script>
/* =====================================================================================================
   ABSENSI & GAJI — satu berkas, tanpa build tool.
   Alur: layar masuk -> fungsi database memberi "token" -> token disimpan di HP -> data diambil pakai token.
   Pemilik mendapat semua karyawan dan bisa menyimpan. Karyawan hanya mendapat datanya sendiri (dijaga di
   database, bukan di sini: fungsi minyak_data tidak pernah mengirim data orang lain ke HP karyawan).
   ===================================================================================================== */
const SB_URL = 'https://hzxfheydtrjhizbwbddh.supabase.co';
const SB_KEY = 'sb_publishable_3c_5VhfP4Z9g1dSU9c00HQ_0QkuiHTm';   // kunci publik: aman berada di halaman
const LS = 'absensi-sesi';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const akar = $('#akar');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const ribu = n => Math.round(n || 0).toLocaleString('id-ID');
const HN = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
const HS = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* ---------- Memanggil fungsi database (PostgREST: POST /rest/v1/rpc/<nama_fungsi>) ---------- */
async function rpc(fn, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('Server tidak menjawab (' + r.status + '). Cek internet lalu coba lagi.');
  return r.json();
}
const sesi = { baca() { try { return JSON.parse(localStorage.getItem(LS)); } catch { return null; } },
  tulis(v) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} }, hapus() { try { localStorage.removeItem(LS); } catch {} } };

/* ---------- Hitungan gaji: disalin apa adanya dari panel lama supaya angkanya sama persis ---------- */
function syncHm(e) { (e.minggu || []).forEach(w => { if (!Array.isArray(w.hmd)) { w.hmd = [0, 0, 0, 0, 0, 0, 0]; w.hmx = num(w.hm) || 0; }
  w.hmd = w.hmd.map(num).concat([0, 0, 0, 0, 0, 0, 0]).slice(0, 7); w.hmx = num(w.hmx); w.hm = w.hmd.reduce((a, b) => a + b, 0) + w.hmx; }); }
function syncHb(e) { e.hutang = e.hutang || [];
  (e.minggu || []).forEach(w => { if (w.hbx === undefined) { const v = num(w.hb); if (v > 0 && num(w.w) >= 18) { e.hutang.push({ tgl: '', ket: 'Potongan gaji minggu ' + num(w.w), pinjam: 0, bayar: v, wk: num(w.w) }); w.hbx = 0; } else w.hbx = v; } });

  $('#bMuat').onclick = () => { if (kotor.size && !confirm('Perubahan yang belum disimpan akan hilang. Lanjut?')) return; mulai().then(() => { if (sesi.baca()?.peran === 'pemilik') layarPemilik(); }); };
  $('#bSimpan').onclick = simpan;
  gambar(); siapkanPasang();
}
function gambar() { gambarTab(); kini === '__ringkasan__' ? gambarRingkasan() : bacaSaja ? gambarKaryawanBaca(kini) : gambarKaryawan(kini); }
function gambarTab() {
  const urut = Object.keys(data).sort((a, b) => (data[b].aktif ? 1 : 0) - (data[a].aktif ? 1 : 0) || data[a].nama.localeCompare(data[b].nama));
  $('#tab').innerHTML = `<button class="tab ${kini === '__ringkasan__' ? 'aktif' : ''}" data-k="__ringkasan__">Ringkasan</button>` +
    urut.map(k => `<button class="tab ${k === kini ? 'aktif' : ''} ${data[k].aktif ? '' : 'mati'}" data-k="${esc(k)}">${esc(data[k].nama)}${kotor.has(k) ? ' •' : ''}</button>`).join('') +
    (bacaSaja ? '' : `<button class="tab tambah" id="bBaru">+ Karyawan</button>`);
  $$('#tab [data-k]').forEach(b => b.onclick = () => { kini = b.dataset.k; gambar(); scrollTo({ top: 0 }); });
  const bBaru = $('#bBaru'); if (bBaru) bBaru.onclick = () => dialog(`<h3>Karyawan baru</h3><label class="medan"><span>Nama</span><input id="nNama" placeholder="mis. Budi"></label><div id="nPesan"></div>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil" id="nOk">Tambah</button></div>`, (t, tutup) => {
    $('#nNama', t).focus(); $('#nOk', t).onclick = () => { const n = $('#nNama', t).value.trim(), k = slug(n);
      if (!k) return; if (data[k] || k === 'pemilik') { $('#nPesan', t).innerHTML = '<div class="pesan-salah">Nama itu sudah ada.</div>'; return; }
      data[k] = { nama: n.replace(/\S+/g, x => x[0].toUpperCase() + x.slice(1).toLowerCase()), aktif: true, minggu: [], hutang: [] }; kini = k; tandai(k); tutup(); gambar(); }; });
}

function gambarRingkasan() {
  const wl = semuaMinggu(), isi = $('#isi');
  if (!wl.length) { isi.innerHTML = '<section class="kartu">Belum ada data minggu. Pilih karyawan di atas lalu tekan "+ Minggu baru".</section>'; return; }
  if (!wl.includes(mingguRingkas)) mingguRingkas = wl[wl.length - 1];
  const daftar = Object.entries(data).filter(([, e]) => e.aktif).sort((a, b) => a[1].nama.localeCompare(b[1].nama));
  const baris = daftar.map(([k, e]) => { const c = hitung(e), w = c.wks.find(x => num(x.w) === mingguRingkas);
    return { k, nama: e.nama, ada: !!w, per: w?.periode || '', masuk: w?.masuk || 0, total: w?.total || 0, hm: num(w?.hm), hb: num(w?.hb), terima: w?.terima || 0, sisa: c.sisa, rinci: w ? rincianHm(w) : '' }; });
  const T = f => baris.reduce((a, r) => a + r[f], 0), mx = Math.max(1, ...baris.map(r => r.terima)), per = (baris.find(r => r.per) || {}).per || '';
  const nonaktif = Object.values(data).filter(e => !e.aktif);
  isi.innerHTML = `<section class="kartu"><h2>Minggu ${mingguRingkas}<select id="pilihMinggu" class="isian" style="width:auto" aria-label="Pilih minggu">${[...wl].reverse().map(w => `<option ${w === mingguRingkas ? 'selected' : ''}>${w}</option>`).join('')}</select></h2>
      <div class="catatan" style="margin:-6px 0 12px">${per ? 'Periode ' + esc(per) + ' · ' : ''}${daftar.length} karyawan aktif</div>
      <div class="kisi"><div class="kotak emas"><div class="l">Yang harus dibayar</div><div class="v">${rp(T('terima'))}</div></div>
        <div class="kotak"><div class="l">Total gaji</div><div class="v">${rp(T('total'))}</div></div>
        <div class="kotak"><div class="l">Potongan mingguan</div><div class="v">${rp(T('hm'))}</div></div>
        <div class="kotak"><div class="l">Potongan hutang besar</div><div class="v">${rp(T('hb'))}</div></div>
        <div class="kotak merah"><div class="l">Sisa hutang besar</div><div class="v">${rp(T('sisa'))}</div></div></div></section>
    <section class="kartu"><h2>Per karyawan</h2>
      ${baris.map(r => `<button class="orang ${r.ada ? '' : 'kosong'}" data-ke="${esc(r.k)}"><span class="nama">${esc(r.nama)}</span><span class="bayar">${r.ada ? rp(r.terima) : '—'}</span>
        <span class="garis-batang"><i style="width:${Math.round(r.terima / mx * 100)}%"></i></span>
        <span class="rinci">${r.ada ? `<span class="keping">${r.masuk} hari</span><span class="keping">Gaji ${rp(r.total)}</span>${r.hm ? `<span class="keping" title="${esc(r.rinci)}">Mingguan − ${rp(r.hm)}</span>` : ''}${r.hb ? `<span class="keping">Hutang besar − ${rp(r.hb)}</span>` : ''}` : '<span class="keping">belum ada minggu ini</span>'}
        ${r.sisa > 0 ? `<span class="keping merah">Sisa hutang ${rp(r.sisa)}</span>` : ''}${punyaPin[r.k] ? '' : '<span class="keping merah">belum punya PIN</span>'}</span></button>`).join('')}
      <div class="catatan">${bacaSaja ? 'Ketuk nama untuk melihat rincian gaji, absensi, dan hutangnya.' : 'Ketuk nama untuk mengisi gaji.'} Karyawan nonaktif tidak dihitung di sini.</div></section>
    ${nonaktif.length ? `<section class="kartu"><h2>Nonaktif</h2><div class="catatan" style="margin:0">${nonaktif.map(e => esc(e.nama)).join(', ')} — tidak bisa masuk ke aplikasi.</div></section>` : ''}`;
  $('#pilihMinggu').onchange = ev => { mingguRingkas = num(ev.target.value); gambarRingkasan(); };

}

function gambarKaryawan(k) {
  const e = data[k], isi = $('#isi'); if (!e) { kini = '__ringkasan__'; return gambar(); }
  const c = hitung(e), akhir = c.wks[c.wks.length - 1];

  isi.innerHTML = `<section class="kartu"><h2>${esc(e.nama)} <span style="display:flex;gap:6px;flex-wrap:wrap"><button class="pil halus kecil" id="bPin">${punyaPin[k] ? 'PIN baru' : 'Buat PIN'}</button><button class="pil halus kecil" id="bAktif">${e.aktif ? 'Nonaktifkan' : 'Aktifkan'}</button></span></h2>
      <div class="kisi"><div class="kotak emas"><div class="l">Diterima minggu ${akhir ? esc(akhir.w) : '—'}</div><div class="v" id="kTerima">${akhir ? rp(akhir.terima) : '—'}</div></div>
        <div class="kotak ${c.sisa > 0 ? 'merah' : ''}"><div class="l">Sisa hutang besar</div><div class="v" id="kSisa">${rp(c.sisa)}</div></div>
        <div class="kotak"><div class="l">Akses aplikasi</div><div class="v" style="font-size:15px;font-family:var(--sans);font-weight:700">${!e.aktif ? 'Nonaktif' : punyaPin[k] ? 'Sudah punya PIN' : 'Belum punya PIN'}</div></div></div></section>
    <section class="kartu"><h2>Absensi & gaji per minggu <button class="pil kecil" id="bMinggu">+ Minggu baru</button></h2><div id="daftarMinggu"></div>
      <div class="catatan">Isi gaji harian di kotak hari; kosong berarti tidak masuk. Potongan hutang besar tidak diketik di sini, isinya otomatis dari tabel Hutang besar di bawah.</div></section>
    <section class="kartu"><h2>Hutang besar <button class="pil kecil" id="bHutang">+ Tambah</button></h2><div id="daftarHutang"></div>
      <div class="catatan" id="ringkasHutang"></div></section>`;

  const gambarMinggu = () => { const c2 = hitung(e);
    const urutan = [...c2.wks].map((w, i) => ({ w, i })).reverse(), tampil = semuaTampil[k] ? urutan : urutan.slice(0, 4);
    $('#daftarMinggu').innerHTML = tampil.map(({ w, i }, urut) => { const terbuka = buka[k + ':' + i] ?? urut === 0;
      return `<div class="minggu" data-i="${i}"><div class="minggu-kepala"><input class="isian angka no" data-f="w" value="${esc(w.w)}" inputmode="numeric" aria-label="Nomor minggu">
          <input class="isian per" data-f="periode" value="${esc(w.periode || '')}" placeholder="Periode, mis. 14 - 19 September 2026" aria-label="Periode">
          <button class="pil halus kecil" data-lipat>${terbuka ? 'Tutup' : 'Buka'}</button><button class="pil bahaya kecil" data-hapus aria-label="Hapus minggu">Hapus</button></div>
        <div ${terbuka ? '' : 'hidden'} data-badan><div class="kisi7">${HN.map((d, di) => `<div><label for="h-${i}-${di}">${HS[di]}</label><input id="h-${i}-${di}" class="isian" data-h="${di}" value="${w.hari[di] || ''}" placeholder="—" inputmode="numeric"></div>`).join('')}</div>
          <div class="sub-judul"><span>Hutang mingguan per hari</span></div>
          <div class="kisi7">${HN.map((d, di) => `<div><input class="isian" data-hd="${di}" value="${w.hmd[di] || ''}" placeholder="0" inputmode="numeric" aria-label="Hutang ${d}"></div>`).join('')}</div>
          <div class="sub-judul"><span>Hutang mingguan lain-lain</span><input class="isian angka" style="width:130px" data-hx value="${w.hmx || ''}" placeholder="0" inputmode="numeric"></div></div>
        <div class="hasil"><span class="keping"><b data-o="masuk">${w.masuk}</b> hari</span><span class="keping">Total <b data-o="total">${rp(w.total)}</b></span><span class="keping">Mingguan − <b data-o="hm">${rp(w.hm)}</b></span>
          <span class="keping">Hutang besar − <b data-o="hb">${rp(w.hb)}</b></span><span class="keping hijau">Diterima <b data-o="terima">${rp(w.terima)}</b></span></div></div>`; }).join('') + (urutan.length > tampil.length ? `<button class="pil halus" id="bLama" style="width:100%">Tampilkan ${urutan.length - tampil.length} minggu yang lebih lama</button>` : '') || '<div class="catatan" style="margin:0">Belum ada minggu. Tekan "+ Minggu baru".</div>';
    const bl = $('#bLama'); if (bl) bl.onclick = () => { semuaTampil[k] = true; gambarMinggu(); };
    $$('#daftarMinggu .minggu').forEach(el => { const i = +el.dataset.i, w = e.minggu[i];
      const segar = () => { const x = hitung(e).wks[i]; ['masuk'].forEach(f => $(`[data-o=${f}]`, el).textContent = x[f]); ['total', 'hm', 'hb', 'terima'].forEach(f => $(`[data-o=${f}]`, el).textContent = rp(x[f])); segarAtas(); };
      $$('[data-h]', el).forEach(inp => inp.oninput = () => { w.hari[+inp.dataset.h] = num(inp.value); tandai(k); segar(); });
      $$('[data-hd]', el).forEach(inp => inp.oninput = () => { w.hmd[+inp.dataset.hd] = num(inp.value); tandai(k); segar(); });
      $('[data-hx]', el).oninput = ev => { w.hmx = num(ev.target.value); tandai(k); segar(); };
      $('[data-f=w]', el).onchange = ev => { w.w = num(ev.target.value); tandai(k); gambarMinggu(); gambarHutang(); };
      $('[data-f=periode]', el).oninput = ev => { w.periode = ev.target.value; tandai(k); };
      $('[data-lipat]', el).onclick = () => { const b = $('[data-badan]', el); b.hidden = !b.hidden; buka[k + ':' + i] = !b.hidden; $('[data-lipat]', el).textContent = b.hidden ? 'Buka' : 'Tutup'; };
      $('[data-hapus]', el).onclick = () => { if (!confirm(`Hapus minggu ${w.w} milik ${e.nama}?`)) return; e.minggu.splice(i, 1); tandai(k); gambarMinggu(); gambarHutang(); segarAtas(); }; }); };

  const gambarHutang = () => { const c2 = hitung(e), pil = [...c2.wks].reverse().map(w => num(w.w));
    $('#daftarHutang').innerHTML = e.hutang.map((d, i) => `<div class="hutang-baris" data-i="${i}"><input class="isian" data-hf="tgl" value="${esc(d.tgl || '')}" placeholder="2026-09-17" aria-label="Tanggal">
        <input class="isian lebar" data-hf="ket" value="${esc(d.ket || '')}" placeholder="Keterangan" aria-label="Keterangan">
        <input class="isian angka" data-hf="pinjam" value="${d.pinjam || ''}" placeholder="Pinjam" inputmode="numeric" aria-label="Pinjam">
        <input class="isian angka" data-hf="bayar" value="${d.bayar || ''}" placeholder="Bayar" inputmode="numeric" aria-label="Bayar">
        <select class="isian" data-hw aria-label="Potong dari gaji minggu"><option value="0">Tunai (tidak potong gaji)</option>${pil.map(w => `<option value="${w}" ${num(d.wk) === w ? 'selected' : ''}>Potong gaji minggu ${w}</option>`).join('')}</select>
        <button class="pil bahaya kecil" data-hhapus>Hapus</button></div>`).join('') || '<div class="catatan" style="margin:0">Tidak ada hutang besar.</div>';
    $('#ringkasHutang').textContent = `Sisa ${rp(c2.sisa)} = pinjam ${rp(c2.pinjam)} − dibayar ${rp(c2.bayar + c2.cicil)} (potongan gaji ${rp(c2.potgaji + c2.cicil)} + tunai ${rp(c2.tunai)}). Pilih "Potong gaji minggu" kalau uangnya dipotong dari gaji; angkanya otomatis mengurangi gaji minggu itu.`;
    $$('#daftarHutang .hutang-baris').forEach(el => { const i = +el.dataset.i, d = e.hutang[i];
      $$('[data-hf]', el).forEach(inp => inp.oninput = () => { const f = inp.dataset.hf; d[f] = (f === 'pinjam' || f === 'bayar') ? num(inp.value) : inp.value; tandai(k); if (f === 'pinjam' || f === 'bayar') { gambarMinggu(); segarHutangTeks(); } });
      $('[data-hw]', el).onchange = ev => { d.wk = num(ev.target.value); tandai(k); gambarMinggu(); segarHutangTeks(); };
      $('[data-hhapus]', el).onclick = () => { if (!confirm('Hapus baris hutang ini?')) return; e.hutang.splice(i, 1); tandai(k); gambarHutang(); gambarMinggu(); }; }); };
  const segarHutangTeks = () => { const c2 = hitung(e); $('#ringkasHutang').textContent = `Sisa ${rp(c2.sisa)} = pinjam ${rp(c2.pinjam)} − dibayar ${rp(c2.bayar + c2.cicil)} (potongan gaji ${rp(c2.potgaji + c2.cicil)} + tunai ${rp(c2.tunai)}).`; segarAtas(); };
  const segarAtas = () => { const c2 = hitung(e), a = c2.wks[c2.wks.length - 1]; $('#kTerima').textContent = a ? rp(a.terima) : '—'; $('#kSisa').textContent = rp(c2.sisa); gambarTab(); };

  gambarMinggu(); gambarHutang();
  $('#bMinggu').onclick = () => { const mx = Math.max(0, ...e.minggu.map(w => num(w.w))), semua = Math.max(mx, ...semuaMinggu()), baru = Math.max(mx + 1, semua);
    const per = (Object.values(data).flatMap(x => x.minggu || []).find(w => num(w.w) === baru) || {}).periode || '';
    e.minggu.push({ w: baru, periode: per, hari: [0, 0, 0, 0, 0, 0, 0], hmd: [0, 0, 0, 0, 0, 0, 0], hmx: 0, hm: 0, hb: 0, hbx: 0 }); e.minggu.sort((a, b) => num(a.w) - num(b.w)); buka = {}; tandai(k); gambarMinggu(); gambarHutang(); segarAtas(); };
  $('#bHutang').onclick = () => { e.hutang.push({ tgl: new Date().toLocaleDateString('sv-SE'), ket: '', pinjam: 0, bayar: 0, wk: 0 }); tandai(k); gambarHutang(); };
  $('#bAktif').onclick = () => { e.aktif = !e.aktif; tandai(k); gambar(); };
  $('#bPin').onclick = () => buatPin(k);
}

/* PIN baru: dibuat acak di HP pemilik, dikirim ke database (disimpan sebagai hash), lalu ditampilkan SEKALI untuk diteruskan. */
async function buatPin(k) { const e = data[k];
  if (kotor.has(k) && !(await simpan())) return;
  const a = new Uint32Array(1); let pin; do { crypto.getRandomValues(a); pin = String(a[0] % 1e6).padStart(6, '0'); } while (/^(\d)\1{5}$/.test(pin) || '0123456789 9876543210'.includes(pin));
  try { const r = await rpc('minyak_atur_pin', { p_token: sesi.baca().token, p_kode: k, p_pin: pin }); if (!r.ok) return status(r.pesan, 'salah'); } catch (err) { return status(err.message, 'salah'); }
  punyaPin[k] = true; gambar();
  const link = location.origin + location.pathname + '?k=' + encodeURIComponent(k);
  const pesan = `Halo ${e.nama}, ini aplikasi Minyak Andre untuk melihat absensi dan gajimu.\n\nBuka: ${link}\nPIN: ${pin}\n\nPIN hanya untukmu, jangan dibagikan. Bisa diganti dari dalam aplikasi.`;
  dialog(`<h3>PIN ${esc(e.nama)}</h3><p class="catatan" style="margin:0">PIN ini hanya ditampilkan sekali. PIN lama (kalau ada) sudah tidak berlaku.</p><div class="pin-besar">${pin}</div>
    <div class="catatan" style="word-break:break-all">${esc(link)}</div>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Tutup</button><button class="pil" id="bSalin">Salin pesan</button><a class="pil emas" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(pesan)}">Kirim WhatsApp</a></div>`,
    t => { $('#bSalin', t).onclick = async ev => { try { await navigator.clipboard.writeText(pesan); ev.target.textContent = 'Tersalin'; } catch { ev.target.textContent = 'Gagal menyalin'; } }; }); }

async function simpan() { if (!kotor.size) { status('Tidak ada perubahan', 'ok'); return true; }
  const kirim = {}; for (const k of kotor) { const e = data[k]; hitung(e); e.minggu = e.minggu.filter(w => num(w.w) > 0).sort((a, b) => num(a.w) - num(b.w)); kirim[k] = e; }
  status('Menyimpan…'); $('#bSimpan').disabled = true;
  try { const r = await rpc('minyak_simpan', { p_token: sesi.baca().token, p_semua: kirim });
    if (!r.ok) { status(r.pesan, 'salah'); if (/pemilik|Sesi/.test(r.pesan)) { sesi.hapus(); layarMasuk(r.pesan); } return false; }
    kotor.clear(); gambarTab(); status(`Tersimpan ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} · karyawan langsung melihat angka baru`, 'ok'); return true;
  } catch (err) { status(err.message, 'salah'); return false; } finally { const b = $('#bSimpan'); if (b) b.disabled = false; } }

async function muatKeuangan() { if (keu) return keu;
  const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'keuangan' });
  if (!r.ok) throw new Error(r.pesan); keu = r.nilai; keuDiubah = r.diubah; return keu; }

function kepalaPemilik(judul, keterangan, kembali) {
  return `<header class="kepala" style="padding-bottom:30px"><div class="bungkus"><div class="baris"><div><div class="label">Minyak Andre · ${kembali ? 'Dashboard' : bacaSaja ? 'Bos · hanya melihat' : 'Pemilik'}</div><h1>${judul}</h1><p>${keterangan}</p></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${kembali ? '<button class="pil kaca kecil" id="bBeranda">← Beranda</button>' : '<button class="pil emas kecil" data-pasang hidden>Download</button><button class="pil kaca kecil" id="bSandi">Ganti sandi</button><button class="pil kaca kecil" id="bKeluar">Keluar</button>'}</div></div></div></header>`; }

async function layarBeranda() {
  const wl = semuaMinggu(), w = wl[wl.length - 1];
  const bayar = w ? Object.values(data).filter(e => e.aktif).reduce((a, e) => a + (hitung(e).wks.find(x => num(x.w) === w)?.terima || 0), 0) : 0;
  const sisaHutang = Object.values(data).filter(e => e.aktif).reduce((a, e) => a + hitung(e).sisa, 0);
  akar.innerHTML = kepalaPemilik('Dashboard Minyak', bacaSaja ? 'Melihat absensi & gaji, keuangan, harga toko, dan laporan. Akun ini tidak bisa mengubah apa pun.' : 'Absensi, gaji, keuangan, dan laporan usaha minyak di satu tempat.', false) +
  `<main class="bungkus">
    <section class="besar angkat" style="margin-top:-18px"><div class="label">Gaji yang harus dibayar · minggu ${w || '—'}</div><div class="nilai">${rp(bayar)}</div>
      <div class="keping-baris"><span class="keping"><b>${Object.values(data).filter(e => e.aktif).length}</b> karyawan aktif</span><span class="keping">Sisa hutang besar <b>${rp(sisaHutang)}</b></span><span class="keping" id="kepingLaba">Laba bersih …</span></div></section>
    <section class="menu">
      <button class="ubin" data-ke="gaji"><span class="ik">${ikon('gaji')}</span><b>Absensi & Gaji</b><small>${bacaSaja ? 'Gaji, absensi, dan hutang tiap karyawan (hanya melihat)' : 'Isi gaji harian, potongan, hutang, dan PIN karyawan'}</small></button>
      <button class="ubin" data-ke="keuangan"><span class="ik emas">${ikon('uang')}</span><b>Keuangan</b><small>Laporan laba rugi per bulan: omzet, modal, biaya, gaji, laba bersih</small></button>
      <button class="ubin" data-ke="pembelian"><span class="ik emas">${ikon('beli')}</span><b>Pembelian minyak</b><small>Minyak yang dibeli dari pemasok di jalan, dihitung sejak 24 Sep 2026</small></button>
      <button class="ubin" data-ke="harga"><span class="ik">${ikon('toko')}</span><b>Harga Toko</b><small>${bacaSaja ? 'Harga curah & dus tiap toko' : 'Harga curah & dus tiap toko; karyawan ikut melihatnya'}</small></button>
      <button class="ubin" data-ke="laporan"><span class="ik emas">${ikon('pdf')}</span><b>Laporan PDF</b><small>Slip gaji, rekap gaji mingguan, laporan laba rugi bulanan</small></button>
      <button class="ubin" id="ubinHarian" data-laporan="laporan-harian"><span class="ik emas">${ikon('harian')}</span><b>Laporan harian</b><small>Rincian penjualan per hari minggu ${w || ''}</small></button>
      <button class="ubin" data-laporan="dashboard"><span class="ik">${ikon('grafik')}</span><b>Dashboard bulanan</b><small>Laporan per bulan dengan grafik tren</small></button>
      ${bacaSaja ? '' : `<button class="ubin" id="ubinBagi"><span class="ik emas">${ikon('bagi')}</span><b>Bagikan ke karyawan</b><small>Kirim link aplikasi supaya mereka bisa memasang</small></button>`}
    </section>
    <section class="kartu" id="kartuPembaruan" hidden style="margin-top:14px"></section>
    <div class="catatan" style="text-align:center;margin-top:18px">${bacaSaja ? 'Akun bos hanya bisa melihat. Mengubah data hanya bisa dari akun pemilik.' : 'Halaman ini hanya untuk pemilik. Karyawan yang masuk hanya melihat gajinya sendiri.'}</div></main>`;
  $('#bKeluar').onclick = keluar; $('#bSandi').onclick = () => dialogGanti('pemilik'); const ub = $('#ubinBagi'); if (ub) ub.onclick = bagikan; siapkanPasang();
  $$('.ubin[data-laporan]').forEach(b => b.onclick = () => bukaLaporan(b.dataset.laporan));
  tampilkanPembaruan();
  $$('.ubin[data-ke]').forEach(b => b.onclick = () => ({ gaji: layarPemilik, keuangan: layarKeuangan, laporan: layarLaporan, harga: bacaSaja ? layarHargaBaca : layarHarga, pembelian: layarPembelian })[b.dataset.ke]());
  try { const k = await muatKeuangan(), bl = bulanKeu(k)[0]; const el = $('#kepingLaba'); if (el) el.innerHTML = `Laba bersih ${esc(bl.nama.split(' ')[0])} <b>${rp(bl.tot.bersih)}</b>`;
    const mh = Math.max(...k.WK); const u = $('#ubinHarian'); if (u) $('small', u).textContent = `Rincian penjualan per hari minggu ${mh}`;
  } catch { const el = $('#kepingLaba'); if (el) el.remove(); }
}

// Laporan harian & dashboard bergrafik: halaman HTML-nya disimpan di database oleh pembaruan otomatis
// (alat/perbarui-otomatis.mjs, dijalankan n8n tiap Excel penjualan disimpan), lalu ditampilkan di sini.
// Kalau belum ada di database, jatuh ke versi Docfarm yang lama.
const DOCFARM = { 'laporan-harian': 'https://doc.farm/laporan-harian-minyak-minggu-', dashboard: 'https://doc.farm/dashboard-keuangan-minyak' };
async function bukaLaporan(kunci) {
  const lapis = document.createElement('div');
  lapis.style.cssText = 'position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column';
  lapis.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #e5e7e3;background:#fff">
    <button class="pil kecil" id="tutupLaporan" style="white-space:nowrap;flex:none">← Kembali</button><b style="font-size:15px;white-space:nowrap">${kunci === 'dashboard' ? 'Dashboard bulanan' : 'Laporan harian'}</b>
    <span class="catatan" id="waktuLaporan" style="margin-left:auto;text-align:right;font-size:12px"></span></div><div style="flex:1;display:grid;place-items:center">Memuat…</div>`;
  document.body.appendChild(lapis); document.body.style.overflow = 'hidden';
  const tutup = () => { lapis.remove(); document.body.style.overflow = ''; };
  $('#tutupLaporan', lapis).onclick = tutup;
  try {
    const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: kunci });
    if (!r.ok) throw new Error(r.pesan);
    if (!r.nilai?.html) { tutup(); const k = await muatKeuangan().catch(() => null);
      window.open(kunci === 'dashboard' ? DOCFARM.dashboard : DOCFARM[kunci] + (k ? Math.max(...k.WK) : ''), '_blank', 'noopener'); return; }
    const bingkai = document.createElement('iframe');
    bingkai.style.cssText = 'flex:1;width:100%;border:0'; bingkai.title = 'Laporan'; bingkai.srcdoc = r.nilai.html;
    lapis.lastElementChild.replaceWith(bingkai);
    $('#waktuLaporan', lapis).textContent = new Date(r.diubah).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  } catch (e) { lapis.lastElementChild.innerHTML = `<div class="pesan-salah">${esc(e.message)}</div>`; }
}

// Kartu "Pembaruan otomatis": kapan Excel terakhir terbaca dan catatan singkat dari Gemini.
async function tampilkanPembaruan() {
  const el = $('#kartuPembaruan'); if (!el) return;
  try {
    const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'pembaruan' });
    const p = r.ok && r.nilai; if (!p) return;
    const kapan = new Date(r.diubah).toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `<div class="label">Pembaruan otomatis · ${esc(kapan)}</div>
      <p style="margin:6px 0 0">${p.galat ? `<span class="pesan-salah">Pembaruan minggu ${esc(p.minggu)} gagal: ${esc(p.galat)}. Laporan di aplikasi masih versi sebelumnya.</span>`
        : `Minggu ${esc(p.minggu)} terisi sampai <b>${esc(p.hariTerakhir?.hari || '')}</b>${p.tutupMinggu ? `, minggu sudah <b>ditutup</b> dengan gaji ${esc(p.tutupMinggu.gajiBruto)}` : ''}. Laporan harian, dashboard, keuangan, dan harga toko sudah ikut diperbarui.`}</p>
      ${(p.periksa || []).map(t => `<div class="pesan-salah" style="margin-top:8px">${esc(t)}</div>`).join('')}
      ${(p.tokoMirip || []).map(t => `<div class="catatan" style="margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff7e6;color:#7a5200">${esc(t)}</div>`).join('')}
      ${p.ringkasan ? `<p style="margin:10px 0 0;white-space:pre-line">${esc(p.ringkasan)}</p><div class="catatan" style="margin-top:6px">Catatan ditulis Gemini dari angka laporan.</div>` : ''}`;
    el.hidden = false;
    // Pemeriksaan mentor: routine Claude di cloud mengecek ulang kerja agen tiap malam (repo privat minyak-mentor).
    const rm = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'mentor' }).catch(() => null);
    const mt = rm?.ok && rm.nilai;
    // Pesan yang sebenarnya untuk Claude di laptop (nama berkas, nama kolom data, "minta Claude ...") tidak boleh tampil
    // di sini; pemilik hanya mau membaca yang bisa dia kerjakan sendiri (23 Sep 2026). Laptop sudah menyaring, ini lapis kedua.
    const TEKNIS_KATA = /claude di laptop|minta claude|usulan\.md|riwayat\/|aturan-agen|periksa\.mjs|[\w-]+\.(json|mjs|md|py|html|xlsx)\b|rincian(nya)? di /i;
    const TEKNIS_KODE = /\b[a-z]+[A-Z][a-zA-Z]*\b/;   // nama kolom data ditulis gayaSepertiIni; sengaja peka huruf besar
    const teknis = t => TEKNIS_KATA.test(t) || TEKNIS_KODE.test(t);
    const kalimatBersih = t => String(t || '').split(/(?<=\.)\s+/).filter(k => k.trim() && !teknis(k)).join(' ').trim();
    if (mt?.catatan) el.insertAdjacentHTML('beforeend', `<div style="margin-top:14px;padding-top:12px;border-top:1px solid #e5e7e3">
      <div class="label">Pemeriksaan mentor · ${esc(new Date(mt.waktu).toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }))}</div>
      <p style="margin:6px 0 0;white-space:pre-line">${esc(kalimatBersih(mt.catatan) || mt.catatan)}</p>
      ${(mt.masalah || []).filter(t => !teknis(t)).map(t => `<div class="pesan-salah" style="margin-top:8px">${esc(t)}</div>`).join('')}
      <div class="catatan" style="margin-top:6px">Diperiksa Claude: angka laporan dicocokkan ulang dan catatan agen dinilai.</div></div>`);
  } catch { /* kartu tetap tersembunyi */ }
}

/* BULAN: minggu kerja digabung menjadi bulan. Satu minggu masuk ke bulan tempat hari Sabtunya jatuh (tanggal akhir di k.PER),

const BLN_P = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'], BLN_L = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function bulanKeu(k) { const kini = new Date(k.diambil || Date.now()), peta = {};

  try { await muatHarga(true); gambarHarga(); status(harga.toko.length + ' toko dimuat', 'ok'); }
  catch (e) { $('#isiHarga').innerHTML = `<section class="kartu"><div class="pesan-salah">${esc(e.message)}</div></section>`; } }
function gambarHarga() {
  const semua = tokoUrut(), aktif = semua.filter(t => t.aktif !== false), h = hariIni();
  const hariIniN = aktif.filter(t => PRODUK.some(([p]) => hargaKini(t, p)?.tgl === h)).length;
  $('#isiHarga').innerHTML = `<section class="kartu"><h2>Daftar toko<button class="pil kecil" id="bTokoBaru">+ Toko</button></h2>
    <div class="keping-baris" style="margin:0 0 12px"><span class="keping"><b>${aktif.length}</b> toko aktif</span><span class="keping ${hariIniN ? 'hijau' : ''}"><b>${hariIniN}</b> harga diubah hari ini</span></div>
    <input class="isian" id="cariToko" placeholder="Cari toko…" value="${esc(cariToko)}" autocomplete="off" aria-label="Cari toko">
    <div class="daftar-toko" id="daftarToko"></div>
    <div class="catatan">Ketik harga baru hanya di toko yang berubah; kotak yang tidak disentuh tidak ikut disimpan. Harga yang sama dengan sebelumnya tidak dicatat ulang. Tombol ⋯ untuk ganti nama, nonaktifkan, atau melihat riwayat.</div></section>`;
  gambarDaftarToko(); $('#cariToko').oninput = ev => { cariToko = ev.target.value; gambarDaftarToko(); }; $('#bTokoBaru').onclick = dialogTokoBaru; }
function gambarDaftarToko() {
  const el = $('#daftarToko'); if (!el) return;
  el.innerHTML = tokoUrut().filter(cocok).map(t => `<div class="toko ${t.aktif === false ? 'mati' : ''}"><div class="toko-nama"><span>${esc(t.nama)}${t.aktif === false ? ' <span class="keping" style="font-size:11px;padding:2px 8px">nonaktif</span>' : ''}</span><button class="pil halus kecil" data-atur="${esc(t.id)}" aria-label="Atur ${esc(t.nama)}">⋯</button></div>
    <div class="toko-harga">${PRODUK.map(([p, nm, sat]) => { const k = hargaKini(t, p), u = t._ubah?.[p];
      return `<label class="hp"><span class="l">${nm} <small>${sat}</small></span><input class="isian angka ${u !== undefined ? 'ubah' : ''}" inputmode="numeric" data-id="${esc(t.id)}" data-p="${p}" value="${u !== undefined ? ribu(u) : k ? ribu(k.harga) : ''}" placeholder="—"><small>${k ? 'sejak ' + tglPendek(k.tgl) : 'belum ada harga'}</small></label>`; }).join('')}</div></div>`).join('') || '<div class="catatan" style="margin:0">Tidak ada toko yang cocok.</div>';
  $$('input[data-p]', el).forEach(i => { i.onfocus = () => i.select();
    i.oninput = () => { const t = harga.toko.find(x => x.id === i.dataset.id), p = i.dataset.p, v = angkaRp(i.value), k = hargaKini(t, p);
      t._ubah ??= {}; if (!v || (k && v === k.harga)) delete t._ubah[p]; else t._ubah[p] = v;
      i.classList.toggle('ubah', t._ubah[p] !== undefined); hargaKotor = harga.toko.some(x => x._ubah && Object.keys(x._ubah).length) || hargaKotor;
      status(t._ubah[p] !== undefined ? 'Ada harga belum disimpan' : hargaKotor ? 'Ada perubahan belum disimpan' : 'Tidak ada perubahan', hargaKotor ? 'ubah' : ''); };
    i.onblur = () => { if (i.value.trim()) i.value = ribu(angkaRp(i.value)); }; });
  $$('[data-atur]', el).forEach(b => b.onclick = () => dialogToko(b.dataset.atur)); }
const hargaBersih = () => ({ ...harga, toko: harga.toko.map(({ _ubah, ...t }) => t) });
async function simpanHarga() {
  if (!hargaKotor) { status('Tidak ada perubahan', 'ok'); return; }
  const tgl = $('#tglHarga').value || hariIni(); let n = 0;
  harga.toko.forEach(t => { for (const [p, v] of Object.entries(t._ubah || {})) { const r = riwayat(t, p).filter(x => x.tgl !== tgl), akhir = r[r.length - 1];   // tanggal sama = koreksi, timpa
      t[p] = akhir && akhir.harga === v ? r : [...r, { tgl, harga: v }]; n++; } delete t._ubah; });
  status('Menyimpan…');
  try { const r = await rpc('minyak_harga_tulis', { p_token: sesi.baca().token, p_nilai: hargaBersih() }); if (!r.ok) throw new Error(r.pesan);
    hargaDiubah = r.diubah; hargaKotor = false; gambarHarga(); status(n ? `Tersimpan · ${n} harga berlaku sejak ${tglPendek(tgl)}` : 'Tersimpan', 'ok'); }
  catch (e) { status('Gagal menyimpan: ' + e.message, 'salah'); } }
function dialogTokoBaru() {
  dialog(`<h3>Toko baru</h3><label class="medan"><span>Nama toko</span><input id="tNama" placeholder="mis. TK Sinar Jaya"></label>
    ${PRODUK.map(([p, nm, sat]) => `<label class="medan"><span>Harga ${nm.toLowerCase()} (${sat}, boleh kosong)</span><input id="t_${p}" inputmode="numeric" placeholder="mis. 290.000"></label>`).join('')}<div id="tPesan"></div>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil" id="tOk">Tambah</button></div>`, (d, tutup) => { $('#tNama', d).focus();
    $('#tOk', d).onclick = () => { const n = $('#tNama', d).value.trim().replace(/\s+/g, ' '), id = slug(n); if (!id) return;
      if (harga.toko.some(x => x.id === id)) { $('#tPesan', d).innerHTML = '<div class="pesan-salah">Toko itu sudah ada di daftar.</div>'; return; }
      const baru = { id, nama: n, aktif: true, curah: [], dus: [] }, tgl = $('#tglHarga')?.value || hariIni();
      PRODUK.forEach(([p]) => { const v = angkaRp($(`#t_${p}`, d).value); if (v) baru[p] = [{ tgl, harga: v }]; });
      harga.toko.push(baru); hargaKotor = true; cariToko = ''; tutup(); gambarHarga(); status('Toko baru belum disimpan', 'ubah'); }; }); }
function dialogToko(id) { const t = harga.toko.find(x => x.id === id); if (!t) return;
  const riw = PRODUK.map(([p, nm]) => { const r = riwayat(t, p).reverse(); return r.length ? `<div class="sub-judul">Riwayat ${nm.toLowerCase()}</div>` + r.map((x, i) => `<div class="baris-data"><div class="kiri">${esc(tglPanjang(x.tgl))}</div><div class="kanan">${rp(x.harga)}${r[i + 1] ? `<small style="display:block;font-weight:500;color:var(--redup)">${panah(x, r[i + 1])}dari ${rp(r[i + 1].harga)}</small>` : ''}</div></div>`).join('') : ''; }).join('');
  dialog(`<h3>${esc(t.nama)}</h3><label class="medan"><span>Nama toko</span><input id="uNama" value="${esc(t.nama)}"></label>
    <label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px"><input type="checkbox" id="uAktif" ${t.aktif !== false ? 'checked' : ''}> Masih pelanggan (tampil untuk karyawan)</label>

    <div class="tombol-baris">${riw ? '' : '<button class="pil bahaya" id="uHapus">Hapus</button>'}<button class="pil halus" data-tutup>Batal</button><button class="pil" id="uOk">Simpan</button></div>`, (d, tutup) => {
    $('#uOk', d).onclick = () => { const n = $('#uNama', d).value.trim().replace(/\s+/g, ' '); if (n) t.nama = n; t.aktif = $('#uAktif', d).checked; hargaKotor = true; tutup(); gambarHarga(); status('Perubahan toko belum disimpan', 'ubah'); };
    const h = $('#uHapus', d); if (h) h.onclick = () => { if (!confirm('Hapus ' + t.nama + ' dari daftar?')) return; harga.toko = harga.toko.filter(x => x !== t); hargaKotor = true; tutup(); gambarHarga(); status('Toko dihapus, belum disimpan', 'ubah'); }; }); }

/* ---------- PDF: pustaka jsPDF + AutoTable dimuat dari cdnjs hanya saat pertama kali dibutuhkan ---------- */
let pustakaPdf = null;
function muatPdf() { return pustakaPdf ||= (async () => { const muat = src => new Promise((ok, gagal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => gagal(new Error('Gagal memuat pembuat PDF. Cek internet.')); document.head.append(s); });
  await muat('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); await muat('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'); return window.jspdf.jsPDF; })().catch(e => { pustakaPdf = null; throw e; }); }
const HIJAU = [15, 61, 58], EMAS = [213, 154, 28];
async function dokumen(judul, sub) { const JsPDF = await muatPdf(); const doc = new JsPDF({ unit: 'mm', format: 'a4' });
  doc.setFillColor(...HIJAU); doc.rect(0, 0, 210, 30, 'F'); doc.setFillColor(...EMAS); doc.rect(0, 30, 210, 1.2, 'F');
  doc.setTextColor(232, 181, 74); doc.setFontSize(8.5); doc.setFont('helvetica', 'bold'); doc.text('MINYAK ANDRE', 14, 11);
  doc.setTextColor(255, 255, 255); doc.setFontSize(17); doc.text(judul, 14, 19); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(207, 227, 222); doc.text(sub, 14, 25.5);
  doc.setTextColor(22, 48, 44); return doc; }
const gayaTabel = { styles: { font: 'helvetica', fontSize: 9, cellPadding: 2.2, textColor: [22, 48, 44] }, headStyles: { fillColor: HIJAU, textColor: 255, fontStyle: 'bold' }, alternateRowStyles: { fillColor: [244, 248, 243] }, footStyles: { fillColor: [251, 240, 211], textColor: [22, 48, 44], fontStyle: 'bold' }, margin: { left: 14, right: 14 },
  // kepala & kaki tabel ikut rata kanan kalau kolom badannya rata kanan
  didParseCell: d => { if (d.section !== 'body' && d.table.styles?.columnStyles?.[d.column.index]?.halign === 'right') d.cell.styles.halign = 'right'; } };
function tutupDok(doc, nama) { const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(95, 117, 112);
    doc.text('Dibuat ' + new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' }) + ' · halaman ' + i + ' dari ' + n, 14, 290); } doc.save(nama); }
const kanan = kolom => Object.fromEntries(kolom.map(i => [i, { halign: 'right' }]));
async function denganTunggu(fn) { const tutup = dialog('<h3>Menyiapkan PDF…</h3><p class="catatan">Sebentar ya.</p>'); try { await fn(); tutup(); } catch (e) { tutup(); dialog(`<h3>PDF gagal dibuat</h3><p class="catatan">${esc(e.message)}</p><div class="tombol-baris"><button class="pil" data-tutup>Tutup</button></div>`); } }

function pdfSlip(e, w) { return denganTunggu(async () => { const c = hitung(e), m = c.wks.find(x => num(x.w) === num(w)); if (!m) throw new Error('Minggu itu belum ada datanya.');
  const doc = await dokumen('Slip Gaji · ' + e.nama, `Minggu ${m.w}${m.periode ? ' · ' + m.periode : ''}`);
  doc.autoTable({ ...gayaTabel, startY: 38, head: [['Hari', 'Gaji harian', 'Hutang mingguan']], body: HN.map((h, i) => [h, m.hari[i] ? rp(m.hari[i]) : 'tidak masuk', num(m.hmd?.[i]) ? rp(m.hmd[i]) : '-']), columnStyles: kanan([1, 2]) });
  doc.autoTable({ ...gayaTabel, startY: doc.lastAutoTable.finalY + 6, head: [['Rincian', 'Jumlah']], body: [['Hari masuk', m.masuk + ' hari'], ['Total gaji', rp(m.total)], ['Potongan hutang mingguan' + (num(m.hmx) ? ' (termasuk lain-lain ' + rp(m.hmx) + ')' : ''), '- ' + rp(m.hm)], ['Potongan hutang besar', '- ' + rp(m.hb)]],
    foot: [['GAJI DITERIMA', rp(m.terima)]], columnStyles: kanan([1]) });
  if (e.hutang?.length) doc.autoTable({ ...gayaTabel, startY: doc.lastAutoTable.finalY + 6, head: [['Hutang besar', 'Tanggal', 'Pinjam', 'Bayar']], body: e.hutang.map(d => [d.ket || '-', d.tgl || (num(d.wk) ? 'minggu ' + num(d.wk) : '-'), num(d.pinjam) ? rp(d.pinjam) : '-', num(d.bayar) ? rp(d.bayar) : '-']),
    foot: [['Sisa hutang besar', '', '', rp(c.sisa)]], columnStyles: kanan([2, 3]) });
  const y = Math.min(doc.lastAutoTable.finalY + 22, 270); doc.setFontSize(9.5); doc.text('Diterima oleh,', 28, y); doc.text('Pemilik,', 150, y); doc.line(18, y + 20, 72, y + 20); doc.line(138, y + 20, 192, y + 20); doc.text(e.nama, 45, y + 25, { align: 'center' });
  tutupDok(doc, `slip-gaji-${slug(e.nama)}-minggu-${m.w}.pdf`); }); }

function pdfRekapGaji(w) { return denganTunggu(async () => { const baris = Object.values(data).map(e => ({ e, m: hitung(e).wks.find(x => num(x.w) === num(w)), sisa: hitung(e).sisa })).filter(x => x.m).sort((a, b) => a.e.nama.localeCompare(b.e.nama));
  if (!baris.length) throw new Error('Belum ada data minggu itu.'); const T = f => baris.reduce((a, x) => a + num(x.m[f]), 0), per = (baris.find(x => x.m.periode) || { m: {} }).m.periode || '';
  const doc = await dokumen('Rekap Gaji Karyawan', `Minggu ${w}${per ? ' · ' + per : ''} · ${baris.length} karyawan`);
  doc.autoTable({ ...gayaTabel, startY: 38, head: [['Karyawan', 'Masuk', 'Total gaji', 'Hutang mingguan', 'Hutang besar', 'Dibayar', 'Sisa hutang', 'Paraf']], body: baris.map(x => [x.e.nama, x.m.masuk + ' hr', rp(x.m.total), x.m.hm ? rp(x.m.hm) : '-', x.m.hb ? rp(x.m.hb) : '-', rp(x.m.terima), x.sisa > 0 ? rp(x.sisa) : '-', '']),
    foot: [['TOTAL', '', rp(T('total')), rp(T('hm')), rp(T('hb')), rp(T('terima')), rp(baris.reduce((a, x) => a + Math.max(0, x.sisa), 0)), '']], columnStyles: { ...kanan([2, 3, 4, 5, 6]), 7: { cellWidth: 20 } }, styles: { ...gayaTabel.styles, fontSize: 8.5 } });
  tutupDok(doc, `rekap-gaji-minggu-${w}.pdf`); }); }

function pdfKeuangan(key) { return denganTunggu(async () => { const k = await muatKeuangan(), daftar = bulanKeu(k), B = daftar.find(b => b.key === key); if (!B) throw new Error('Bulan itu tidak ada di data keuangan.');
  const lalu = daftar[daftar.indexOf(B) + 1], t = B.tot, R = ringkasKeu(k, B, lalu);
  const doc = await dokumen('Laporan Laba Rugi', `${B.nama}${B.berjalan ? ' (bulan berjalan)' : ''} · ${B.minggu.length} minggu · ${B.hari} hari kerja`);
  // Urutannya sama dengan halaman Keuangan: paragraf, alur laba rugi, minggu yang masuk, pengantar, jenis, biaya, gaji.
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(22, 48, 44);
  const par = doc.splitTextToSize(R.kalimat, 182); doc.text(par, 14, 38);

  doc.autoTable({ ...gayaTabel, startY: 38 + par.length * 4.6 + 4, head: [['Laporan laba rugi', 'Rupiah', '% omzet']],
    body: R.alur.filter(a => a[3] !== 'akhir').map(([n, v, ket, j]) => [tanda(j) + n + '  (' + ket + ')', (j === 'kurang' ? '− ' : '') + rp(v), pc(v / (t.omset || 1))]),
    foot: [['=  LABA BERSIH  (' + ribu(t.qty) + ' unit, ' + rp(t.bersih / (B.hari || 1)) + ' per hari kerja)', rp(t.bersih), pc(t.bersih / (t.omset || 1))]], columnStyles: { 0: { cellWidth: 112 }, ...kanan([1, 2]) } });
  const lanjut = () => doc.lastAutoTable.finalY + 7;
  doc.autoTable({ ...gayaTabel, startY: lanjut(), head: [['Minggu', 'Periode', 'Hari', 'Omzet', 'Laba kotor', 'Biaya + gaji', 'Laba bersih']], body: B.minggu.map(w => { const x = k.D[w].tot; return ['Minggu ' + w, k.PER[w] || '', String(k.HARI[w] || ''), rp(x.omset), rp(x.lk), rp(x.biayaops), rp(x.bersih)]; }),
    foot: [[B.nama, '', String(B.hari), rp(t.omset), rp(t.lk), rp(t.biayaops), rp(t.bersih)]], columnStyles: kanan([2, 3, 4, 5, 6]) });
  const P = Object.entries(B.pengantar).sort((a, b) => (b[1].lk - b[1].ops) - (a[1].lk - a[1].ops)).map(([n, v]) => [judulKecil(n), ribu(v.qty), rp(v.lk), rp(v.ops), rp(v.lk - v.ops)]);
  if (P.length) doc.autoTable({ ...gayaTabel, startY: lanjut(), head: [['Per pengantar', 'Unit', 'Laba kotor', 'Biaya ops', 'Laba setelah biaya']], body: P, columnStyles: kanan([1, 2, 3, 4]) });
  const J = Object.entries(B.jenis).map(([n, v]) => [n, ribu(v.qty), rp(v.omset), rp(v.omset - v.hpp), pc((v.omset - v.hpp) / (v.omset || 1))]);

  const KB = kelompokBiaya(B.biaya).map(x => [x.jenis, x.kali + ' kali · ' + Object.entries(x.orang).map(([o, v]) => o + ' ' + ribu(v)).join(' · '), rp(x.total)]), sisaOps = Math.round(t.ops - B.opsRinci);

  const G = Object.values(B.gaji).sort((a, b) => b.total - a.total).map(x => [judulKecil(x.nama), String(x.n), rp(x.total), rp(x.hm + x.hb), rp(x.terima)]), sisaGaji = Math.round(t.gaji - B.gajiRinci);
  if (sisaGaji > 0) G.push(['Minggu ' + B.tanpaRinci.join(', ') + ' (total saja)', '', rp(sisaGaji), '', '']);
  if (G.length) doc.autoTable({ ...gayaTabel, startY: lanjut(), head: [['Gaji karyawan', 'Minggu', 'Gaji bruto', 'Potongan hutang', 'Diterima']], body: G, foot: [['Total gaji bruto', '', rp(t.gaji), '', '']], columnStyles: kanan([1, 2, 3, 4]) });
  tutupDok(doc, `laporan-laba-rugi-${B.key}.pdf`); }); }

/* =====================================================================================================
   MULAI: ada token tersimpan? ambil data. Tidak ada atau sudah habis? tampilkan layar masuk.
   ===================================================================================================== */
async function mulai() { const s = sesi.baca(); if (!s?.token) return layarMasuk();
  akar.innerHTML = '<main class="masuk"><div style="color:#cfe3de">Memuat…</div></main>'; harga = null;   // harga toko diambil ulang tiap muat
  try { const r = await rpc('minyak_data', { p_token: s.token });
    if (!r.ok) { sesi.hapus(); return layarMasuk(r.pesan); }
    if (r.peran === 'pemilik' || r.peran === 'bos') { bacaSaja = r.peran === 'bos'; data = r.karyawan || {}; punyaPin = r.pin || {}; kotor.clear(); Object.values(data).forEach(hitung); if (kini !== '__ringkasan__' && !data[kini]) kini = '__ringkasan__'; layarBeranda(); status('Data dimuat ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }), 'ok'); }
    else layarKaryawan(r.data, r.diubah);
  } catch (e) { akar.innerHTML = `<main class="masuk"><div class="masuk-kartu"><h1>Tidak tersambung</h1><p>${esc(e.message)}</p><button class="pil emas" onclick="mulai()">Coba lagi</button></div></main>`; } }
addEventListener('beforeunload', ev => { if (kotor.size) { ev.preventDefault(); ev.returnValue = ''; } });
// Enter pindah ke kotak berikutnya (enak untuk mengisi 7 hari berturut-turut)
addEventListener('keydown', ev => { if (ev.key !== 'Enter' || !ev.target.matches('#isi input')) return; ev.preventDefault();
  const semua = $$('#isi input').filter(x => x.offsetParent !== null), i = semua.indexOf(ev.target); (semua[i + 1] || ev.target).focus(); semua[i + 1]?.select?.(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
mulai().finally(() => setTimeout(tawarkanPasang, 900));
</script>
