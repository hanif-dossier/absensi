/* ----- Excel bersusunan lembar harian PENJUALAN MINYAK MINGGU N: blok demi blok ke bawah (ExcelJS dari cdnjs) ----- */
let pustakaXl = null;
const muatExcel = () => pustakaXl ||= new Promise((ok, gagal) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
  s.onload = () => ok(window.ExcelJS); s.onerror = () => { pustakaXl = null; gagal(new Error('Gagal memuat pembuat Excel. Cek internet.')); }; document.head.append(s); });
function excelHarian(h) { return denganTunggu(async () => { const ExcelJS = await muatExcel(), c = hitungHarian(h);
  const d = new Date(h.tgl + 'T00:00:00'), HARI = hariTgl(h.tgl).toUpperCase(), BLN = BLN_L[d.getMonth()].toUpperCase();
  const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet(`${HARI} ${d.getDate()} ${BLN}`.slice(0, 31), { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  // Kolom seperti Excel penjualan: NAMA TOKO, RETUR, KEN, QTY, DUS, kolom berat, HARGA, JUMLAH, TOKO BAYAR, TOKO HUTANG
  const berat = [...new Set(c.b.filter(r => jenisK(r) === 'curah' && r.berat).map(r => r.berat))].sort((a, b) => a - b);
  const kepala = ['NAMA TOKO', 'RETUR', 'KEN', 'QTY', 'DUS', ...berat, 'HARGA', 'JUMLAH', 'TOKO BAYAR', 'TOKO HUTANG'], N = kepala.length, kH = 6 + berat.length;
  ws.columns = kepala.map((_, i) => ({ width: i === 0 ? 36 : i >= kH - 1 ? 15 : 8 }));
  const garis = { style: 'thin', color: { argb: 'FF000000' } }, kotak = { top: garis, left: garis, bottom: garis, right: garis };
  const baris = (v, { tebal, isi } = {}) => { const r = ws.addRow(v); for (let i = 1; i <= N; i++) { const s = r.getCell(i); s.border = kotak; if (tebal) s.font = { bold: true }; if (isi) s.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: isi } }; if (i >= kH) s.numFmt = '#,##0'; } return r; };
  const nilaiKolom = (r, i) => { const k = jenisK(r); return i === 1 ? r.retur : i === 2 ? (k === 'ken' ? r.qty : 0) : i === 3 ? (k === 'curah' ? r.qty : 0) : i === 4 ? (k === 'dus' ? r.qty : 0)
    : i < kH - 1 ? (k === 'curah' && r.berat === berat[i - 5] ? r.qty : 0) : i === kH - 1 ? 0 : i === kH ? jmlBaris(r) : i === kH + 1 ? (r.bayar || 0) : hutangBaris(r); };
  c.bl.forEach((x, bi) => {
    const judul = ws.addRow([`PENJUALAN ${namaBlok(x.B, bi).toUpperCase()} HARI ${HARI} TGL ${d.getDate()} ${BLN} ${d.getFullYear()}`]); ws.mergeCells(judul.number, 1, judul.number, N); judul.getCell(1).font = { bold: true, size: 12 };
    baris(kepala, { tebal: true, isi: 'FFE3EFE7' });
    x.b.forEach(r => { const v = Array(N).fill(null); v[0] = kunciToko(r.toko) + (r.alamat && !kunciToko(r.toko).includes(r.alamat.toUpperCase()) ? ' ' + r.alamat.toUpperCase() : '');
      for (let i = 1; i < N; i++) { const n = nilaiKolom(r, i); if (n) v[i] = n; } if (r.qty && r.harga) v[kH - 1] = r.harga; baris(v); });
    const tot = Array(N).fill(null); tot[0] = 'JUMLAH TOTAL SEMENTARA'; for (let i = 1; i < N; i++) if (i !== kH - 1) tot[i] = sumBy(x.b, r => nilaiKolom(r, i));
    baris(tot, { tebal: true, isi: 'FFFBF3E0' }); ws.addRow([]);
    const rekap = (l, n, tebal) => { const r = ws.addRow([l]); r.getCell(N).value = n; r.getCell(N).numFmt = '#,##0'; if (tebal) { r.getCell(1).font = { bold: true }; r.getCell(N).font = { bold: true }; } };
    rekap('REKAPAN AKHIR', null, true); rekap('TOTAL PENJUMLAHAN TOTAL PENJUALAN', x.jual, true); if (x.hutang) rekap('TOKO HUTANG', x.hutang); if (x.lama) rekap('TOKO BAYAR HUTANG LAMA', x.lama);
    (x.B.keluar || []).forEach(k => rekap(('PENGELUARAN ' + (k.ket || '')).toUpperCase().trim(), k.jumlah));
    (x.B.setor || []).forEach(k => rekap(('SETOR ' + (k.ket || '')).toUpperCase().trim(), k.jumlah));
    rekap('TOTAL KESELURUHAN SELISIH', x.selisih, true); ws.addRow([]); ws.addRow([]); });
  const buf = await wb.xlsx.writeBuffer(), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = namaBerkas('Penjualan', h).replace(/\.pdf$/, '.xlsx'); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }); }

/* ---------- Bebas Hutang (30 Sep 2026) ----------
   Tahap 1 rencana bebas hutang (catatan/2026-09-30-minyak-rencana-bebas-hutang.md): daftar hutang bos, cicilan yang
   sudah dibayar, pengambilan pribadi, dan biaya tetap di luar Excel. Diisi pemilik atau bos sendiri (fungsi
   minyak_nilai_tulis menerima keduanya). Data di minyak_nilai kunci 'hutang-bos':
     { daftar: [{ id, kreditur, jenis, pokokAwal, bungaPersen, cicilan, tglCicil, jatuhTempo, jaminan, tunggakan, catatan,
                  mulai, bayar: [{ id, tgl, jumlah, bunga, ket }] }], prive, tetap: [{ ket, jumlah }] }
   Sisa pokok = pokok awal - (jumlah bayar - bagian bunga). Kemampuan bayar dibandingkan dengan laba bersih rata-rata
   per bulan dari data Keuangan (8 minggu lengkap terakhir x 4,33). Angkanya perkiraan kasar, bukan nasihat keuangan. */
let HB = null;
const JENIS_HUTANG = ['Bank', 'Koperasi', 'Pinjaman online', 'Perorangan / keluarga', 'Pemasok minyak', 'Leasing kendaraan', 'Lainnya'];
async function muatHutangBos() { const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'hutang-bos' }); if (!r.ok) throw new Error(r.pesan);
  const v = r.nilai || {}; v.daftar = Array.isArray(v.daftar) ? v.daftar : []; v.tetap = Array.isArray(v.tetap) ? v.tetap : []; v.prive = +v.prive || 0; v.daftar.forEach(h => { h.bayar = Array.isArray(h.bayar) ? h.bayar : []; }); return v; }
async function simpanHutangBos(ubah) { const v = await muatHutangBos(); ubah(v);
  const r = await rpc('minyak_nilai_tulis', { p_token: sesi.baca().token, p_kunci: 'hutang-bos', p_nilai: v }); if (!r.ok) throw new Error(r.pesan); HB = v; return v; }
const pokokDibayar = h => sumBy(h.bayar, b => Math.max(0, (b.jumlah || 0) - (b.bunga || 0)));
const sisaHutang = h => Math.max(0, (h.pokokAwal || 0) - pokokDibayar(h));
const bungaBulan = h => Math.round(sisaHutang(h) * (h.bungaPersen || 0) / 100);
// Laba bersih rata-rata per bulan dari Keuangan: 8 minggu lengkap terakhir (>= 5 hari kerja) x 4,33
function labaBulanRata(k) { if (!k?.WK) return null; const w = [...k.WK].filter(x => (k.HARI[x] || 0) >= 5).slice(-8); if (!w.length) return null;
  return { bulan: Math.round(sumBy(w, x => k.D[x].tot.bersih) / w.length * 4.33), minggu: w.length, dari: k.PER[w[0]], sampai: k.PER[w.at(-1)] }; }
function ringkasHutang() { const d = HB.daftar, sisa = sumBy(d, sisaHutang), cicilan = sumBy(d, h => h.cicilan), bunga = sumBy(d, bungaBulan), tunggak = sumBy(d, h => h.tunggakan), tetap = sumBy(HB.tetap, x => x.jumlah);
  const laba = labaBulanRata(keu), b30 = (() => { const d = new Date(); d.setDate(d.getDate() - 30); return isoTgl(d); })(), L = labaTertahan(b30, hariIni());
  const tertahan = L ? Math.max(0, L.bersih) : 0, labaTunai = laba ? laba.bulan - tertahan : null, bebas = laba ? labaTunai - HB.prive - tetap - bunga : null;
  return { sisa, cicilan, bunga, tunggak, tetap, laba, L, tertahan, labaTunai, bebas, lunasBulan: bebas > 0 ? Math.ceil(sisa / bebas) : null, cukup: bebas != null ? bebas >= cicilan : null }; }

/* ----- Tahap 2 (neraca) dan tahap 4 (kebocoran) rencana bebas hutang -----
   Neraca: aset yang diisi bos (kas, rekening, mobil, gudang, kendi, stok minyak) + piutang toko dari aplikasi, lawan
   hutang bos. Kebocoran: dihitung dari data yang sudah ada (piutang toko, kendi kosong, harga per toko, margin minggu,
   biaya operasional). Tiap kebocoran diberi taksiran rupiah per bulan dan tindakan. Semua taksiran, bukan angka pasti. */
const HARGA_KENDI = 35000;   // harga kendi kosong yang dipakai di nota (Rp per kendi)
const asetKosong = () => ({ kas: 0, rekening: 0, mobil: 0, mobilKet: '', gudang: 0, gudangKet: '', kendi: 0, kendiHarga: HARGA_KENDI, stokKg: 0 });
function neracaBos() { const A = { ...asetKosong(), ...(HB.aset || {}) }, buku = bukuHutang(), hariIni = new Date(hariIni_());
  const umur = t => t ? Math.round((hariIni - new Date(t + 'T00:00:00')) / 864e5) : 999;
  // piutang toko: sisa per bon (bayar melunasi bon tertua dulu); bon > 90 hari dianggap sulit ditagih
  const bon = buku.flatMap(t => t.bon.filter(x => x.sisa > 0).map(x => ({ ...x, toko: t.toko, umur: umur(x.tgl) })));
  const piutang = sumBy(bon, x => x.sisa), macet = sumBy(bon.filter(x => x.umur > 90), x => x.sisa), kendiKosong = sumBy(buku, t => t.kendi);
  const modal = modalOtomatis(hariIni_()), stokMinyak = Math.round((A.stokKg || 0) * (modal.kg || 0));
  const aset = [['Kas dan rekening', A.kas + A.rekening, 'diisi bos'], ['Piutang toko yang masih bisa ditagih', piutang - macet, `${bon.filter(x => x.umur <= 90).length} bon, umur sampai 90 hari`],
    ['Piutang toko yang mungkin macet', macet, `${bon.filter(x => x.umur > 90).length} bon lebih dari 90 hari, tidak dihitung aset`],
    ['Kendi kosong di toko', kendiKosong * (A.kendiHarga || HARGA_KENDI), `${kendiKosong} kendi belum kembali x ${rp(A.kendiHarga || HARGA_KENDI)}`],
    ['Kendi di gudang', (A.kendi || 0) * (A.kendiHarga || HARGA_KENDI), `${A.kendi || 0} kendi`], ['Stok minyak', stokMinyak, `${angkaId(A.stokKg || 0)} kg x modal ${rp(modal.kg)} per kg`],
    ['Kendaraan', A.mobil, A.mobilKet || 'taksiran harga jual'], ['Gudang / bangunan', A.gudang, A.gudangKet || 'kosongkan kalau sewa']];
  const totalAset = sumBy(aset.filter(x => !/macet/.test(x[0])), x => x[1]), hutang = sumBy(HB.daftar, sisaHutang);
  return { A, aset, totalAset, hutang, bersih: totalAset - hutang, piutang, macet, kendiKosong, bon }; }
const hariIni_ = () => hariIni();

function kebocoran() { const B = [], k = keu, buku = bukuHutang(), N = neracaBos(), hariIni = new Date(hariIni_());
  // 1. Piutang toko yang membesar: bon 30 hari terakhir dikurangi bayar 30 hari terakhir
  const batas = new Date(hariIni); batas.setDate(batas.getDate() - 30); const b30 = isoTgl(batas);
  // Bon lama dari Excel adalah saldo awal, bukan kenaikan; kenaikan dihitung dari hutang dan bayar yang dicatat di aplikasi.
  const riw = buku.flatMap(t => t.riwayat.filter(x => !x.awal)), baru = sumBy(riw, x => x.hutang && x.tgl >= b30 ? x.hutang : 0), bayar = sumBy(riw, x => x.bayar && x.tgl >= b30 ? x.bayar : 0);
  const tertahan = N.piutang - N.macet;
  if (baru - bayar > 0) B.push({ judul: 'Piutang toko bertambah', rp: baru - bayar, ket: `30 hari terakhir hutang toko bertambah ${rp(baru)} dan yang dibayar hanya ${rp(bayar)}. Uang laba tertahan di toko.`,
    tindakan: 'Batasi hutang per toko (misalnya maksimal 2 kali pengantaran), tagih bon di atas 14 hari tiap kali mengantar, dan cetak Bon Hutang per jalur untuk dibawa pengantar.' });
  else if (tertahan > 0) B.push({ judul: 'Uang tertahan di piutang toko', rp: tertahan, sekali: true, ket: `${rp(tertahan)} laba yang sudah jadi hak usaha masih di tangan toko (bon sampai 90 hari). Ini lebih besar dari laba bersih sebulan.`,
    tindakan: 'Batasi hutang per toko (misalnya maksimal 2 kali pengantaran), tagih bon di atas 14 hari tiap kali mengantar, dan cetak Bon Hutang per jalur untuk dibawa pengantar.' });
  // 2. Piutang macet
  if (N.macet) B.push({ judul: 'Bon lama yang mungkin macet', rp: N.macet, ket: `${N.bon.filter(x => x.umur > 90).length} bon berumur lebih dari 90 hari: ${N.bon.filter(x => x.umur > 90).sort((a, c) => c.sisa - a.sisa).slice(0, 4).map(x => x.toko + ' ' + rp(x.sisa)).join(', ')}.`, sekali: true,
    tindakan: 'Datangi satu per satu dan sepakati cicilan. Kalau benar-benar tidak tertagih, hentikan kirim barang ke toko itu.' });
  // 3. Kendi kosong
  if (N.kendiKosong) B.push({ judul: 'Kendi kosong belum kembali', rp: N.kendiKosong * (N.A.kendiHarga || HARGA_KENDI), ket: `${N.kendiKosong} kendi di toko, tiap kendi ${rp(N.A.kendiHarga || HARGA_KENDI)}. Selama belum kembali, gudang harus beli kendi baru.`, sekali: true,
    tindakan: 'Pengantar wajib menarik kendi kosong tiap kirim; tagih sebagai hutang kalau lebih dari 2 minggu.' });
  // 4. Harga jual per toko yang terlalu rendah (dari Harga Toko): laba per kendi = harga - berat x modal
  if (harga?.toko?.length && modalOtomatis(hariIni_()).kg) { const m = modalOtomatis(hariIni_()).kg, per = harga.toko.filter(t => t.aktif !== false).map(t => { const h = hargaKini(t, 'curah'); return h ? { nama: t.nama, harga: h.harga, laba: h.harga - 14.4 * m } : null; }).filter(Boolean);
    if (per.length) { const rata = sumBy(per, x => x.laba) / per.length, rendah = per.filter(x => x.laba < rata * 0.5).sort((a, c) => a.laba - c.laba);
      if (rendah.length) B.push({ judul: 'Toko dengan harga terlalu rendah', rp: Math.round(rendah.reduce((a, x) => a + (rata - x.laba), 0) * 4), ket: `Rata-rata laba per kendi ${rp(rata)} (harga dikurangi 14,4 kg x modal ${rp(m)}). ${rendah.length} toko di bawah separuhnya: ${rendah.slice(0, 5).map(x => `${x.nama} ${rp(x.harga)} (laba ${rp(x.laba)})`).join(', ')}.`,
        tindakan: 'Naikkan harga toko-toko ini ke harga rata-rata, atau kurangi jatah kirimnya. Taksiran rupiah memakai 1 kendi per toko per minggu.' }); } }
  if (k?.WK) { const W = k.WK.filter(w => (k.HARI[w] || 0) >= 5), rataM = W.length ? sumBy(W, w => k.D[w].tot.bersih / k.D[w].tot.omset) / W.length : 0;
    // 5. Minggu dengan margin bersih di bawah 3%
    const tipis = W.filter(w => k.D[w].tot.bersih / k.D[w].tot.omset < 0.03);
    if (tipis.length && W.length) B.push({ judul: 'Minggu bermargin tipis', rp: Math.round(sumBy(tipis, w => k.D[w].tot.omset * rataM - k.D[w].tot.bersih) / W.length * 4.33), ket: `${tipis.length} dari ${W.length} minggu margin bersihnya di bawah 3%: ${tipis.map(w => `minggu ${w} (${(k.D[w].tot.bersih / k.D[w].tot.omset * 100).toFixed(1).replace('.', ',')}%)`).join(', ')}. Rata-rata ${(rataM * 100).toFixed(1).replace('.', ',')}%.`,
      tindakan: 'Cek harga beli minggu itu lawan harga jual; kalau modal naik, harga toko harus ikut naik di minggu yang sama.' });
    // 6. Biaya operasional naik
    const ops = W.map(w => k.D[w].tot.ops), rataOps = sumBy(ops, x => x) / (ops.length || 1), akhir = ops.slice(-3);
    if (akhir.length === 3 && sumBy(akhir, x => x) / 3 > rataOps * 1.3) B.push({ judul: 'Biaya operasional naik', rp: Math.round((sumBy(akhir, x => x) / 3 - rataOps) * 4.33), ket: `3 minggu terakhir rata-rata ${rp(sumBy(akhir, x => x) / 3)} per minggu, biasanya ${rp(rataOps)}. Rincian ada di Keuangan (biaya per kelompok).`,
      tindakan: 'Cek bensin dan parkir per pengantar; tetapkan jatah per hari.' }); }
  return B.sort((a, c) => c.rp - a.rp); }

function kartuNeracaBocor() { const N = neracaBos(), B = kebocoran(), R = ringkasHutang(), bocorBulan = sumBy(B.filter(x => !x.sekali), x => x.rp);
  return `<section class="kartu angkat" style="margin-top:14px"><h2>Neraca sederhana <button class="pil kecil" id="hbAset">Isi aset</button></h2>
      ${N.aset.map(([l, n, ket]) => `<div class="baris-data"><div class="kiri">${esc(l)}<small>${esc(ket)}</small></div><div class="kanan ${/macet/.test(l) ? 'minus' : ''}">${/macet/.test(l) ? '(' + rp(n) + ')' : rp(n)}</div></div>`).join('')}
      <div class="baris-data"><div class="kiri"><b>Total aset</b></div><div class="kanan"><b>${rp(N.totalAset)}</b></div></div>
      <div class="baris-data"><div class="kiri"><b>Total hutang bos</b><small>${HB.daftar.length} hutang</small></div><div class="kanan"><b>- ${rp(N.hutang)}</b></div></div>
      <div class="baris-data total"><div class="kiri">Kekayaan bersih</div><div class="kanan" style="color:${N.bersih >= 0 ? 'var(--naik)' : 'var(--turun)'}">${N.bersih < 0 ? 'minus ' : ''}${rp(Math.abs(N.bersih))}</div></div>
      <div class="catatan">${N.bersih < 0 ? 'Hutang lebih besar dari aset. Yang bisa menutupnya hanya laba usaha tiap bulan, jadi kebocoran di bawah ini harus disumbat dulu.' : 'Aset masih lebih besar dari hutang; asal laba tidak bocor, hutang bisa selesai dari usaha.'} Piutang macet tidak dihitung aset.</div></section>
    <section class="kartu angkat" style="margin-top:14px"><h2>Kebocoran <span class="keping ${bocorBulan ? 'merah' : ''}">${bocorBulan ? 'sekitar ' + rp(bocorBulan) + ' per bulan' : 'tidak ada'}</span></h2>
      ${B.map((x, i) => `<div class="orang" style="cursor:default"><span class="nama" style="font-size:15px">${i + 1}. ${esc(x.judul)}</span><span class="bayar" style="font-size:16px">${rp(x.rp)}<small style="display:block;font-weight:500;color:var(--redup);font-size:11px;text-align:right">${x.sekali ? 'uang tertahan' : 'per bulan'}</small></span>
          <span class="rinci" style="display:block"><div style="font-size:13px;margin-top:4px">${esc(x.ket)}</div><div style="font-size:13px;margin-top:6px"><b>Tindakan:</b> ${esc(x.tindakan)}</div></span></div>`).join('') || '<div class="catatan" style="margin:0">Tidak ada kebocoran yang terbaca dari data.</div>'}
      ${R.bebas != null ? `<div class="baris-data total" style="margin-top:8px"><div class="kiri">Uang bebas kalau kebocoran bulanan disumbat<small>uang bebas ${rp(R.bebas)} + kebocoran ${rp(bocorBulan)}</small></div><div class="kanan" style="color:var(--naik)">${rp(R.bebas + bocorBulan)}</div></div>
        ${R.sisa && R.bebas + bocorBulan > 0 ? `<div class="catatan">Dengan uang itu, sisa hutang ${rp(R.sisa)} lunas dalam sekitar ${Math.ceil(R.sisa / (R.bebas + bocorBulan))} bulan${R.lunasBulan ? ', bukan ' + R.lunasBulan + ' bulan' : ''}. Bon macet dan kendi kosong yang tertagih mempercepatnya lagi.</div>` : ''}` : ''}</section>`; }

function dialogAset() { const A = { ...asetKosong(), ...(HB.aset || {}) };
  dialog(`<h3>Aset usaha dan bos</h3><p class="catatan" style="margin:0 0 12px">Taksiran saja, per hari ini. Piutang toko dan kendi kosong di toko diambil dari aplikasi, tidak perlu diisi.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px"><label class="medan"><span>Kas di tangan (Rp)</span><input id="sKas" inputmode="numeric"></label><label class="medan"><span>Saldo rekening (Rp)</span><input id="sRek" inputmode="numeric"></label>
      <label class="medan"><span>Kendi kosong di gudang (buah)</span><input id="sKendi" inputmode="numeric"></label><label class="medan"><span>Harga kendi (Rp per buah)</span><input id="sKendiH" inputmode="numeric"></label>
      <label class="medan"><span>Stok minyak di gudang (kg)</span><input id="sStok" inputmode="decimal"></label><span></span>
      <label class="medan"><span>Kendaraan, taksiran harga jual (Rp)</span><input id="sMobil" inputmode="numeric"></label><label class="medan"><span>Keterangan kendaraan</span><input id="sMobilK" placeholder="mis. 2 pickup"></label>
      <label class="medan"><span>Gudang / bangunan milik sendiri (Rp)</span><input id="sGudang" inputmode="numeric"></label><label class="medan"><span>Keterangan</span><input id="sGudangK" placeholder="kosongkan kalau sewa"></label></div><div id="sPesan"></div>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil" id="sOk">Simpan</button></div>`, (d, tutup) => {
    const isi = { sKas: 'kas', sRek: 'rekening', sKendi: 'kendi', sKendiH: 'kendiHarga', sMobil: 'mobil', sGudang: 'gudang' };
    for (const [i, k] of Object.entries(isi)) { $('#' + i, d).value = A[k] ? ribu(A[k]) : ''; $('#' + i, d).addEventListener('blur', ev => { if (ev.target.value.trim()) ev.target.value = ribu(angkaRp(ev.target.value)); }); }
    $('#sStok', d).value = A.stokKg ? angkaId(A.stokKg) : ''; $('#sMobilK', d).value = A.mobilKet || ''; $('#sGudangK', d).value = A.gudangKet || '';
    $('#sOk', d).onclick = async () => { const baru = { kas: angkaRp($('#sKas', d).value), rekening: angkaRp($('#sRek', d).value), kendi: angkaRp($('#sKendi', d).value), kendiHarga: angkaRp($('#sKendiH', d).value) || HARGA_KENDI, stokKg: desimal($('#sStok', d).value), mobil: angkaRp($('#sMobil', d).value), mobilKet: $('#sMobilK', d).value.trim(), gudang: angkaRp($('#sGudang', d).value), gudangKet: $('#sGudangK', d).value.trim(), diisi: hariIni_() };
      try { await simpanHutangBos(x => { x.aset = baru; }); tutup(); gambarHutangBos(); } catch (e) { $('#sPesan', d).innerHTML = `<div class="pesan-salah">${esc(e.message)}</div>`; } }; }); }

/* ----- Tahap 5: jadwal pelunasan, skenario, target mingguan -----
   Simulasi bulan per bulan: tiap bulan uang yang tersedia = laba bersih - prive - biaya tetap (+ suntikan sekali, + kebocoran
   yang disumbat). Bunga semua hutang dibayar dulu, lalu cicilan pokok wajib tiap hutang, sisanya dilempar ke hutang
   prioritas (bunga tertinggi dulu, atau sisa terkecil dulu). Hasil: bulan lunas tiap hutang, lunas total, bunga yang
   terbayar. Angka perkiraan; dipakai untuk memilih urutan dan menetapkan target mingguan, ditinjau tiap Sabtu. */
function simulasiLunas(daftar, uangBulan, { urutan = 'bunga', suntikan = 0, maksBulan = 240 } = {}) {
  let H = daftar.map(h => ({ id: h.id, kreditur: h.kreditur, sisa: sisaHutang(h), pct: h.bungaPersen || 0, cicilan: h.cicilan || 0, lunasBulan: null })).filter(h => h.sisa > 0);
  const prioritas = () => H.filter(h => h.sisa > 0).sort((a, b) => urutan === 'kecil' ? a.sisa - b.sisa || b.pct - a.pct : b.pct - a.pct || a.sisa - b.sisa);
  let bulan = 0, bungaTotal = 0, dana = suntikan, macet = false; const jejak = [];
  while (H.some(h => h.sisa > 0) && bulan < maksBulan) { bulan++; dana += uangBulan;
    const bunga = H.reduce((a, h) => a + (h.sisa > 0 ? h.sisa * h.pct / 100 : 0), 0);
    if (dana < bunga) { macet = true; break; } dana -= bunga; bungaTotal += bunga;
    // cicilan pokok wajib (cicilan dikurangi bagian bunganya), semampu dana
    for (const h of prioritas()) { const pokokWajib = Math.max(0, h.cicilan - h.sisa * h.pct / 100), bayar = Math.min(h.sisa, pokokWajib, dana); h.sisa -= bayar; dana -= bayar; if (h.sisa <= 0.5) { h.sisa = 0; h.lunasBulan = bulan; } }
    // sisa dana ke prioritas
    for (const h of prioritas()) { if (dana <= 0) break; const bayar = Math.min(h.sisa, dana); h.sisa -= bayar; dana -= bayar; if (h.sisa <= 0.5) { h.sisa = 0; h.lunasBulan = bulan; } }
    jejak.push({ bulan, sisa: Math.round(H.reduce((a, h) => a + h.sisa, 0)), bunga: Math.round(bunga) }); }
  const selesai = !macet && H.every(h => h.sisa <= 0);
  return { selesai, macet, bulan: selesai ? bulan : null, bungaTotal: Math.round(bungaTotal), urutanLunas: H.filter(h => h.lunasBulan).sort((a, b) => a.lunasBulan - b.lunasBulan), sisaAkhir: Math.round(H.reduce((a, h) => a + h.sisa, 0)), jejak }; }
const bulanKe = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return BLN_L[d.getMonth()] + ' ' + d.getFullYear(); };
const lamaTeks = n => n == null ? 'tidak selesai' : n < 12 ? `${n} bulan` : `${Math.floor(n / 12)} tahun${n % 12 ? ' ' + n % 12 + ' bulan' : ''}`;

function kartuJadwal() { const R = ringkasHutang(), d = HB.daftar.filter(h => sisaHutang(h) > 0); if (!R.laba || !d.length) return '';
  const urutan = HB.rencana?.urutan || 'bunga', kotor = R.labaTunai - HB.prive - R.tetap, B = kebocoran(), bocorBulan = sumBy(B.filter(x => !x.sekali), x => x.rp), N = neracaBos();
  const tonase = keu?.WK ? (() => { const W = keu.WK.filter(w => (keu.HARI[w] || 0) >= 5).slice(-8); return W.length ? sumBy(W, w => keu.D[w].tot.tonase) / W.length : 0; })() : 0;
  const sken = [['Apa adanya', kotor, 0, 'laba dari toko yang bayar, prive, dan biaya tetap seperti sekarang'], ['Kebocoran bulanan disumbat', kotor + bocorBulan, 0, `tambah ${rp(bocorBulan)} per bulan dari daftar kebocoran`],
    ['Piutang ditagih separuh', kotor, Math.round((N.piutang - N.macet) / 2), `suntikan sekali ${rp(Math.round((N.piutang - N.macet) / 2))} di bulan pertama`],
    ['Margin naik Rp 200 per kg', kotor + Math.round(tonase * 200 * 4.33), 0, `${angkaId(Math.round(tonase))} kg per minggu x Rp 200 x 4,33`]]
    .map(([nama, uang, suntik, ket]) => ({ nama, ket, uang, hasil: simulasiLunas(d, uang, { urutan, suntikan: suntik }) }));
  const dua = ['bunga', 'kecil'].map(u => ({ u, hasil: simulasiLunas(d, kotor, { urutan: u }) })), utama = sken[0].hasil;
  return `<section class="kartu angkat" style="margin-top:14px"><h2>Jadwal pelunasan <span class="keping">perkiraan</span></h2>
      <div class="sub-judul"><span>Urutan bayar</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${[['bunga', 'Bunga tertinggi dulu', 'paling hemat bunga'], ['kecil', 'Terkecil dulu', 'cepat ada yang lunas, semangat naik']].map(([u, l, k]) => { const h = dua.find(x => x.u === u).hasil; return `<button class="tab ${urutan === u ? 'aktif' : ''}" data-urutan="${u}" style="white-space:normal;text-align:left;max-width:100%">${l} · ${h.selesai ? lamaTeks(h.bulan) + ', bunga ' + rp(h.bungaTotal) : 'tidak selesai'}</button>`; }).join('')}</div>
      <div class="catatan">${dua[0].hasil.selesai && dua[1].hasil.selesai ? `Selisih bunga dua urutan itu ${rp(Math.abs(dua[0].hasil.bungaTotal - dua[1].hasil.bungaTotal))}. ${dua[0].hasil.bungaTotal <= dua[1].hasil.bungaTotal ? 'Bunga tertinggi dulu lebih hemat.' : 'Terkecil dulu lebih hemat di kasus ini.'}` : 'Dengan uang sekarang, hutang tidak akan selesai. Lihat skenario di bawah.'}</div>
      ${utama.selesai ? `<div class="sub-judul"><span>Giliran lunas (${urutan === 'bunga' ? 'bunga tertinggi dulu' : 'terkecil dulu'})</span></div>
        ${utama.urutanLunas.map((h, i) => `<div class="baris-data"><div class="kiri">${i + 1}. ${esc(h.kreditur)}</div><div class="kanan">${esc(bulanKe(h.lunasBulan))}<small style="display:block;font-weight:500;color:var(--redup)">bulan ke-${h.lunasBulan}</small></div></div>`).join('')}
        <div class="baris-data total"><div class="kiri">Lunas total</div><div class="kanan">${esc(bulanKe(utama.bulan))}</div></div>` : `<div class="pesan-salah" style="margin-top:10px">Uang ${rp(kotor)} per bulan ${utama.macet ? 'tidak cukup membayar bunga' : 'belum cukup'} untuk menghabiskan hutang. Sumbat kebocoran atau tagih piutang dulu.</div>`}
      <div class="sub-judul" style="margin-top:14px"><span>Empat skenario</span></div>
      <div class="bungkus-tabel"><table class="tabel-pb"><thead><tr><th>Skenario</th><th class="angka">Uang / bulan</th><th class="angka">Lunas</th><th class="angka">Bunga terbayar</th></tr></thead>
        <tbody>${sken.map(s => `<tr><td><b>${esc(s.nama)}</b><div class="catatan" style="margin:0">${esc(s.ket)}</div></td><td class="angka">${rp(s.uang)}${s.hasil.selesai || !s.hasil.macet ? '' : ''}</td><td class="angka">${s.hasil.selesai ? `<b>${lamaTeks(s.hasil.bulan)}</b><div class="catatan" style="margin:0">${esc(bulanKe(s.hasil.bulan))}</div>` : '<span style="color:var(--turun)">tidak selesai</span>'}</td><td class="angka">${s.hasil.selesai ? rp(s.hasil.bungaTotal) : '-'}</td></tr>`).join('')}</tbody></table></div>
      <div class="catatan">Bunga dihitung dari persen tiap hutang atas sisanya. Cicilan wajib dibayar dulu, sisa uang dilempar ke hutang prioritas. Prive dan biaya tetap dianggap tetap.</div></section>`; }

// Target minggu ini: uang bebas dibagi 4,33, dibandingkan laba minggu berjalan; piutang yang harus ditagih minggu ini.
function kartuMingguIni() { const R = ringkasHutang(); if (!R.laba || !HB.daftar.some(h => sisaHutang(h) > 0)) return '';
  const target = Math.round(R.bebas / 4.33), w = keu?.WK ? Math.max(...keu.WK) : null, t = w ? keu.D[w].tot : null, hari = w ? keu.HARI[w] || 0 : 0;
  const sn = (() => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoTgl(d); })(), Lm = labaTertahan(sn, hariIni()), tahanMinggu = Lm ? Math.max(0, Lm.bersih) : 0;
  const labaMinggu = t ? t.bersih - tahanMinggu - (HB.prive + R.tetap + R.bunga) / 4.33 * (hari / 6) : null;
  const N = neracaBos(), tagih = N.bon.filter(x => x.umur > 14 && x.umur <= 90).sort((a, b) => b.sisa - a.sisa).slice(0, 8), buku = bukuHutang();
  return `<section class="kartu angkat" style="margin-top:14px"><h2>Minggu ini <span class="keping">ditinjau tiap Sabtu</span></h2>
      <div class="kisi"><div class="kotak emas"><div class="l">Target ke hutang minggu ini</div><div class="v">${rp(target)}</div><small>uang bebas ${rp(R.bebas)} dibagi 4,33</small></div>
        <div class="kotak ${labaMinggu != null && labaMinggu < target * (hari / 6) ? 'merah' : ''}"><div class="l">Laba bersih minggu ${w || '-'} sejauh ini</div><div class="v">${t ? rp(t.bersih) : '-'}</div><small>${t ? `${hari} hari${tahanMinggu ? ', tertahan di toko hutang ' + rp(tahanMinggu) : ''}, setelah prive dan biaya tetap kira-kira ${rp(Math.max(0, labaMinggu))}` : 'data minggu berjalan belum ada'}</small></div></div>
      ${labaMinggu != null && hari >= 6 ? `<div class="catatan" style="font-weight:700;color:${labaMinggu >= target ? 'var(--naik)' : 'var(--turun)'}">${labaMinggu >= target ? 'Target tercapai. Setor ' + rp(target) + ' ke hutang prioritas.' : 'Di bawah target ' + rp(target - labaMinggu) + '. Kejar dari piutang di bawah ini.'}</div>` : ''}
      <div class="sub-judul"><span>Tagih minggu ini (bon 15 sampai 90 hari)</span><span class="catatan" style="margin:0">${rp(sumBy(tagih, x => x.sisa))}</span></div>
      ${tagih.map(x => `<div class="baris-data"><div class="kiri">${esc(x.toko)}<small>${x.tgl ? esc(tglPanjang(x.tgl)) : ''} · ${x.umur} hari · ${esc(buku.find(b => b.toko === x.toko)?.jalur || '')}</small></div><div class="kanan">${rp(x.sisa)}</div></div>`).join('') || '<div class="catatan" style="margin:0">Tidak ada bon yang jatuh tempo.</div>'}
      <div class="catatan">Tiap Sabtu: catat cicilan yang dibayar di hutang prioritas, tagih daftar di atas, lalu cek lagi jadwal lunasnya.</div></section>`; }

async function layarHutangBos() {
  akar.innerHTML = kepalaPemilik('Bebas Hutang', 'Catat semua hutang dan aset, lihat kemampuan bayar, neraca, dan kebocoran yang harus disumbat supaya hutang bisa lunas dari usaha.', true) +
    '<main class="bungkus"><div id="hb" style="padding-top:38px"><section class="kartu angkat">Memuat…</section></div></main>';
  $('#bBeranda').onclick = layarBeranda;
  try { [HB, INV] = await Promise.all([muatHutangBos(), muatInvoice(), muatKeuangan().catch(() => null), muatHarga().catch(() => null), muatPembelian().catch(() => null)]); gambarHutangBos(); }
  catch (e) { $('#hb').innerHTML = `<section class="kartu angkat"><div class="pesan-salah">${esc(e.message)}</div></section>`; } }

function gambarHutangBos() { const el = $('#hb'); if (!el) return; const R = ringkasHutang(), d = [...HB.daftar].sort((a, b) => (b.bungaPersen || 0) - (a.bungaPersen || 0) || sisaHutang(b) - sisaHutang(a));
  const bulanTeks = n => n == null ? '' : n < 1 ? 'kurang dari sebulan' : n < 12 ? `${n} bulan` : `${Math.floor(n / 12)} tahun ${n % 12 ? n % 12 + ' bulan' : ''}`.trim();
  el.innerHTML = `<section class="besar angkat"><div class="label">Sisa hutang bos</div><div class="nilai">${rp(R.sisa)}</div>
      <div class="keping-baris"><span class="keping"><b>${d.length}</b> hutang</span><span class="keping">Cicilan wajib <b>${rp(R.cicilan)}</b> per bulan</span><span class="keping">Bunga <b>${rp(R.bunga)}</b> per bulan</span>${R.tunggak ? `<span class="keping merah">Menunggak <b>${rp(R.tunggak)}</b></span>` : ''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="pil emas" id="hbBaru">+ Hutang</button><button class="pil kaca" id="hbLuar">Pengeluaran di luar Excel</button></div></section>
    ${kartuMingguIni()}
    <section class="kartu angkat" style="margin-top:14px"><h2>Kemampuan bayar <span class="keping">perkiraan</span></h2>
      ${R.laba ? `<div class="baris-data"><div class="kiri">Laba bersih usaha per bulan<small>rata-rata ${R.laba.minggu} minggu lengkap terakhir (${esc(R.laba.dari)} sampai ${esc(R.laba.sampai)}) dikali 4,33</small></div><div class="kanan">${rp(R.laba.bulan)}</div></div>
        <div class="baris-data"><div class="kiri">Laba tertahan di toko yang hutang<small>${R.L ? `30 hari terakhir: bon ${rp(R.L.hutang)} dikurangi bayar ${rp(R.L.bayar)}, dikali margin ${(R.L.margin * 100).toFixed(1).replace('.', ',')}%. Masuk lagi saat toko membayar.` : 'data hutang toko belum termuat'}</small></div><div class="kanan" style="color:var(--turun)">- ${rp(R.tertahan)}</div></div>
        <div class="baris-data"><div class="kiri"><b>Laba dari toko yang bayar</b><small>uang yang benar-benar masuk</small></div><div class="kanan"><b>${rp(R.labaTunai)}</b></div></div>
        <div class="baris-data"><div class="kiri">Pengambilan pribadi<small>uang bos untuk rumah tangga</small></div><div class="kanan">- ${rp(HB.prive)}</div></div>
        <div class="baris-data"><div class="kiri">Biaya tetap di luar Excel<small>${HB.tetap.length ? esc(HB.tetap.map(x => x.ket).join(', ')) : 'belum diisi'}</small></div><div class="kanan">- ${rp(R.tetap)}</div></div>
        <div class="baris-data"><div class="kiri">Bunga semua hutang<small>dari persen bunga tiap hutang</small></div><div class="kanan">- ${rp(R.bunga)}</div></div>
        <div class="baris-data total"><div class="kiri">Uang bebas untuk bayar pokok hutang</div><div class="kanan" style="color:${R.bebas > 0 ? 'var(--naik)' : 'var(--turun)'}">${rp(R.bebas)}</div></div>
        <div class="kisi" style="margin-top:12px"><div class="kotak ${R.cukup === false ? 'merah' : ''}"><div class="l">Cicilan wajib per bulan</div><div class="v">${rp(R.cicilan)}</div><small>${R.cukup == null ? '' : R.cukup ? 'tertutup oleh uang bebas' : 'lebih besar dari uang bebas, ini sebab hutang bertambah'}</small></div>
          <div class="kotak emas"><div class="l">Perkiraan lunas total</div><div class="v">${R.lunasBulan ? bulanTeks(R.lunasBulan) : '—'}</div><small>${R.lunasBulan ? 'kalau semua uang bebas dipakai bayar pokok, tanpa kebocoran' : R.sisa ? 'uang bebas belum cukup untuk mengurangi pokok' : 'belum ada hutang tercatat'}</small></div></div>
        <div class="catatan">Piutang toko yang belum tertagih tidak dihitung di sini. Angka ini perkiraan kasar dari laporan; rencana pelunasan yang sesungguhnya disusun di tahap berikutnya setelah semua hutang terisi.</div>`
      : '<div class="catatan" style="margin:0">Data keuangan belum termuat, jadi kemampuan bayar belum bisa dihitung.</div>'}</section>
    <section class="kartu angkat" style="margin-top:14px"><h2>Daftar hutang<span class="keping">${d.length}</span></h2>
      ${d.map(h => { const sisa = sisaHutang(h), pct = h.pokokAwal ? Math.round(pokokDibayar(h) / h.pokokAwal * 100) : 0;
        return `<div class="orang" data-hb="${esc(h.id)}" style="cursor:pointer"><span class="nama" style="font-size:16px">${esc(h.kreditur)}${h.tunggakan ? ' <span class="keping merah" style="font-size:11px;padding:2px 8px">menunggak</span>' : ''}</span><span class="bayar" style="font-size:17px">${rp(sisa)}</span>
          <span class="garis-batang"><i style="width:${pct}%"></i></span>
          <span class="rinci"><span class="keping">${esc(h.jenis || 'Hutang')}</span><span class="keping">Cicilan ${rp(h.cicilan)}${h.tglCicil ? ' tiap tgl ' + h.tglCicil : ''}</span>${h.bungaPersen ? `<span class="keping">Bunga ${String(h.bungaPersen).replace('.', ',')}% = ${rp(bungaBulan(h))}/bln</span>` : '<span class="keping">Tanpa bunga</span>'}<span class="keping">Terbayar ${pct}% dari ${rp(h.pokokAwal)}</span>${h.jatuhTempo ? `<span class="keping">Jatuh tempo ${esc(h.jatuhTempo)}</span>` : ''}${h.jaminan ? `<span class="keping">Jaminan ${esc(h.jaminan)}</span>` : ''}</span></div>`; }).join('')
      || '<div class="catatan" style="margin:0">Belum ada hutang tercatat. Tekan "+ Hutang" dan isi satu per satu: bank, koperasi, pinjaman perorangan, hutang ke pemasok, cicilan mobil.</div>'}
      <div class="catatan">Diurutkan dari bunga tertinggi. Ketuk hutang untuk mencatat cicilan yang sudah dibayar atau mengubah datanya.</div></section>` + kartuNeracaBocor() + kartuJadwal();
  $('#hbBaru').onclick = () => formHutangBos(null); $('#hbLuar').onclick = dialogLuarExcel; $('#hbAset').onclick = dialogAset;
  $$('[data-urutan]', el).forEach(b => b.onclick = async () => { try { await simpanHutangBos(x => { x.rencana = { ...(x.rencana || {}), urutan: b.dataset.urutan }; }); gambarHutangBos(); } catch (e) { gagalDialog(e); } });
  $$('[data-hb]', el).forEach(x => x.onclick = () => bukaHutangBos(HB.daftar.find(h => h.id === x.dataset.hb))); }

function formHutangBos(asal) { const h = asal ? JSON.parse(JSON.stringify(asal)) : { id: idBaru('d'), kreditur: '', jenis: 'Bank', pokokAwal: 0, bungaPersen: 0, cicilan: 0, tglCicil: '', jatuhTempo: '', jaminan: '', tunggakan: 0, catatan: '', mulai: hariIni(), bayar: [] };
  dialog(`<h3>${asal ? 'Ubah hutang' : 'Hutang baru'}</h3>
    <label class="medan"><span>Kepada siapa (kreditur)</span><input id="dKred" placeholder="mis. Bank BRI, Koperasi X, Pak Ahong"></label>
    <label class="medan"><span>Jenis (ketik bebas atau pilih)</span><input id="dJenis" list="dlJenis" placeholder="mis. Bank, koperasi, pinjam ke teman"></label><datalist id="dlJenis">${[...new Set([...JENIS_HUTANG, ...HB.daftar.map(x => x.jenis)])].filter(Boolean).map(j => `<option value="${esc(j)}"></option>`).join('')}</datalist>
    <label class="medan"><span>Sisa pokok sekarang (Rp)</span><input id="dPokok" inputmode="numeric" placeholder="mis. 50.000.000"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px"><label class="medan"><span>Bunga per bulan (%)</span><input id="dBunga" inputmode="decimal" placeholder="mis. 2,5"></label>
      <label class="medan"><span>Cicilan wajib per bulan (Rp)</span><input id="dCicil" inputmode="numeric" placeholder="mis. 3.500.000"></label>
      <label class="medan"><span>Cicilan tiap tanggal</span><input id="dTgl" inputmode="numeric" placeholder="mis. 10"></label>
      <label class="medan"><span>Lunas seharusnya (bulan)</span><input id="dTempo" type="month"></label></div>
    <label class="medan"><span>Jaminan (boleh kosong)</span><input id="dJamin" placeholder="mis. BPKB mobil, sertifikat"></label>
    <label class="medan"><span>Tunggakan saat ini (Rp, kosong kalau lancar)</span><input id="dTunggak" inputmode="numeric"></label>
    <label class="medan"><span>Catatan</span><input id="dCat" placeholder="mis. bisa nego tempo"></label><div id="dPesan"></div>
    <div class="tombol-baris">${asal ? '<button class="pil bahaya" id="dHapus">Hapus</button>' : ''}<button class="pil halus" data-tutup>Batal</button><button class="pil" id="dOk">Simpan</button></div>`, (d, tutup) => {
    $('#dKred', d).value = h.kreditur; $('#dJenis', d).value = h.jenis || ''; $('#dPokok', d).value = h.pokokAwal ? ribu(asal ? sisaHutang(h) : h.pokokAwal) : ''; $('#dBunga', d).value = h.bungaPersen ? String(h.bungaPersen).replace('.', ',') : ''; $('#dCicil', d).value = h.cicilan ? ribu(h.cicilan) : '';
    $('#dTgl', d).value = h.tglCicil || ''; $('#dTempo', d).value = h.jatuhTempo || ''; $('#dJamin', d).value = h.jaminan || ''; $('#dTunggak', d).value = h.tunggakan ? ribu(h.tunggakan) : ''; $('#dCat', d).value = h.catatan || '';
    $$('input[inputmode="numeric"]', d).forEach(i => i.addEventListener('blur', () => { if (i.value.trim()) i.value = ribu(angkaRp(i.value)); }));
    $('#dKred', d).focus();
    $('#dOk', d).onclick = async () => { const kred = $('#dKred', d).value.trim(), pokokBaru = angkaRp($('#dPokok', d).value);
      if (!kred) { $('#dPesan', d).innerHTML = '<div class="pesan-salah">Isi nama krediturnya.</div>'; return; } if (!pokokBaru) { $('#dPesan', d).innerHTML = '<div class="pesan-salah">Isi sisa pokoknya.</div>'; return; }
      // saat mengubah, kotak pokok berisi SISA; pokok awal disesuaikan supaya sisa = yang diketik
      const rec = { ...h, kreditur: kred, jenis: $('#dJenis', d).value.trim() || 'Hutang', pokokAwal: asal ? pokokBaru + pokokDibayar(h) : pokokBaru, bungaPersen: desimal($('#dBunga', d).value), cicilan: angkaRp($('#dCicil', d).value), tglCicil: $('#dTgl', d).value.replace(/\D/g, '').slice(0, 2), jatuhTempo: $('#dTempo', d).value, jaminan: $('#dJamin', d).value.trim(), tunggakan: angkaRp($('#dTunggak', d).value), catatan: $('#dCat', d).value.trim() };
      try { await simpanHutangBos(x => { const i = x.daftar.findIndex(y => y.id === rec.id); if (i >= 0) x.daftar[i] = rec; else x.daftar.push(rec); }); tutup(); asal ? bukaHutangBos(HB.daftar.find(y => y.id === rec.id)) : gambarHutangBos(); }
      catch (e) { $('#dPesan', d).innerHTML = `<div class="pesan-salah">${esc(e.message)}</div>`; } };
    const hp = $('#dHapus', d); if (hp) hp.onclick = async () => { if (!confirm(`Hapus hutang ${h.kreditur} beserta catatan cicilannya?`)) return;
      try { await simpanHutangBos(x => { x.daftar = x.daftar.filter(y => y.id !== h.id); }); tutup(); gambarHutangBos(); } catch (e) { $('#dPesan', d).innerHTML = `<div class="pesan-salah">${esc(e.message)}</div>`; } }; }); }

function bukaHutangBos(h) { if (!h) return gambarHutangBos(); const el = $('#hb'), sisa = sisaHutang(h), bayar = [...h.bayar].sort((a, b) => b.tgl.localeCompare(a.tgl));
  el.innerHTML = `<button class="pil halus kecil" id="hbKembali">← Semua hutang</button>
    <section class="besar angkat" style="margin-top:12px"><div class="label">${esc(h.jenis || 'Hutang')} · ${esc(h.kreditur)}</div><div class="nilai">${rp(sisa)}</div>
      <div class="keping-baris"><span class="keping">Pokok awal <b>${rp(h.pokokAwal)}</b></span><span class="keping">Terbayar <b>${rp(pokokDibayar(h))}</b></span><span class="keping">Cicilan <b>${rp(h.cicilan)}</b>${h.tglCicil ? ' tiap tgl ' + h.tglCicil : ''}</span>${h.bungaPersen ? `<span class="keping">Bunga ${String(h.bungaPersen).replace('.', ',')}% = <b>${rp(bungaBulan(h))}</b>/bln</span>` : ''}${h.tunggakan ? `<span class="keping merah">Menunggak <b>${rp(h.tunggakan)}</b></span>` : ''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="pil emas" id="hbBayar">+ Catat cicilan dibayar</button><button class="pil kaca" id="hbUbah">Ubah data</button></div></section>
    ${h.jaminan || h.jatuhTempo || h.catatan ? `<section class="kartu angkat" style="margin-top:14px">${h.jatuhTempo ? `<div class="baris-data"><div class="kiri">Lunas seharusnya</div><div class="kanan">${esc(h.jatuhTempo)}</div></div>` : ''}${h.jaminan ? `<div class="baris-data"><div class="kiri">Jaminan</div><div class="kanan">${esc(h.jaminan)}</div></div>` : ''}${h.catatan ? `<div class="catatan" style="margin:8px 0 0">${esc(h.catatan)}</div>` : ''}</section>` : ''}
    <section class="kartu angkat" style="margin-top:14px"><h2>Cicilan yang sudah dibayar<span class="keping">${bayar.length}</span></h2>
      ${bayar.map(b => `<div class="baris-data"><div class="kiri">${esc(tglPanjang(b.tgl))}<small>${b.bunga ? 'bunga ' + rp(b.bunga) + ' · pokok ' + rp(b.jumlah - b.bunga) : 'semua ke pokok'}${b.ket ? ' · ' + esc(b.ket) : ''}</small></div><div class="kanan" style="display:flex;gap:8px;align-items:center">${rp(b.jumlah)}<button class="pil halus kecil" data-hapusbayar="${esc(b.id)}" aria-label="Hapus">✕</button></div></div>`).join('') || '<div class="catatan" style="margin:0">Belum ada cicilan tercatat. Catat setiap kali bayar, supaya sisanya terukur.</div>'}
      <div class="catatan">Sisa pokok berkurang sebesar jumlah bayar dikurangi bagian bunganya.</div></section>`;
  $('#hbKembali').onclick = gambarHutangBos; $('#hbUbah').onclick = () => formHutangBos(h);
  $('#hbBayar').onclick = () => dialog(`<h3>Cicilan dibayar · ${esc(h.kreditur)}</h3>
    <label class="medan"><span>Tanggal</span><input id="yTgl" type="date" value="${hariIni()}"></label>
    <label class="medan"><span>Jumlah dibayar (Rp)</span><input id="yJml" inputmode="numeric" value="${h.cicilan ? ribu(h.cicilan) : ''}"></label>
    <label class="medan"><span>Bagian bunga di dalamnya (Rp, kosong kalau semua ke pokok)</span><input id="yBunga" inputmode="numeric" value="${bungaBulan(h) ? ribu(bungaBulan(h)) : ''}"></label>
    <label class="medan"><span>Keterangan</span><input id="yKet" placeholder="mis. transfer, dari laba minggu 22"></label><div id="yPesan"></div>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil" id="yOk">Simpan</button></div>`, (d, tutup) => {
    $('#yOk', d).onclick = async () => { const j = angkaRp($('#yJml', d).value), bg = Math.min(j, angkaRp($('#yBunga', d).value)); if (!j) { $('#yPesan', d).innerHTML = '<div class="pesan-salah">Isi jumlahnya.</div>'; return; }
      try { await simpanHutangBos(x => { const y = x.daftar.find(z => z.id === h.id); if (y) { y.bayar.push({ id: idBaru('c'), tgl: $('#yTgl', d).value || hariIni(), jumlah: j, bunga: bg, ket: $('#yKet', d).value.trim() }); if (y.tunggakan) y.tunggakan = Math.max(0, y.tunggakan - j); } });
        tutup(); bukaHutangBos(HB.daftar.find(z => z.id === h.id)); } catch (e) { $('#yPesan', d).innerHTML = `<div class="pesan-salah">${esc(e.message)}</div>`; } }; });
  $$('[data-hapusbayar]', el).forEach(b => b.onclick = async () => { if (!confirm('Hapus catatan cicilan ini?')) return;
    try { await simpanHutangBos(x => { const y = x.daftar.find(z => z.id === h.id); if (y) y.bayar = y.bayar.filter(z => z.id !== b.dataset.hapusbayar); }); bukaHutangBos(HB.daftar.find(z => z.id === h.id)); } catch (e) { gagalDialog(e); } }); }

// Pengambilan pribadi dan biaya tetap yang tidak pernah ada di Excel (sewa gudang, listrik, cicilan mobil kalau bukan hutang)
function dialogLuarExcel() { const tetap = HB.tetap.map(x => ({ ...x })); if (!tetap.length) tetap.push({ ket: '', jumlah: 0 });
  const t = dialog(`<h3>Pengeluaran di luar Excel</h3><p class="catatan" style="margin:0 0 12px">Per bulan. Ini yang membuat laba di laporan tidak sama dengan uang yang benar-benar tersisa.</p>
    <label class="medan"><span>Pengambilan pribadi bos per bulan (Rp)</span><input id="lPrive" inputmode="numeric" value="${HB.prive ? ribu(HB.prive) : ''}" placeholder="mis. 8.000.000"></label>
    <div class="sub-judul"><span>Biaya tetap usaha (sewa, listrik, air, pulsa…)</span><button class="pil halus kecil" id="lTambah">+ Tambah</button></div><div id="lDaftar"></div><div id="lPesan"></div>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil" id="lOk">Simpan</button></div>`, (d, tutup) => {
    const gambar = () => { $('#lDaftar', d).innerHTML = tetap.map((x, i) => `<div class="inv-kecil" data-i="${i}"><input class="isian" data-f="ket" value="${esc(x.ket)}" placeholder="mis. Sewa gudang"><input class="isian angka" data-f="jumlah" inputmode="numeric" value="${x.jumlah ? ribu(x.jumlah) : ''}" placeholder="Rp 0"><button class="pil halus kecil" data-hapus>✕</button></div>`).join('');
      $$('.inv-kecil', d).forEach(row => { const x = tetap[+row.dataset.i]; $('[data-f="ket"]', row).oninput = e => { x.ket = e.target.value; }; $('[data-f="jumlah"]', row).oninput = e => { x.jumlah = angkaRp(e.target.value); }; $('[data-hapus]', row).onclick = () => { tetap.splice(+row.dataset.i, 1); gambar(); }; }); };
    gambar(); $('#lTambah', d).onclick = () => { tetap.push({ ket: '', jumlah: 0 }); gambar(); $$('#lDaftar input', d).at(-2)?.focus(); };
    $('#lOk', d).onclick = async () => { try { await simpanHutangBos(x => { x.prive = angkaRp($('#lPrive', d).value); x.tetap = tetap.filter(y => y.ket.trim() || y.jumlah).map(y => ({ ket: y.ket.trim(), jumlah: y.jumlah })); }); tutup(); gambarHutangBos(); }
      catch (e) { $('#lPesan', d).innerHTML = `<div class="pesan-salah">${esc(e.message)}</div>`; } }; }); }

async function mulai() { const s = sesi.baca(); if (!s?.token) return layarMasuk();
  akar.innerHTML = '<main class="masuk"><div style="color:#cfe3de">Memuat…</div></main>'; harga = null;   // harga toko diambil ulang tiap muat
  try { const r = await rpc('minyak_data', { p_token: s.token });
    if (!r.ok) { sesi.hapus(); return layarMasuk(r.pesan); }
    if (r.peran === 'pemilik' || r.peran === 'bos') { bacaSaja = r.peran === 'bos'; data = r.karyawan || {}; punyaPin = r.pin || {}; kotor.clear(); Object.values(data).forEach(hitung); if (kini !== '__ringkasan__' && !data[kini]) kini = '__ringkasan__'; layarBeranda(); status('Data dimuat ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }), 'ok'); }
    else layarKaryawan(r.data, r.diubah);
  } catch (e) { akar.innerHTML = `<main class="masuk"><div class="masuk-kartu"><h1>Tidak tersambung</h1><p>${esc(e.message)}</p><button class="pil emas" onclick="mulai()">Coba lagi</button></div></main>`; } }
addEventListener('beforeunload', ev => { if (kotor.size) { ev.preventDefault(); ev.returnValue = ''; } });
// Enter pindah ke kotak berikutnya (enak untuk mengisi 7 hari berturut-turut)
addEventListener('keydown', ev => { if (ev.key !== 'Enter' || !ev.target.matches('#isi input')) return; ev.preventDefault();
  const semua = $$('#isi input').filter(x => x.offsetParent !== null), i = semua.indexOf(ev.target); (semua[i + 1] || ev.target).focus(); semua[i + 1]?.select?.(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
mulai().finally(() => setTimeout(tawarkanPasang, 900));
</script>
