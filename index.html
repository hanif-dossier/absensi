<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3d3a">
<title>Minyak Andre</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-any-512.png?v=4">
<meta name="apple-mobile-web-app-title" content="Minyak Andre">
<meta name="application-name" content="Minyak Andre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---------- Warna: hijau minyak tua + emas minyak goreng. Semua komponen memakai token ini. ---------- */
:root{
  --dasar:#f2f5f1; --kartu:#ffffff; --kartu2:#f6f9f5; --garis:#dfe7de; --tinta:#16302c; --redup:#5f7570;
  --utama:#0f3d3a; --utama2:#1c5a54; --emas:#d59a1c; --emas-lembut:#fbf0d3;
  --naik:#1c7a4c; --naik-lembut:#e4f4ea; --turun:#b3362a; --turun-lembut:#fbe9e6;
  --r:24px; --r-kecil:16px; --bayang:0 10px 30px rgba(15,61,58,.08);
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --dasar:#0b1614; --kartu:#12211f; --kartu2:#172a27; --garis:#25403b; --tinta:#e9f2ee; --redup:#93aaa4;
  --utama:#123f3b; --utama2:#1e615a; --emas:#e8b54a; --emas-lembut:#3a2f12;
  --naik:#5fd39a; --naik-lembut:#143224; --turun:#f08a7d; --turun-lembut:#3b1d19; --bayang:0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--dasar);color:var(--tinta);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
.bungkus{max-width:1040px;margin:0 auto;padding-inline:16px}

/* ---------- Kepala ---------- */
.kepala{background:radial-gradient(120% 140% at 0% 0%,var(--utama2),var(--utama) 60%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 0 64px;
  border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.kepala::after{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(232,181,74,.55),rgba(232,181,74,0) 65%)}
.kepala .baris{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--emas)}
.kepala h1{font-size:clamp(26px,6vw,36px);line-height:1.1;margin-top:4px}
.kepala p{margin:6px 0 0;color:#cfe3de;font-size:13.5px}
.pil{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--utama);color:#fff;transition:transform .12s,filter .12s}
.pil:hover{filter:brightness(1.08)}.pil:active{transform:scale(.97)}
.pil.emas{background:var(--emas);color:#2a1e02}
.pil.halus{background:var(--kartu2);color:var(--tinta);box-shadow:inset 0 0 0 1px var(--garis)}
.kepala .pil{white-space:nowrap}
.pil.kaca{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(6px)}
.pil.bahaya{background:var(--turun-lembut);color:var(--turun)}
.pil.kecil{padding:7px 13px;font-size:13px}
.pil:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--emas);outline-offset:2px}

/* ---------- Kartu & keping ---------- */
.kartu{background:var(--kartu);border-radius:var(--r);padding:18px;box-shadow:var(--bayang);margin-top:16px}
.kartu h2{font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.angkat{margin-top:-44px;position:relative;z-index:2}
.besar{background:linear-gradient(135deg,var(--utama2),var(--utama));color:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--bayang)}
.besar .nilai{font-family:var(--serif);font-size:clamp(34px,9vw,46px);line-height:1.05;margin-top:2px}
.keping-baris{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.keping{background:rgba(255,255,255,.13);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.keping b{font-weight:700}
.kartu .keping{background:var(--kartu2);box-shadow:inset 0 0 0 1px var(--garis)}
.keping.merah{background:var(--turun-lembut);color:var(--turun);box-shadow:none}
.keping.hijau{background:var(--naik-lembut);color:var(--naik);box-shadow:none}
.kisi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kotak{background:var(--kartu2);border-radius:var(--r-kecil);padding:12px 14px}
.kotak .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--redup);font-weight:700}
.kotak .v{font-family:var(--serif);font-size:22px;margin-top:2px}
.kotak.emas{background:var(--emas-lembut)}
.kotak.merah{background:var(--turun-lembut)}.kotak.merah .v{color:var(--turun)}
.catatan{font-size:12.5px;color:var(--redup);margin-top:10px}

/* ---------- Hari (7 pil) ---------- */
.hari7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hari{border-radius:16px;padding:9px 2px;text-align:center;background:var(--kartu2)}
.hari b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup)}
.hari span{font-size:12px;font-weight:700}
.hari.hadir{background:var(--naik-lembut)}.hari.hadir span{color:var(--naik)}
.hari.libur span{color:var(--redup);font-weight:500}
@media (max-width:430px){.hari7{grid-template-columns:repeat(4,1fr)}}

/* ---------- Daftar baris (pengganti tabel di HP) ---------- */
.baris-data{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--garis);align-items:baseline}
.baris-data:last-child{border:0}
.baris-data .kiri{min-width:0}.baris-data .kiri small{display:block;color:var(--redup);font-size:12px}
.baris-data .kanan{text-align:right;white-space:nowrap;font-weight:700}
.baris-data.total{border-top:2px solid var(--garis);border-bottom:0;font-size:16px}
.minus{color:var(--turun)}

/* ---------- Tab pemilik ---------- */
.tab-baris{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;margin:14px -16px 0;scrollbar-width:none}
.tab-baris::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:var(--kartu);color:var(--redup);box-shadow:inset 0 0 0 1px var(--garis);cursor:pointer}
.tab.aktif{background:var(--utama);color:#fff;box-shadow:none}
.tab.mati{opacity:.5;text-decoration:line-through}
.tab.tambah{background:transparent;box-shadow:inset 0 0 0 1.5px var(--emas);color:var(--emas)}

/* ---------- Baris karyawan di ringkasan ---------- */
.orang{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:var(--r-kecil);background:var(--kartu2);margin-bottom:10px;cursor:pointer;border:0;width:100%;text-align:left}
.orang:hover{filter:brightness(.98)}
.orang .nama{font-family:var(--serif);font-size:18px}
.orang .bayar{font-family:var(--serif);font-size:20px;text-align:right}
.orang .rinci{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.orang .keping{font-size:12px;padding:4px 10px;background:var(--kartu)}
.orang.kosong{opacity:.55}
.garis-batang{grid-column:1/-1;height:6px;border-radius:6px;background:var(--garis);overflow:hidden}
.garis-batang i{display:block;height:100%;background:linear-gradient(90deg,var(--emas),var(--utama2));border-radius:6px}

/* ---------- Penyunting minggu ---------- */
.minggu{background:var(--kartu2);border-radius:var(--r-kecil);padding:14px;margin-bottom:12px}
.minggu-kepala{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.minggu-kepala .no{width:74px}.minggu-kepala .per{flex:1;min-width:170px}
.isian{background:var(--kartu);border:1.5px solid var(--garis);border-radius:14px;padding:9px 10px;width:100%;min-width:0}
.isian.angka{text-align:right}
.kisi7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kisi7 label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);font-weight:700;text-align:center;margin-bottom:3px}
.kisi7 .isian{padding:8px 4px;text-align:center;font-size:13.5px}
@media (max-width:620px){.kisi7{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sub-judul{font-size:12px;font-weight:700;color:var(--redup);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hasil{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hutang-baris{display:grid;grid-template-columns:130px 1fr 110px 110px 170px auto;gap:6px;margin-bottom:8px;align-items:center}
@media (max-width:820px){.hutang-baris{grid-template-columns:1fr 1fr;background:var(--kartu2);padding:10px;border-radius:var(--r-kecil)}.hutang-baris .lebar{grid-column:1/-1}}

/* ---------- Menu beranda pemilik ---------- */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-top:16px}
.tabel-pb{width:100%;border-collapse:collapse;font-size:13.5px}.tabel-pb th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);font-weight:700}
.tabel-pb th,.tabel-pb td{padding:8px 6px;border-bottom:1px solid rgba(127,127,127,.18);text-align:left;vertical-align:top}.tabel-pb tr:last-child td{border-bottom:0}
.tabel-pb .angka{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.bungkus-tabel{overflow-x:auto}
.ubin-pb{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}.ubin-pb>div{background:var(--kartu);border-radius:14px;padding:12px 14px;box-shadow:var(--bayang)}
.ubin-pb .label{margin:0}.ubin-pb .nilai{font-family:var(--serif);font-size:24px;line-height:1.1;margin-top:4px}.ubin-pb small{color:var(--redup);display:block;margin-top:4px}
.inv-item{padding:12px 0;border-bottom:1px solid rgba(127,127,127,.18)}.inv-item:last-child{border-bottom:0}
.inv-atas{display:flex;justify-content:space-between;gap:10px}
.inv-kartu-baris{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.inv-kartu{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--kartu2);border:1.5px solid var(--garis);border-radius:18px;padding:14px;cursor:pointer}
.inv-kartu:hover{border-color:var(--emas)}.inv-kartu.mati{opacity:.55}
.inv-unduh{display:flex;flex-wrap:wrap;gap:8px}
.inv-empat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 12px}
.inv-baris{display:grid;grid-template-columns:30px repeat(6,minmax(0,1fr));gap:10px;align-items:end;padding:14px 0;border-bottom:1px dashed var(--garis)}
.inv-baris .medan{margin-bottom:0}.inv-baris .medan input,.inv-baris select{width:100%;padding:10px 12px;font-size:15px;border-radius:14px;background:var(--kartu2);border:1.5px solid var(--garis)}
.inv-baris .b-no{grid-row:span 3;align-self:start;margin-top:26px;font-weight:800;color:var(--redup);text-align:center}
.inv-baris .b-toko,.inv-baris .b-barang{grid-column:span 3}.inv-baris .b-ket{grid-column:span 4}
.b-jumlah{grid-column:span 2;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:6px}.b-jumlah span{font-size:12px;font-weight:700;color:var(--redup)}
.inv-kecil{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;margin-bottom:8px}
.inv-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:15px}.inv-total b{font-family:var(--serif);font-size:26px}
textarea.isian{font:inherit;resize:vertical}
.lembar{background:#fff;color:#111;border-radius:18px;padding:22px 24px;font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums;box-shadow:var(--bayang)}
.lembar .kop{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:2px solid #111;padding-bottom:10px}
.lembar .kop>div:first-child b{font-size:17px;letter-spacing:.08em;font-family:Georgia,serif}
.lembar h3{font-size:14px;letter-spacing:.14em;margin:14px 0 8px}
.lembar table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
.lembar th,.lembar td{border:1px solid #333;padding:5px 7px;color:#111;vertical-align:top}
.lembar th{background:#eef3ef;font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left}
.lembar .kanan{text-align:right;white-space:nowrap}.lembar .kecil{font-size:11.5px;color:#444}
.lembar table.rekap{width:auto;min-width:0;max-width:100%}.lembar table.rekap td{padding:4px 10px}.lembar tr.tebal td{font-weight:700}
@media (max-width:640px){.inv-empat{grid-template-columns:1fr 1fr}.inv-baris{grid-template-columns:1fr 1fr}.inv-baris .b-no{grid-row:auto;grid-column:1/-1;margin:0;text-align:left}
  .inv-baris .b-toko,.inv-baris .b-barang,.inv-baris .b-ket,.b-jumlah{grid-column:1/-1}.b-jumlah{justify-content:space-between}.inv-kecil{grid-template-columns:minmax(0,1fr) 110px auto}.lembar{padding:16px}}
.ubin{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--kartu);border:0;border-radius:var(--r);padding:16px;box-shadow:var(--bayang);cursor:pointer;color:var(--tinta);text-decoration:none;transition:transform .12s}
.ubin:hover{transform:translateY(-2px)}.ubin:active{transform:scale(.98)}
.ubin b{font-family:var(--serif);font-weight:600;font-size:18px;margin-top:8px}
.ubin small{color:var(--redup);font-size:12.5px;line-height:1.35}
.ubin .ik{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--naik-lembut);color:var(--utama2)}
.ubin .ik.emas{background:var(--emas-lembut);color:var(--emas)}
@media (prefers-color-scheme:dark){.ubin .ik{color:var(--naik)}}

/* ---------- Bilah simpan ---------- */
.bilah{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);margin-top:18px;background:var(--kartu);border-radius:999px;box-shadow:0 12px 34px rgba(15,61,58,.22);
  padding:8px 8px 8px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.bilah .st{font-size:12.5px;color:var(--redup);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bilah .st.ok{color:var(--naik)}.bilah .st.salah{color:var(--turun)}.bilah .st.ubah{color:var(--emas);font-weight:700}

/* ---------- Masuk ---------- */
.masuk{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 90% at 10% 0%,var(--utama2),var(--utama) 55%,#07211f)}
.masuk-kartu{width:min(420px,100%);background:var(--kartu);border-radius:32px;padding:28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.tetes{width:58px;height:58px;border-radius:20px;background:var(--emas-lembut);display:grid;place-items:center;margin-bottom:14px}
.masuk h1{font-size:28px}.masuk p{color:var(--redup);margin:6px 0 18px;font-size:14px}
.medan{display:block;margin-bottom:12px}
.medan span{display:block;font-size:12px;font-weight:700;color:var(--redup);margin-bottom:5px}
.medan input{width:100%;background:var(--kartu2);border:1.5px solid var(--garis);border-radius:18px;padding:14px 16px;font-size:16px}
.medan input.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:700}
.pemisah{display:flex;align-items:center;gap:10px;color:var(--redup);font-size:12px;margin:16px 0 12px}
.pemisah::before,.pemisah::after{content:"";flex:1;height:1px;background:var(--garis)}
.pil.unduh{width:100%;padding:14px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--utama);color:#fff}
.pesan-salah{background:var(--turun-lembut);color:var(--turun);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}

/* ---------- Lembar tawaran pasang (muncul sendiri dari bawah) ---------- */
.tawar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:30;max-width:460px;margin:0 auto;background:var(--kartu);color:var(--tinta);border-radius:26px;padding:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.38);display:flex;gap:12px;align-items:center;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
.tawar.muncul{transform:none}
.tawar img{width:54px;height:54px;border-radius:16px;flex:none}
.tawar .isi{flex:1;min-width:0}.tawar .isi b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}.tawar .isi span{font-size:12.5px;color:var(--redup);line-height:1.3;display:block}
.tawar .aksi{display:flex;flex-direction:column;gap:6px;flex:none}
@media (prefers-reduced-motion:reduce){.tawar{transition:none}}

/* ---------- Keuangan: kalimat ringkasan + alur omzet -> laba bersih ---------- */
.kalimat{font-size:14.5px;line-height:1.65;background:var(--kartu2);border-radius:var(--r-kecil);padding:12px 14px;margin:0 0 12px}
.alur .baris-data{border-bottom:0;padding:9px 12px}
.alur .baris-data .kiri{font-weight:600}
.alur .alur-hasil{background:var(--kartu2);border-radius:14px;margin:6px 0;font-size:16px}
.alur .alur-akhir{background:var(--emas-lembut);font-size:18px;padding:13px 12px}
.alur .alur-akhir .kanan{font-family:var(--serif);font-size:22px}

/* ---------- Harga toko (pemilik mengisi, karyawan membaca) ---------- */
.kepala .tab-baris{margin:16px -16px 0;padding-bottom:0}
.kepala .tab{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.kepala .tab.aktif{background:var(--emas);color:#2a1e02}
.daftar-toko{display:grid;gap:10px;margin-top:12px}
@media (min-width:640px){.daftar-toko{grid-template-columns:1fr 1fr}}
.toko{background:var(--kartu2);border-radius:var(--r-kecil);padding:12px 14px;min-width:0}
.toko.mati{opacity:.55}
.toko-nama{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2}
.toko-nama .keping{font-family:var(--sans)}
.toko-nama .pil{padding:3px 11px;font-size:15px;line-height:1.2;flex:none}
.toko-harga{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hp{display:block;min-width:0}
.hp .l{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--redup);font-weight:700}
.hp .l small{letter-spacing:0;text-transform:none;font-weight:500}
.hp b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;margin-top:2px}
.hp small{display:block;color:var(--redup);font-size:11.5px;margin-top:2px}
.hp .isian{margin-top:3px;padding:8px 10px}
.isian.ubah{border-color:var(--emas);background:var(--emas-lembut);font-weight:700}

/* ---------- Dialog ---------- */
.tirai{position:fixed;inset:0;background:rgba(5,20,18,.55);backdrop-filter:blur(3px);display:grid;place-items:end center;z-index:20;padding:16px}
@media (min-width:640px){.tirai{place-items:center}}
.dialog{width:min(440px,100%);background:var(--kartu);border-radius:28px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.dialog h3{font-size:21px;margin-bottom:6px}
.pin-besar{font-family:var(--serif);font-size:40px;letter-spacing:.18em;text-align:center;background:var(--emas-lembut);border-radius:20px;padding:14px;margin:14px 0}
.tombol-baris{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="akar"></div>

<script>
/* =====================================================================================================
   ABSENSI & GAJI — satu berkas, tanpa build tool.
   Alur: layar masuk -> fungsi database memberi "token" -> token disimpan di HP -> data diambil pakai token.
   Pemilik mendapat semua karyawan dan bisa menyimpan. Karyawan hanya mendapat datanya sendiri (dijaga di
   database, bukan di sini: fungsi minyak_data tidak pernah mengirim data orang lain ke HP karyawan).
   ===================================================================================================== */
const SB_URL = 'https://hzxfheydtrjhizbwbddh.supabase.co';
const SB_KEY = 'sb_publishable_3c_5VhfP4Z9g1dSU9c00HQ_0QkuiHTm';   // kunci publik: aman berada di halaman
const LS = 'absensi-sesi';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const akar = $('#akar');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const ribu = n => Math.round(n || 0).toLocaleString('id-ID');
const HN = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
const HS = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* ---------- Memanggil fungsi database (PostgREST: POST /rest/v1/rpc/<nama_fungsi>) ---------- */
async function rpc(fn, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('Server tidak menjawab (' + r.status + '). Cek internet lalu coba lagi.');
  return r.json();
}
const sesi = { baca() { try { return JSON.parse(localStorage.getItem(LS)); } catch { return null; } },
  tulis(v) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} }, hapus() { try { localStorage.removeItem(LS); } catch {} } };

/* ---------- Hitungan gaji: disalin apa adanya dari panel lama supaya angkanya sama persis ---------- */
function syncHm(e) { (e.minggu || []).forEach(w => { if (!Array.isArray(w.hmd)) { w.hmd = [0, 0, 0, 0, 0, 0, 0]; w.hmx = num(w.hm) || 0; }
  w.hmd = w.hmd.map(num).concat([0, 0, 0, 0, 0, 0, 0]).slice(0, 7); w.hmx = num(w.hmx); w.hm = w.hmd.reduce((a, b) => a + b, 0) + w.hmx; }); }
function syncHb(e) { e.hutang = e.hutang || [];
  (e.minggu || []).forEach(w => { if (w.hbx === undefined) { const v = num(w.hb); if (v > 0 && num(w.w) >= 18) { e.hutang.push({ tgl: '', ket: 'Potongan gaji minggu ' + num(w.w), pinjam: 0, bayar: v, wk: num(w.w) }); w.hbx = 0; } else w.hbx = v; } });
  const by = {}; e.hutang.forEach(d => { d.wk = num(d.wk) || 0; if (d.wk) by[d.wk] = (by[d.wk] || 0) + num(d.bayar); });
  (e.minggu || []).forEach(w => { w.hb = num(w.hbx) + (by[num(w.w)] || 0); }); }
function hitung(e) { e.minggu = e.minggu || []; syncHm(e); syncHb(e);
  const wks = e.minggu.map(w => { const hari = (w.hari || []).map(num).concat([0, 0, 0, 0, 0, 0, 0]).slice(0, 7); const total = hari.reduce((a, b) => a + b, 0);
    return { ...w, hari, total, terima: total - num(w.hm) - num(w.hb), masuk: hari.filter(Boolean).length }; });
  const pinjam = e.hutang.reduce((a, d) => a + num(d.pinjam), 0), bayar = e.hutang.reduce((a, d) => a + num(d.bayar), 0),
    cicil = wks.filter(w => num(w.w) >= 18).reduce((a, w) => a + num(w.hbx), 0), potgaji = e.hutang.reduce((a, d) => a + (num(d.wk) ? num(d.bayar) : 0), 0);
  return { wks, pinjam, bayar, cicil, potgaji, tunai: bayar - potgaji, sisa: pinjam - bayar - cicil }; }
const rincianHm = w => (Array.isArray(w.hmd) && (w.hmd.some(num) || num(w.hmx)))
  ? HS.map((d, i) => num(w.hmd[i]) ? d + ' ' + ribu(w.hmd[i]) : null).filter(Boolean).concat(num(w.hmx) ? ['lain ' + ribu(w.hmx)] : []).join(' · ') : '';

/* =====================================================================================================
   LAYAR MASUK. Link karyawan berbentuk  .../?k=andika  supaya ia hanya perlu mengetik PIN.
   ===================================================================================================== */
function layarMasuk(pesan) {
  const k = (new URLSearchParams(location.search).get('k') || '').toLowerCase();
  const pemilik = k === 'pemilik' || k === 'bos';   // keduanya memakai sandi, bukan PIN 6 angka
  akar.innerHTML = `<main class="masuk"><form class="masuk-kartu" id="fMasuk" autocomplete="off">
    <div class="tetes" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2.5c3.2 4.3 6.5 8 6.5 11.7a6.5 6.5 0 0 1-13 0C5.5 10.5 8.8 6.8 12 2.5z" fill="#d59a1c"/><path d="M9 14.5a3.2 3.2 0 0 0 3 3.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div class="label">Absensi & Gaji</div><h1>Minyak Andre</h1>
    <p>${k === 'bos' ? 'Masuk sebagai bos untuk melihat gaji, keuangan, dan laporan.' : pemilik ? 'Masuk sebagai pemilik untuk mengisi absensi dan gaji.' : 'Masuk untuk melihat absensi dan gajimu. Hanya kamu yang bisa melihat datamu.'}</p>
    ${pesan ? `<div class="pesan-salah" role="alert">${esc(pesan)}</div>` : ''}
    <label class="medan"><span>Kode ${pemilik ? '' : 'karyawan'}</span><input id="mKode" value="${esc(k)}" placeholder="namamu, mis. andika" autocapitalize="none" spellcheck="false" required></label>
    <label class="medan"><span id="lblPin">${pemilik ? 'Sandi' : 'PIN 6 angka'}</span><input id="mPin" type="password" class="${pemilik ? '' : 'pin'}" ${pemilik ? '' : 'inputmode="numeric" maxlength="6"'} required></label>
    <button class="pil emas" style="width:100%;padding:14px;font-size:16px" id="mTombol">Masuk</button>
    <div class="catatan" style="text-align:center">Lupa PIN? Minta PIN baru ke pemilik.</div>
    <div id="kotakPasang" hidden><div class="pemisah"><span>atau</span></div>
      <button type="button" class="pil unduh" id="bPasang" data-pasang><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Download aplikasi</button>
      <div class="catatan" style="text-align:center;margin-top:8px">Pasang di HP supaya jadi ikon aplikasi. Gratis, kecil, tanpa Play Store.</div></div></form></main>`;
  siapkanPasang();
  const fk = $('#mKode'), fp = $('#mPin');
  fk.oninput = () => { const p = ['pemilik', 'bos'].includes(fk.value.trim().toLowerCase()); $('#lblPin').textContent = p ? 'Sandi' : 'PIN 6 angka';
    fp.className = p ? '' : 'pin'; p ? (fp.removeAttribute('maxlength'), fp.removeAttribute('inputmode')) : (fp.maxLength = 6, fp.inputMode = 'numeric'); };
  (k ? fp : fk).focus();
  $('#fMasuk').onsubmit = async ev => { ev.preventDefault(); const b = $('#mTombol'); b.disabled = true; b.textContent = 'Memeriksa…';
    try { const kode = slug(fk.value) || fk.value;   // "Bang Hen" -> "bang-hen"
      const r = await rpc('minyak_masuk', { p_kode: kode, p_pin: fp.value });
      if (!r.ok) return layarMasuk(r.pesan);
      sesi.tulis({ token: r.token, peran: r.peran, kode: r.kode, nama: r.nama }); mulai();
    } catch (e) { layarMasuk(e.message); } };
}
async function keluar() { const s = sesi.baca(); sesi.hapus(); if (s) rpc('minyak_keluar', { p_token: s.token }).catch(() => {}); layarMasuk(); }

/* ---------- Pasang aplikasi (PWA). Chrome Android memberi peristiwa beforeinstallprompt: kita simpan, lalu
   memanggilnya saat tombol ditekan. Peramban lain (iPhone/Firefox) tidak punya peristiwa itu, jadi diberi petunjuk manual. ---------- */
let undangPasang = null;
const sudahTerpasang = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); undangPasang = ev; siapkanPasang(); });
addEventListener('appinstalled', () => { undangPasang = null; document.querySelectorAll('[data-pasang],#kotakPasang').forEach(x => x.hidden = true); });
/* Tawaran pasang otomatis: muncul sendiri sekali saat halaman dibuka di browser (bukan di aplikasi terpasang).
   Dialog Instal milik Chrome hanya boleh dibuka lewat ketukan, jadi ketukan pada tombol "Instal" inilah yang memanggilnya.
   Kalau ditutup, tidak ditawarkan lagi selama 3 hari. */
const LS_TAWAR = 'minyak-tawar-pasang';
function tawarkanPasang() { if (sudahTerpasang() || document.querySelector('.tawar')) return;
  try { if (Date.now() - (+localStorage.getItem(LS_TAWAR) || 0) < 3 * 864e5) return; } catch {}
  const t = document.createElement('div'); t.className = 'tawar'; t.setAttribute('role', 'dialog'); t.setAttribute('aria-label', 'Pasang aplikasi');
  t.innerHTML = `<img src="ikon-any-192.png?v=4" alt=""><div class="isi"><b>Pasang Minyak Andre</b><span>Jadi aplikasi di HP. Gratis, ringan, tanpa Play Store.</span></div>
    <div class="aksi"><button class="pil emas kecil" id="tInstal">Instal</button><button class="pil halus kecil" id="tNanti">Nanti</button></div>`;
  document.body.append(t); requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('muncul')));
  const tutup = ingat => { if (ingat) try { localStorage.setItem(LS_TAWAR, Date.now()); } catch {} t.classList.remove('muncul'); setTimeout(() => t.remove(), 450); };
  t.querySelector('#tNanti').onclick = () => tutup(true);
  t.querySelector('#tInstal').onclick = async () => { tutup(false); await pasang(); }; }
addEventListener('appinstalled', () => document.querySelector('.tawar')?.remove());

function siapkanPasang() { const k = document.getElementById('kotakPasang');
  if (sudahTerpasang()) {   // sudah jadi aplikasi: tombol yang sama dipakai untuk membagikan link ke orang lain
    if (k) { k.hidden = false; const b = document.getElementById('bPasang'); b.lastChild.textContent = 'Bagikan link download'; b.onclick = bagikan;
      k.querySelector('.catatan').textContent = 'Aplikasi sudah terpasang di HP ini. Kirim linknya ke karyawan supaya mereka bisa memasang juga.'; }
    return; }
  if (k) k.hidden = false;
  document.querySelectorAll('[data-pasang]').forEach(b => { b.hidden = false; b.onclick = pasang; }); }
async function bagikan() { const url = location.origin + location.pathname, teks = 'Aplikasi Minyak Andre (absensi & gaji). Buka lewat Chrome, tekan Download aplikasi, lalu masuk dengan nama dan PIN-mu: ' + url;
  try { if (navigator.share) return await navigator.share({ title: 'Minyak Andre', text: teks }); } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(teks); dialog('<h3>Link tersalin</h3><p class="catatan">Tempel di WhatsApp untuk dikirim ke karyawan.</p><div class="tombol-baris"><button class="pil" data-tutup>Oke</button></div>'); }
  catch { dialog('<h3>Link download</h3><p class="catatan" style="word-break:break-all">' + esc(url) + '</p><div class="tombol-baris"><button class="pil" data-tutup>Tutup</button></div>'); } }
async function pasang() { if (undangPasang) { undangPasang.prompt(); const h = await undangPasang.userChoice; if (h.outcome === 'accepted') undangPasang = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  dialog(`<h3>Download aplikasi</h3><p class="catatan" style="margin:0 0 6px">${ios ? 'Di iPhone, buka halaman ini lewat Safari.' : 'Buka halaman ini lewat Chrome.'}</p>
    <div class="baris-data"><div class="kiri">1. Tekan ${ios ? 'tombol Bagikan (kotak dengan panah ke atas)' : 'titik tiga di kanan atas'}</div></div>
    <div class="baris-data"><div class="kiri">2. Pilih <b>${ios ? 'Tambah ke Layar Utama' : 'Instal aplikasi'}</b>${ios ? '' : ' atau <b>Tambahkan ke layar utama</b>'}</div></div>
    <div class="baris-data"><div class="kiri">3. Ikon tetes minyak emas bernama <b>Minyak Andre</b> muncul di layar HP</div></div>
    <div class="tombol-baris"><button class="pil" data-tutup>Mengerti</button></div>`); }

/* ---------- Dialog kecil serbaguna ---------- */
function dialog(html, siap) { const t = document.createElement('div'); t.className = 'tirai'; t.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(t); const tutup = () => t.remove(); t.addEventListener('click', e => { if (e.target === t) tutup(); }); $$('[data-tutup]', t).forEach(b => b.onclick = tutup);
  siap && siap(t, tutup); return tutup; }
function dialogGanti(peran) { const p = peran === 'pemilik';
  dialog(`<h3>Ganti ${p ? 'sandi' : 'PIN'}</h3><div id="gPesan"></div>
    <label class="medan"><span>${p ? 'Sandi' : 'PIN'} lama</span><input id="gLama" type="password" ${p ? '' : 'inputmode="numeric" maxlength="6"'}></label>
    <label class="medan"><span>${p ? 'Sandi baru (minimal 8 karakter)' : 'PIN baru (6 angka)'}</span><input id="gBaru" type="password" ${p ? '' : 'inputmode="numeric" maxlength="6"'}></label>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil" id="gOk">Simpan</button></div>`, (t, tutup) => {
    $('#gOk', t).onclick = async () => { try { const r = await rpc('minyak_ganti_sandi', { p_token: sesi.baca().token, p_lama: $('#gLama', t).value, p_baru: $('#gBaru', t).value });
      if (!r.ok) { $('#gPesan', t).innerHTML = `<div class="pesan-salah">${esc(r.pesan)}</div>`; return; } tutup(); dialog(`<h3>Tersimpan</h3><p class="catatan">${p ? 'Sandi' : 'PIN'} baru sudah berlaku.</p><div class="tombol-baris"><button class="pil" data-tutup>Oke</button></div>`);
    } catch (e) { $('#gPesan', t).innerHTML = `<div class="pesan-salah">${esc(e.message)}</div>`; } }; }); }

/* =====================================================================================================
   TAMPILAN KARYAWAN: hanya membaca. Satu layar panjang yang enak digulir di HP.
   ===================================================================================================== */
const LS_PANEL = 'minyak-panel'; let panelK = (() => { try { return localStorage.getItem(LS_PANEL) === 'harga' ? 'harga' : 'gaji'; } catch { return 'gaji'; } })();
/* Isi panel gaji (5 kartu). Dipakai layar karyawan DAN tampilan baca-saja milik bos, supaya keduanya sama persis. */
function isiGaji(e, angkat = true) {
  const c = hitung(e); const wks = c.wks.filter(w => num(w.w) > 0).sort((a, b) => num(a.w) - num(b.w));
  const k = wks[wks.length - 1] || { w: '—', periode: '', hari: [0, 0, 0, 0, 0, 0, 0], total: 0, hm: 0, hb: 0, terima: 0, masuk: 0, hmd: [] };
  const rinci = rincianHm(k);
  const tg = wks.reduce((a, w) => a + w.total, 0), tm = wks.reduce((a, w) => a + num(w.hm), 0), tb = wks.reduce((a, w) => a + num(w.hb), 0);
  const html = `<section class="besar ${angkat ? 'angkat' : ''}" ${angkat ? '' : 'style="margin-top:16px"'}><div class="label">Gaji diterima minggu ${esc(k.w)}</div><div class="nilai">${rp(k.terima)}</div>
      <div class="keping-baris"><span class="keping"><b>${k.masuk}</b> hari masuk</span><span class="keping">Total gaji <b>${rp(k.total)}</b></span>
      ${num(k.hm) + num(k.hb) ? `<span class="keping">Potongan <b>${rp(num(k.hm) + num(k.hb))}</b></span>` : ''}</div>
      ${wks.length ? '<button class="pil emas kecil" id="bSlip" style="margin-top:14px">Unduh slip gaji (PDF)</button>' : ''}</section>

    <section class="kartu"><h2>Absensi minggu ${esc(k.w)}</h2>
      <div class="hari7">${k.hari.map((v, i) => `<div class="hari ${v ? 'hadir' : 'libur'}"><b>${HS[i]}</b><span>${v ? ribu(v) : '—'}</span></div>`).join('')}</div>
      <div class="catatan">Angka di tiap hari adalah gaji hari itu. Tanda — berarti tidak masuk.</div></section>

    <section class="kartu"><h2>Rincian minggu ${esc(k.w)}</h2>
      <div class="baris-data"><div class="kiri">Total gaji</div><div class="kanan">${rp(k.total)}</div></div>
      <div class="baris-data"><div class="kiri">Potongan hutang mingguan${rinci ? `<small>${esc(rinci)}</small>` : ''}</div><div class="kanan minus">− ${rp(k.hm)}</div></div>
      <div class="baris-data"><div class="kiri">Potongan hutang besar</div><div class="kanan minus">− ${rp(k.hb)}</div></div>
      <div class="baris-data total"><div class="kiri">Gaji diterima</div><div class="kanan">${rp(k.terima)}</div></div></section>

    <section class="kartu"><h2>Hutang besar <span class="keping ${c.sisa > 0 ? 'merah' : 'hijau'}">${c.sisa > 0 ? 'Sisa ' + rp(c.sisa) : 'Lunas'}</span></h2>
      ${e.hutang.length ? e.hutang.map(d => `<div class="baris-data"><div class="kiri">${esc(d.ket || (num(d.pinjam) ? 'Pinjaman' : 'Pembayaran'))}
        <small>${esc(d.tgl || '')}${num(d.wk) ? (d.tgl ? ' · ' : '') + 'potong gaji minggu ' + num(d.wk) : ''}</small></div>
        <div class="kanan">${num(d.pinjam) ? `<span class="minus">+ ${rp(d.pinjam)}</span>` : ''}${num(d.pinjam) && num(d.bayar) ? '<br>' : ''}${num(d.bayar) ? `<span style="color:var(--naik)">− ${rp(d.bayar)}</span>` : ''}</div></div>`).join('') : '<div class="catatan" style="margin:0">Tidak ada hutang besar.</div>'}
      ${e.hutang.length ? `<div class="catatan">Pinjaman ${rp(c.pinjam)} − sudah dibayar ${rp(c.bayar + c.cicil)} (potongan gaji ${rp(c.potgaji + c.cicil)} + tunai ${rp(c.tunai)}).</div>` : ''}</section>

    <section class="kartu"><h2>Riwayat mingguan</h2>
      ${[...wks].reverse().map(w => `<div class="baris-data"><div class="kiri">Minggu ${esc(w.w)} · ${w.masuk} hari<small>${esc(w.periode || '')}${num(w.hm) + num(w.hb) ? ' · potongan ' + rp(num(w.hm) + num(w.hb)) : ''}</small></div><div class="kanan">${rp(w.terima)}<small style="display:block;font-weight:500;color:var(--redup)">dari ${rp(w.total)}</small><button class="pil halus kecil" data-slipw="${esc(w.w)}" style="margin-top:4px;padding:4px 10px;font-size:11.5px">PDF</button></div></div>`).join('') || '<div class="catatan" style="margin:0">Belum ada data.</div>'}
      ${wks.length ? `<div class="baris-data total"><div class="kiri">Total ${wks.length} minggu</div><div class="kanan">${rp(tg - tm - tb)}</div></div>` : ''}</section>`;
  return { k, wks, html };
}
const ikatSlip = (e, k) => { const bs = $('#bSlip'); if (bs) bs.onclick = () => pdfSlip(e, k.w); $$('[data-slipw]').forEach(b => b.onclick = () => pdfSlip(e, b.dataset.slipw)); };

function layarKaryawan(e, diubah) {
  const { k, html } = isiGaji(e);
  const kapan = diubah ? new Date(diubah).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  akar.innerHTML = `<header class="kepala"><div class="bungkus"><div class="baris"><div><div class="label">Minyak Andre · Absensi & Gaji</div><h1>${esc(e.nama)}</h1>
      <p>Minggu ${esc(k.w)}${k.periode ? ' · ' + esc(k.periode) : ''}</p></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="pil emas kecil" data-pasang hidden>Download</button><button class="pil kaca kecil" id="bKeluar">Keluar</button></div></div>
    <nav class="tab-baris" aria-label="Panel"><button class="tab ${panelK === 'gaji' ? 'aktif' : ''}" data-panel="gaji">Gaji</button><button class="tab ${panelK === 'harga' ? 'aktif' : ''}" data-panel="harga">Harga toko</button></nav></div></header>
  <main class="bungkus"><div id="panelHarga" ${panelK === 'harga' ? '' : 'hidden'}></div><div id="panelGaji" ${panelK === 'gaji' ? '' : 'hidden'}>${html}
    <div class="catatan" style="text-align:center;margin-top:18px">Data diisi oleh pemilik${kapan ? ' · diperbarui ' + esc(kapan) : ''}.<br>
      <button class="pil halus kecil" id="bPin" style="margin-top:10px">Ganti PIN</button> <button class="pil halus kecil" id="bMuat" style="margin-top:10px">Muat ulang</button> <button class="pil kecil" id="bPasangBawah" style="margin-top:10px" data-pasang hidden>Pasang di HP</button></div>
  </div></main>`;
  siapkanPasang();
  // Dua panel: Gaji (isi di atas) dan Harga toko (dimuat saat pertama dibuka). Panel terakhir diingat di HP.
  const bukaPanel = p => { panelK = p; try { localStorage.setItem(LS_PANEL, p); } catch {} $$('[data-panel]').forEach(x => x.classList.toggle('aktif', x.dataset.panel === p));
    $('#panelGaji').hidden = p !== 'gaji'; const ph = $('#panelHarga'); ph.hidden = p !== 'harga'; if (p === 'harga' && !ph.dataset.siap) { ph.dataset.siap = 1; panelHargaKaryawan(ph); } };
  $$('[data-panel]').forEach(b => b.onclick = () => { bukaPanel(b.dataset.panel); scrollTo({ top: 0 }); }); if (panelK === 'harga') bukaPanel('harga');
  $('#bKeluar').onclick = keluar; $('#bPin').onclick = () => dialogGanti('karyawan'); $('#bMuat').onclick = mulai;
  ikatSlip(e, k);
}

/* ---------- Tampilan baca-saja untuk akun bos: rincian karyawan & harga toko tanpa kotak isian ---------- */

const semuaMinggu = () => [...new Set(Object.values(data).flatMap(e => (e.minggu || []).map(w => num(w.w)).filter(w => w > 0)))].sort((a, b) => a - b);

function gambarRingkasan() {

  const T = f => baris.reduce((a, r) => a + r[f], 0), mx = Math.max(1, ...baris.map(r => r.terima)), per = (baris.find(r => r.per) || {}).per || '';

        ${r.sisa > 0 ? `<span class="keping merah">Sisa hutang ${rp(r.sisa)}</span>` : ''}${punyaPin[r.k] ? '' : '<span class="keping merah">belum punya PIN</span>'}</span></button>`).join('')}
      <div class="catatan">${bacaSaja ? 'Ketuk nama untuk melihat rincian gaji, absensi, dan hutangnya.' : 'Ketuk nama untuk mengisi gaji.'} Karyawan nonaktif tidak dihitung di sini.</div></section>
    ${nonaktif.length ? `<section class="kartu"><h2>Nonaktif</h2><div class="catatan" style="margin:0">${nonaktif.map(e => esc(e.nama)).join(', ')} — tidak bisa masuk ke aplikasi.</div></section>` : ''}`;
  $('#pilihMinggu').onchange = ev => { mingguRingkas = num(ev.target.value); gambarRingkasan(); };

/* Periode minggu berikutnya ditebak dari periode minggu sebelumnya ("14 - 19 September 2026"): tanggal terakhir di teks
   dianggap akhir minggu, lalu dicari Sabtu sesudahnya; Senin = Sabtu - 5 hari. Kalau tidak terbaca, dipakai Senin–Sabtu minggu ini. */
function akhirPeriode(per) {
  const m = [...String(per || '').matchAll(/(\d{1,2})\s+([A-Za-z]+)(?:\s+(\d{4}))?/g)].pop(); if (!m) return null;
  const bi = BLN_L.findIndex(x => x.slice(0, 3).toLowerCase() === m[2].slice(0, 3).toLowerCase());
  return bi < 0 ? null : new Date(+(m[3] || new Date().getFullYear()), bi, +m[1]); }
function periodeBerikut(per) {
  let sab = akhirPeriode(per);
  if (sab) sab.setDate(sab.getDate() + ((6 - sab.getDay() + 7) % 7 || 7));
  else { sab = new Date(); sab.setHours(0, 0, 0, 0); sab.setDate(sab.getDate() + (6 - sab.getDay() + 7) % 7); }
  const sen = new Date(sab); sen.setDate(sab.getDate() - 5);
  const t = d => d.getDate() + ' ' + BLN_L[d.getMonth()];
  if (sen.getMonth() === sab.getMonth()) return `${sen.getDate()} - ${t(sab)} ${sab.getFullYear()}`;
  return sen.getFullYear() === sab.getFullYear() ? `${t(sen)} - ${t(sab)} ${sab.getFullYear()}` : `${t(sen)} ${sen.getFullYear()} - ${t(sab)} ${sab.getFullYear()}`;
}

/* Satu tombol untuk membuka minggu baru di semua karyawan aktif sekaligus, dengan nomor dan periode yang sama.
   Yang ditawarkan: minggu terakhir kalau periodenya belum lewat dan masih ada karyawan aktif yang belum punya
   (misalnya sebagian sudah dibuat satu per satu); selain itu minggu berikutnya. Nomornya tetap bisa diganti di jendela. */
function dialogMingguSerentak() {
  const aktif = Object.entries(data).filter(([, e]) => e.aktif).sort((a, b) => a[1].nama.localeCompare(b[1].nama));
  if (!aktif.length) return status('Belum ada karyawan aktif', 'salah');
  const wl = semuaMinggu(), mx = wl.length ? wl[wl.length - 1] : 0;
  const cari = (e, w) => (e.minggu || []).find(x => num(x.w) === w);
  const perW = w => (Object.values(data).flatMap(x => x.minggu || []).find(x => num(x.w) === w && x.periode) || {}).periode || '';
  const tebak = w => perW(w) || periodeBerikut(perW(Math.max(0, ...wl.filter(x => x < w))));
  const akhir = akhirPeriode(perW(mx)), kemarin = new Date(); kemarin.setHours(0, 0, 0, 0); kemarin.setDate(kemarin.getDate() - 1);
  const w0 = mx && akhir && akhir >= kemarin && aktif.some(([, e]) => !cari(e, mx)) ? mx : mx + 1;
  dialog(`<h3>Minggu baru untuk semua karyawan</h3>
    <label class="medan"><span>Nomor minggu</span><input id="sW" inputmode="numeric" value="${w0}"></label>
    <label class="medan"><span>Periode</span><input id="sPer" value="${esc(tebak(w0))}" placeholder="mis. 28 September - 3 Oktober 2026"></label>
    <div class="catatan" style="margin:0 0 6px">Karyawan yang dibuatkan minggu ini:</div><div id="sDaftar"></div><div id="sPesan"></div>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil emas" id="sOk">Buat dan simpan</button></div>`, (t, tutup) => {
    let perDiketik = false;
    const isiDaftar = () => { const w = num($('#sW', t).value);
      $('#sDaftar', t).innerHTML = aktif.map(([k, e]) => { const ada = w > 0 && cari(e, w);
        return `<label style="display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:14px"><input type="checkbox" data-k="${esc(k)}" ${ada ? 'disabled' : 'checked'}> ${esc(e.nama)}${ada ? ' <span class="keping">sudah ada</span>' : ''}</label>`; }).join(''); };
    isiDaftar();
    $('#sPer', t).oninput = () => { perDiketik = true; };
    $('#sW', t).oninput = () => { const w = num($('#sW', t).value); if (!perDiketik && w > 0) $('#sPer', t).value = tebak(w); isiDaftar(); };
    $('#sOk', t).onclick = async () => { const w = num($('#sW', t).value), per = $('#sPer', t).value.trim();
      if (!(w > 0)) { $('#sPesan', t).innerHTML = '<div class="pesan-salah">Isi nomor minggu dulu.</div>'; return; }
      const pilih = $$('#sDaftar input:checked', t).map(c => c.dataset.k);
      if (!pilih.length) { $('#sPesan', t).innerHTML = `<div class="pesan-salah">Semua karyawan aktif sudah punya minggu ${w}.</div>`; return; }
      for (const k of pilih) { const e = data[k];
        e.minggu.push({ w, periode: per, hari: [0, 0, 0, 0, 0, 0, 0], hmd: [0, 0, 0, 0, 0, 0, 0], hmx: 0, hm: 0, hb: 0, hbx: 0 });
        e.minggu.sort((a, b) => num(a.w) - num(b.w)); tandai(k); }
      // minggu yang sudah ada tapi periodenya masih kosong ikut diisi
      if (per) for (const [k, e] of aktif) { const x = cari(e, w); if (x && !x.periode) { x.periode = per; tandai(k); } }
      mingguRingkas = w; buka = {}; tutup(); gambar(); await simpan(); }; });
}

  isi.innerHTML = `<section class="kartu"><h2>${esc(e.nama)} <span style="display:flex;gap:6px;flex-wrap:wrap"><button class="pil halus kecil" id="bPin">${punyaPin[k] ? 'PIN baru' : 'Buat PIN'}</button><button class="pil halus kecil" id="bAktif">${e.aktif ? 'Nonaktifkan' : 'Aktifkan'}</button></span></h2>

        <div class="kotak ${c.sisa > 0 ? 'merah' : ''}"><div class="l">Sisa hutang besar</div><div class="v" id="kSisa">${rp(c.sisa)}</div></div>

    <section class="kartu"><h2>Absensi & gaji per minggu <button class="pil kecil" id="bMinggu">+ Minggu baru</button></h2><div id="daftarMinggu"></div>

      <div class="catatan" id="ringkasHutang"></div></section>`;

  const gambarMinggu = () => { const c2 = hitung(e);

          <div class="sub-judul"><span>Hutang mingguan per hari</span></div>
          <div class="kisi7">${HN.map((d, di) => `<div><input class="isian" data-hd="${di}" value="${w.hmd[di] || ''}" placeholder="0" inputmode="numeric" aria-label="Hutang ${d}"></div>`).join('')}</div>
          <div class="sub-judul"><span>Hutang mingguan lain-lain</span><input class="isian angka" style="width:130px" data-hx value="${w.hmx || ''}" placeholder="0" inputmode="numeric"></div></div>
        <div class="hasil"><span class="keping"><b data-o="masuk">${w.masuk}</b> hari</span><span class="keping">Total <b data-o="total">${rp(w.total)}</b></span><span class="keping">Mingguan − <b data-o="hm">${rp(w.hm)}</b></span>

      const segar = () => { const x = hitung(e).wks[i]; ['masuk'].forEach(f => $(`[data-o=${f}]`, el).textContent = x[f]); ['total', 'hm', 'hb', 'terima'].forEach(f => $(`[data-o=${f}]`, el).textContent = rp(x[f])); segarAtas(); };
      $$('[data-h]', el).forEach(inp => inp.oninput = () => { w.hari[+inp.dataset.h] = num(inp.value); tandai(k); segar(); });
      $$('[data-hd]', el).forEach(inp => inp.oninput = () => { w.hmd[+inp.dataset.hd] = num(inp.value); tandai(k); segar(); });
      $('[data-hx]', el).oninput = ev => { w.hmx = num(ev.target.value); tandai(k); segar(); };

      $('[data-lipat]', el).onclick = () => { const b = $('[data-badan]', el); b.hidden = !b.hidden; buka[k + ':' + i] = !b.hidden; $('[data-lipat]', el).textContent = b.hidden ? 'Buka' : 'Tutup'; };
      $('[data-hapus]', el).onclick = () => { if (!confirm(`Hapus minggu ${w.w} milik ${e.nama}?`)) return; e.minggu.splice(i, 1); tandai(k); gambarMinggu(); gambarHutang(); segarAtas(); }; }); };

  const gambarHutang = () => { const c2 = hitung(e), pil = [...c2.wks].reverse().map(w => num(w.w));
    $('#daftarHutang').innerHTML = e.hutang.map((d, i) => `<div class="hutang-baris" data-i="${i}"><input class="isian" data-hf="tgl" value="${esc(d.tgl || '')}" placeholder="2026-09-17" aria-label="Tanggal">

/* PIN baru: dibuat acak di HP pemilik, dikirim ke database (disimpan sebagai hash), lalu ditampilkan SEKALI untuk diteruskan. */

async function muatKeuangan() { if (keu) return keu;
  const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'keuangan' });

/* Invoice harian ikut laporan keuangan (29 Sep 2026). Data keuangan disusun laptop dari Excel penjualan (minggu -> hari
   -> pengantar). Invoice harian yang HARI dan PENGANTARNYA belum ada di Excel ditambahkan di sini, di aplikasi saja
   (database keuangan tidak diubah). Kalau penjualan yang sama nanti juga diketik di Excel, invoice itu otomatis tidak
   dihitung lagi, jadi tidak terhitung dua kali. Kendi kosong tidak masuk omzet (sama seperti tabel modal di Excel).
   Modal: curah = kg x modal per kg minggu Excel terakhir; dus = modal per dus Minyak Kita terakhir di Excel. */
const HARI_K = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
const isoTgl = d => d.toLocaleDateString('sv-SE');
function awalMinggu(k, w) {   // Senin minggu w dari teks periode, mis. "28 Sep – 3 Okt" atau "3 – 8 Agu"

  const bi = BLN_P.findIndex(x => x.toLowerCase() === (ma[2] || mb[2]).toLowerCase()); if (bi < 0) return null;
  const kini = new Date(k.diambil || Date.now()); return new Date(kini.getFullYear() - (bi > kini.getMonth() + 1 ? 1 : 0), bi, +ma[1]); }
function gabungInvoiceKeu(k0, inv) {
  const H = (inv?.daftar || []).filter(h => !h.batal && h.tgl).sort((a, b) => a.tgl.localeCompare(b.tgl)); if (!k0 || !H.length) return k0;
  const k = JSON.parse(JSON.stringify(k0)), status = {}, senin = {};
  k.WK.forEach(w => { const d = awalMinggu(k, w); if (d) senin[w] = isoTgl(d); });
  const wAkhir = Math.max(...k.WK), sAkhir = senin[wAkhir], mundur = [...k.WK].sort((a, b) => b - a);
  const tr = mundur.map(w => k.D[w]?.tot).find(t => t && t.tonase > 0 && t.modal_curah > 0), modalKg = tr ? tr.modal_curah / tr.tonase : 0;
  const jk = mundur.map(w => Object.entries(k.D[w]?.jenis || {}).find(([n, v]) => /kita|dus|kemasan/i.test(n) && v.qty > 0 && v.hpp > 0)).find(Boolean), modalDus = jk ? jk[1].hpp / jk[1].qty : 0;

      k.D[w] = { tot: { lk: 0, hpp: 0, ops: 0, qty: 0, gaji: 0, omset: 0, bersih: 0, tonase: 0, q_curah: 0, biayaops: 0, modal_curah: 0, omset_curah: 0 }, days: [], gaji: [], biaya: [], jenis: {}, pengantar: {} };
      k.WK.push(w); k.WK.sort((a, b) => a - b); k.HARI[w] = 0; senin[w] = snI; }
    const D = k.D[w]; D.days ||= []; D.biaya ||= []; D.jenis ||= {}; D.pengantar ||= {};

      const x = jen[nama] ||= { hpp: 0, qty: 0, omset: 0 }; x.hpp += m; x.qty += r.qty; x.omset += nilai; }

const DOCFARM = { 'laporan-harian': 'https://doc.farm/laporan-harian-minyak-minggu-', dashboard: 'https://doc.farm/dashboard-keuangan-minyak' };
async function bukaLaporan(kunci) {
  const lapis = document.createElement('div');
  lapis.style.cssText = 'position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column';
  lapis.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #e5e7e3;background:#fff">
    <button class="pil kecil" id="tutupLaporan" style="white-space:nowrap;flex:none">← Kembali</button><b style="font-size:15px;white-space:nowrap">${kunci === 'dashboard' ? 'Dashboard bulanan' : 'Laporan harian'}</b>
    <span class="catatan" id="waktuLaporan" style="margin-left:auto;text-align:right;font-size:12px"></span></div><div style="flex:1;display:grid;place-items:center">Memuat…</div>`;
  document.body.appendChild(lapis); document.body.style.overflow = 'hidden';
  const tutup = () => { lapis.remove(); document.body.style.overflow = ''; };
  $('#tutupLaporan', lapis).onclick = tutup;
  try {
    const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: kunci });
    if (!r.ok) throw new Error(r.pesan);
    if (!r.nilai?.html) { tutup(); const k = await muatKeuangan().catch(() => null);
      window.open(kunci === 'dashboard' ? DOCFARM.dashboard : DOCFARM[kunci] + (k ? Math.max(...k.WK) : ''), '_blank', 'noopener'); return; }
    const bingkai = document.createElement('iframe');
    bingkai.style.cssText = 'flex:1;width:100%;border:0'; bingkai.title = 'Laporan'; bingkai.srcdoc = r.nilai.html;
    lapis.lastElementChild.replaceWith(bingkai);
    $('#waktuLaporan', lapis).textContent = new Date(r.diubah).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  } catch (e) { lapis.lastElementChild.innerHTML = `<div class="pesan-salah">${esc(e.message)}</div>`; }
}

// Kartu "Pembaruan otomatis": kapan Excel terakhir terbaca dan catatan singkat dari Gemini.
async function tampilkanPembaruan() {
  const el = $('#kartuPembaruan'); if (!el) return;
  try {
    const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'pembaruan' });
    const p = r.ok && r.nilai; if (!p) return;
    const kapan = new Date(r.diubah).toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `<div class="label">Pembaruan otomatis · ${esc(kapan)}</div>
      <p style="margin:6px 0 0">${p.galat ? `<span class="pesan-salah">Pembaruan minggu ${esc(p.minggu)} gagal: ${esc(p.galat)}. Laporan di aplikasi masih versi sebelumnya.</span>`
        : `Minggu ${esc(p.minggu)} terisi sampai <b>${esc(p.hariTerakhir?.hari || '')}</b>${p.tutupMinggu ? `, minggu sudah <b>ditutup</b> dengan gaji ${esc(p.tutupMinggu.gajiBruto)}` : ''}. Laporan harian, dashboard, keuangan, dan harga toko sudah ikut diperbarui.`}</p>
      ${(p.periksa || []).map(t => `<div class="pesan-salah" style="margin-top:8px">${esc(t)}</div>`).join('')}
      ${(p.tokoMirip || []).map(t => `<div class="catatan" style="margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff7e6;color:#7a5200">${esc(t)}</div>`).join('')}
      ${p.ringkasan ? `<p style="margin:10px 0 0;white-space:pre-line">${esc(p.ringkasan)}</p><div class="catatan" style="margin-top:6px">Catatan ditulis Gemini dari angka laporan.</div>` : ''}`;
    el.hidden = false;
    // Pemeriksaan mentor: routine Claude di cloud mengecek ulang kerja agen tiap malam (repo privat minyak-mentor).
    const rm = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'mentor' }).catch(() => null);
    const mt = rm?.ok && rm.nilai;
    // Pesan yang sebenarnya untuk Claude di laptop (nama berkas, nama kolom data, "minta Claude ...") tidak boleh tampil
    // di sini; pemilik hanya mau membaca yang bisa dia kerjakan sendiri (23 Sep 2026). Laptop sudah menyaring, ini lapis kedua.
    const TEKNIS_KATA = /claude di laptop|minta claude|usulan\.md|riwayat\/|aturan-agen|periksa\.mjs|[\w-]+\.(json|mjs|md|py|html|xlsx)\b|rincian(nya)? di /i;
    const TEKNIS_KODE = /\b[a-z]+[A-Z][a-zA-Z]*\b/;   // nama kolom data ditulis gayaSepertiIni; sengaja peka huruf besar
    const teknis = t => TEKNIS_KATA.test(t) || TEKNIS_KODE.test(t);
    const kalimatBersih = t => String(t || '').split(/(?<=\.)\s+/).filter(k => k.trim() && !teknis(k)).join(' ').trim();
    if (mt?.catatan) el.insertAdjacentHTML('beforeend', `<div style="margin-top:14px;padding-top:12px;border-top:1px solid #e5e7e3">
      <div class="label">Pemeriksaan mentor · ${esc(new Date(mt.waktu).toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }))}</div>
      <p style="margin:6px 0 0;white-space:pre-line">${esc(kalimatBersih(mt.catatan) || mt.catatan)}</p>
      ${(mt.masalah || []).filter(t => !teknis(t)).map(t => `<div class="pesan-salah" style="margin-top:8px">${esc(t)}</div>`).join('')}
      <div class="catatan" style="margin-top:6px">Diperiksa Claude: angka laporan dicocokkan ulang dan catatan agen dinilai.</div></div>`);
  } catch { /* kartu tetap tersembunyi */ }
}

/* BULAN: minggu kerja digabung menjadi bulan. Satu minggu masuk ke bulan tempat hari Sabtunya jatuh (tanggal akhir di k.PER),
   karena gaji dan rekap dibuat per minggu. Minggu lama (tanpa `days`) hanya punya angka total, jadi rinciannya dicatat terpisah. */
const BLN_P = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'], BLN_L = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function bulanKeu(k) { const kini = new Date(k.diambil || Date.now()), peta = {};
  for (const w of k.WK) { const d = k.D[w]; if (!d) continue;
    const m = [...String(k.PER[w] || '').matchAll(/(\d+)\s+([A-Za-z]{3})/g)].pop(); let bi = m ? BLN_P.indexOf(m[2][0].toUpperCase() + m[2].slice(1).toLowerCase()) : -1; if (bi < 0) bi = kini.getMonth();
    const th = kini.getFullYear() - (bi > kini.getMonth() + 1 ? 1 : 0), key = `${th}-${String(bi + 1).padStart(2, '0')}`;
    const b = peta[key] ??= { key, nama: BLN_L[bi] + ' ' + th, minggu: [], hari: 0, tot: { omset: 0, hpp: 0, qty: 0, lk: 0, ops: 0, gaji: 0, biayaops: 0, bersih: 0 }, pengantar: {}, jenis: {}, biaya: [], gaji: {}, opsRinci: 0, gajiRinci: 0, tanpaRinci: [] };
    b.minggu.push(w); b.hari += k.HARI[w] || 0; for (const f in b.tot) b.tot[f] += d.tot[f] || 0;
    for (const [n, v] of Object.entries(d.pengantar || {})) { const p = b.pengantar[n] ??= { qty: 0, lk: 0, ops: 0 }; p.qty += v.qty || 0; p.lk += v.lk || 0; p.ops += v.ops || 0; }
    for (const [n, v] of Object.entries(d.jenis || {})) { const j = b.jenis[n] ??= { qty: 0, omset: 0, hpp: 0 }; j.qty += v.qty; j.omset += v.omset; j.hpp += v.hpp; }
    (d.biaya || []).forEach(x => { b.biaya.push({ ...x, w }); b.opsRinci += x.nilai; });
    (d.gaji || []).forEach(x => { const g = b.gaji[x.nama] ??= { nama: x.nama, total: 0, hm: 0, hb: 0, terima: 0, n: 0 }; g.total += x.total; g.hm += x.hm; g.hb += x.hb; g.terima += x.terima; g.n++; b.gajiRinci += x.total; });
    if (!d.days) b.tanpaRinci.push(w); }
  const daftar = Object.values(peta).sort((a, b) => b.key.localeCompare(a.key)), mxW = Math.max(...k.WK);
  daftar.forEach(b => { b.minggu.sort((x, y) => x - y); b.berjalan = b.minggu.includes(mxW); b.gajiTertunda = b.berjalan && !(k.D[mxW].tot.gaji > 0) ? mxW : null; }); return daftar; }
/* Ringkasan satu BULAN dalam bentuk ALUR (omzet -> modal -> laba kotor -> biaya -> gaji -> laba bersih) + kalimat bahasa sehari-hari.
   Dipakai halaman Keuangan dan PDF supaya keduanya bercerita sama. */
function ringkasKeu(k, B, lalu) { const t = B.tot, hr = B.hari || 1;
  const alur = [['Omzet', t.omset, 'semua penjualan selama ' + B.nama, 'awal'], ['Modal minyak (HPP)', t.hpp, 'harga beli minyak yang terjual', 'kurang'],
    ['Laba kotor', t.lk, pc(t.lk / (t.omset || 1)) + ' dari omzet', 'hasil'], ['Biaya operasional', t.ops, 'bensin, parkir, makan, dan biaya harian pengantar', 'kurang']];
  if (t.gaji) alur.push(['Gaji karyawan', t.gaji, 'gaji bruto ' + B.minggu.length + ' minggu' + (B.gajiTertunda ? ' (minggu ' + B.gajiTertunda + ' belum dihitung)' : ''), 'kurang']);
  alur.push(['Laba bersih', t.bersih, pc(t.bersih / (t.omset || 1)) + ' dari omzet · ' + rp(t.bersih / (t.qty || 1)) + ' per unit', 'akhir']);
  let kalimat = `${B.nama}${B.berjalan ? ' (bulan berjalan)' : ''}: ${B.minggu.length} minggu kerja, ${B.hari} hari kerja, terjual ${ribu(t.qty)} unit dengan omzet ${rp(t.omset)}. Setelah dikurangi modal minyak ${rp(t.hpp)}, laba kotor ${rp(t.lk)} (${pc(t.lk / (t.omset || 1))}). ` +
    `Dikurangi biaya operasional ${rp(t.ops)}${t.gaji ? ' dan gaji ' + rp(t.gaji) : ''}, laba bersih ${rp(t.bersih)}, rata-rata ${rp(t.bersih / hr)} per hari kerja.`;
  if (B.gajiTertunda) kalimat += ` Gaji minggu ${B.gajiTertunda} belum masuk karena minggunya belum selesai, jadi laba bersih ini masih akan berkurang.`;
  if (lalu) { const a = t.bersih / hr, b = lalu.tot.bersih / (lalu.hari || 1), x = (a - b) / Math.abs(b || 1);
    kalimat += ` ${lalu.nama}: laba bersih ${rp(lalu.tot.bersih)} dari ${lalu.hari} hari kerja (${rp(b)} per hari), jadi rata-rata harian bulan ini ${x >= 0 ? 'naik' : 'turun'} ${Math.abs(x * 100).toFixed(1).replace('.', ',')}%.`; }
  return { t, alur, kalimat }; }
/* Biaya dikelompokkan per jenis (Bensin, Parkir, ...), dengan subtotal per orang. */
function kelompokBiaya(biaya) { const by = {};
  (biaya || []).forEach(x => { const nm = judulKecil(x.jenis), g = by[nm] ??= { jenis: nm, total: 0, kali: 0, orang: {} }; g.total += x.nilai; g.kali++; const o = judulKecil(x.orang || '-'); g.orang[o] = (g.orang[o] || 0) + x.nilai; });
  return Object.values(by).sort((a, b) => b.total - a.total); }

/* =====================================================================================================

     { toko: [ { id, nama, aktif, curah: [{tgl, harga}, ...], dus: [{tgl, harga}, ...] } ] }
   Riwayat hanya bertambah saat harga BERUBAH, jadi "harga sama = tidak perlu diisi" berlaku dengan sendirinya:
   harga yang berlaku = catatan bertanggal paling akhir. Pemilik menulis (minyak_harga_tulis), karyawan membaca
   (minyak_harga_baca). Kotak yang tidak disentuh pemilik tidak pernah ikut disimpan.

let harga = null, hargaDiubah = null, hargaKotor = false, cariToko = '';

const hariIni = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const tglPendek = t => t ? new Date(t + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) : '';
const tglPanjang = t => t ? new Date(t + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '';
const riwayat = (t, p) => [...(t[p] || [])].sort((a, b) => a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : 0);   // urut tanggal naik
const hargaKini = (t, p) => { const r = riwayat(t, p); return r[r.length - 1] || null; };

async function muatHarga(paksa) { if (harga && !paksa) return harga;

/* ----- Sisi karyawan: hanya membaca ----- */
function kartuHargaBaca(t) {
  const baru = PRODUK.some(([p]) => hargaSebelum(t, p) && baruSaja(hargaKini(t, p)?.tgl));   // "Baru" hanya kalau memang BERUBAH dari harga sebelumnya
  return `<div class="toko"><div class="toko-nama"><span>${esc(t.nama)}</span>${baru ? '<span class="keping hijau" style="font-size:11px;padding:2px 9px">Baru</span>' : ''}</div>

      return `<div class="hp"><span class="l">${nm} <small>${sat}</small></span><b>${k ? rp(k.harga) : '—'}</b><small>${k ? panah(k, s) + (s ? 'dari ' + rp(s.harga) + ' · ' : '') + 'sejak ' + tglPendek(k.tgl) : 'belum ada harga'}</small></div>`; }).join('')}</div></div>`; }

   Dari satu invoice harian bisa diunduh: invoice harian (semua toko, dengan harga), surat jalan harian (tanpa harga,
   satu kolom tanda tangan tiap toko), nota per toko dan surat jalan per toko (format berkas Word surat jalan, satu
   halaman per toko, digabung satu PDF), dan Excel bersusunan lembar penjualan.
   Data di minyak_nilai kunci 'invoice' (lihat supabase/skema.sql): { profil, daftar: [invoice harian] }.
   Identitas usaha untuk kepala surat (profil) hanya ada di database, diisi lewat tombol "Kepala surat". */

const tokoCocok = nama => (harga?.toko || []).find(t => t.nama.trim().toLowerCase() === String(nama || '').trim().toLowerCase());
const hargaPada = (t, p, tgl) => { const r = riwayat(t, p).filter(x => x.tgl <= tgl); return (r[r.length - 1] || hargaKini(t, p) || {}).harga || 0; };
const jenisBarang = b => BARANG.find(x => x[0].toLowerCase() === String(b.barang || '').trim().toLowerCase());
const jmlBaris = r => (r.qty || 0) * (r.harga || 0);
const hutangBaris = r => Math.min(jmlBaris(r), r.hutang || 0);
const sumBy = (a, f) => (a || []).reduce((s, x) => s + (f(x) || 0), 0);
function terbilang(n) { n = Math.floor(Math.abs(n || 0)); if (!n) return 'Nol rupiah';
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const f = x => x < 12 ? s[x] : x < 20 ? f(x - 10) + ' belas' : x < 100 ? f(Math.floor(x / 10)) + ' puluh ' + f(x % 10)
    : x < 200 ? 'seratus ' + f(x - 100) : x < 1000 ? f(Math.floor(x / 100)) + ' ratus ' + f(x % 100)
    : x < 2000 ? 'seribu ' + f(x - 1000) : x < 1e6 ? f(Math.floor(x / 1000)) + ' ribu ' + f(x % 1000)
    : x < 1e9 ? f(Math.floor(x / 1e6)) + ' juta ' + f(x % 1e6) : x < 1e12 ? f(Math.floor(x / 1e9)) + ' miliar ' + f(x % 1e9) : f(Math.floor(x / 1e12)) + ' triliun ' + f(x % 1e12);
  const t = f(n).replace(/\s+/g, ' ').trim(); return t[0].toUpperCase() + t.slice(1) + ' rupiah'; }

// Hitungan satu hari, sama dengan REKAPAN AKHIR di Excel:
//   uang yang harus ada = penjualan - hutang toko hari ini + toko bayar hutang lama
//   selisih = uang yang harus ada - pengeluaran - setoran (0 berarti kas cocok)
function hitungHarian(h) { const b = (h.baris || []).filter(r => r.toko && (r.qty || r.retur));
  const jual = sumBy(b, jmlBaris), hutang = sumBy(b, hutangBaris), lama = sumBy(h.bayarLama, x => x.jumlah), keluar = sumBy(h.keluar, x => x.jumlah), setor = sumBy(h.setor, x => x.jumlah);
  const harus = jual - hutang + lama;
  return { b, jual, hutang, bayar: jual - hutang, lama, keluar, setor, harus, selisih: harus - keluar - setor, toko: [...new Set(b.map(r => r.toko.trim().toUpperCase()))].length,
    kendi: sumBy(b.filter(r => (jenisBarang(r)?.[3] || 'curah') === 'curah' && r.satuan === 'kendi'), r => r.qty), kg: sumBy(b, r => (r.berat || 0) * (r.qty || 0)), retur: sumBy(b, r => r.retur) }; }
// Hutang toko yang belum lunas, dari semua invoice harian
const semuaHutang = () => INV.daftar.filter(h => !h.batal).flatMap(h => (h.baris || []).filter(r => hutangBaris(r) > 0 && !r.lunas).map(r => ({ h, r })));

async function muatInvoice() { const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'invoice' }); if (!r.ok) throw new Error(r.pesan);
  const v = r.nilai || {}; v.profil = v.profil || {}; v.daftar = Array.isArray(v.daftar) ? v.daftar : []; return v; }
// Simpan: ambil versi terbaru dulu lalu terapkan perubahan, supaya dua HP yang menyimpan bergantian tidak saling menimpa.
async function simpanInvoice(ubah) { const v = await muatInvoice(); ubah(v);
  const r = await rpc('minyak_invoice_tulis', { p_token: sesi.baca().token, p_nilai: v }); if (!r.ok) throw new Error(r.pesan); INV = v; keu = null; return v; }
const gagalDialog = e => dialog(`<h3>Gagal menyimpan</h3><p class="catatan">${esc(e.message)}</p><div class="tombol-baris"><button class="pil" data-tutup>Tutup</button></div>`);

function gambarInvoice() { const el = $('#inv'); if (!el) return;

      ${bacaSaja ? '' : '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="pil emas" id="bInvBaru">+ Invoice hari ini</button><button class="pil kaca" id="bProfil">Kepala surat</button></div>'}</section>
    ${!INV.profil.nama && !bacaSaja ? '<section class="kartu angkat" style="margin-top:14px"><div class="pesan-salah" style="margin:0">Kepala surat belum diisi. Tekan "Kepala surat" untuk mengisi nama usaha, alamat, dan nomor telepon.</div></section>' : ''}
    <section class="kartu angkat" style="margin-top:14px"><h2>Invoice per hari<span class="keping">${INV.daftar.filter(h => !h.batal).length}</span></h2>
      <input class="isian" id="invCari" placeholder="Cari tanggal, nomor, pengantar, atau toko…" value="${esc(invCari)}" autocomplete="off" aria-label="Cari invoice">

    <section class="kartu angkat" style="margin-top:14px"><h2>Hutang toko<span class="keping">${hutang.length}</span></h2><div id="invHutang"></div>
      <div class="catatan">Hutang diambil dari kolom Hutang di tiap invoice harian. Tekan Lunas kalau toko sudah membayar; catat uangnya di "Toko bayar hutang lama" pada invoice hari pembayaran supaya kas harian cocok.</div></section>`;
  gambarDaftarInv(); gambarHutangInv();

function gambarDaftarInv() { const el = $('#invDaftar'); if (!el) return; const cari = invCari.trim().toLowerCase();
  const daftar = INV.daftar.filter(h => !cari || `${h.no} ${h.tgl} ${tglPanjang(h.tgl)} ${h.pengantar || ''} ${(h.baris || []).map(r => r.toko).join(' ')}`.toLowerCase().includes(cari))
    .sort((a, b) => b.tgl.localeCompare(a.tgl) || (parseInt(b.no, 10) || 0) - (parseInt(a.no, 10) || 0));
  el.innerHTML = daftar.map(h => { const c = hitungHarian(h);
    return `<button class="inv-kartu ${h.batal ? 'mati' : ''}" data-buka="${esc(h.id)}"><div class="inv-atas"><div style="min-width:0"><b>${esc(tglPanjang(h.tgl))}</b><div class="catatan" style="margin:2px 0 0">No. ${esc(h.no)}${h.pengantar ? ' · ' + esc(h.pengantar) : ''} · ${c.toko} toko${c.kendi ? ' · ' + angkaId(c.kendi) + ' kendi' : ''}</div></div>
      <b style="flex:none">${rp(c.jual)}</b></div>
      <div class="keping-baris" style="margin:8px 0 0">${h.batal ? '<span class="keping">Dibatalkan</span>' : `${c.hutang ? `<span class="keping merah">Hutang ${rp(c.hutang)}</span>` : '<span class="keping hijau">Semua toko bayar</span>'}${kepingKeu(h.id)}${c.selisih ? `<span class="keping merah">Selisih kas ${rp(Math.abs(c.selisih))} ${c.selisih > 0 ? 'kurang' : 'lebih'}</span>` : (c.setor || c.keluar) ? '<span class="keping hijau">Kas cocok</span>' : ''}`}</div></button>`; }).join('')
    || `<div class="catatan" style="margin:0">${INV.daftar.length ? 'Tidak ada yang cocok.' : 'Belum ada invoice. Tekan "+ Invoice hari ini".'}</div>`;
  $$('[data-buka]', el).forEach(b => b.onclick = () => bukaHarian(INV.daftar.find(h => h.id === b.dataset.buka))); }

function gambarHutangInv() { const el = $('#invHutang'); if (!el) return; const per = {};
  semuaHutang().forEach(x => { (per[x.r.toko.trim().toUpperCase()] ||= []).push(x); });
  el.innerHTML = Object.entries(per).sort((a, b) => sumBy(b[1], x => hutangBaris(x.r)) - sumBy(a[1], x => hutangBaris(x.r))).map(([t, xs]) => `<div class="inv-item"><div class="inv-atas"><b>${esc(xs[0].r.toko)}</b><b>${rp(sumBy(xs, x => hutangBaris(x.r)))}</b></div>
    ${xs.map(({ h, r }) => `<div class="inv-atas" style="margin-top:6px;align-items:center"><span class="catatan" style="margin:0">${esc(tglPanjang(h.tgl))} · ${esc(r.barang)} ${angkaId(r.qty)} ${esc(r.satuan || '')} · ${rp(hutangBaris(r))}</span>${bacaSaja ? '' : `<button class="pil halus kecil" data-lunas="${esc(h.id)}|${esc(r.id)}">Lunas</button>`}</div>`).join('')}</div>`).join('')

    try { await simpanInvoice(x => { const y = x.daftar.find(z => z.id === hid)?.baris.find(z => z.id === rid); if (y) { y.lunas = true; y.tglLunas = hariIni(); } }); gambarInvoice(); } catch (e) { gagalDialog(e); } }); }

/* ----- Lembar di layar (seperti nota MBG): dipakai untuk melihat sebelum mengunduh ----- */
function lembarHarian(h) { const c = hitungHarian(h), P = INV.profil || {};
  return `<div class="lembar"><div class="kop"><div><b>${esc(P.nama || '')}</b><div class="kecil">${esc(P.alamat || '')}</div>${P.telp ? `<div class="kecil">No Telp : ${esc(P.telp)}</div>` : ''}</div>

    <div class="kecil" style="margin-top:8px">Terbilang: <i>${esc(terbilang(c.jual))}</i></div>

    ${h.catatan ? `<div class="kecil" style="margin-top:8px">Catatan: ${esc(h.catatan)}</div>` : ''}</div>`; }
// Baris rekapan akhir: [label, nilai (teks), tebal]
function rekapBaris(h, c) { const r = [['Total penjualan', rp(c.jual), true]];
  if (c.hutang) r.push(['Toko hutang', '- ' + rp(c.hutang)]);
  (h.bayarLama || []).filter(x => x.jumlah).forEach(x => r.push(['Bayar hutang lama ' + (x.toko || ''), '+ ' + rp(x.jumlah)]));
  r.push(['Uang yang harus ada', rp(c.harus), true]);
  (h.keluar || []).filter(x => x.jumlah).forEach(x => r.push(['Pengeluaran ' + (x.ket || ''), '- ' + rp(x.jumlah)]));
  (h.setor || []).filter(x => x.jumlah).forEach(x => r.push(['Setor ' + (x.ket || ''), '- ' + rp(x.jumlah)]));
  r.push([c.selisih ? (c.selisih > 0 ? 'Selisih (uang kurang)' : 'Selisih (uang lebih)') : 'Selisih', c.selisih ? rp(Math.abs(c.selisih)) : 'Rp 0 (cocok)', true]);
  return r.map(([l, n, t]) => [l.trim(), n, t]); }

function unduhHarian(h, jenis) {
  if (jenis === 'nota' || jenis === 'sjt') { const toko = [...new Set(hitungHarian(h).b.map(r => r.toko.trim()))];

      <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil" id="uOk">Unduh PDF</button></div>`, (d, tutup) => {
      $('#uOk', d).onclick = () => { const t = $('#uToko', d).value; tutup(); const pilih = t ? [t] : toko; jenis === 'nota' ? pdfNotaToko(h, pilih) : pdfSjToko(h, pilih); }; }); }
  return { inv: pdfHarian, sj: pdfSjHarian, xl: excelHarian }[jenis](h); }

      <div class="b-jumlah"><span>Jumlah</span><b data-jml>${rp(jmlBaris(r))}</b><button class="pil bahaya kecil" data-hapus aria-label="Hapus baris ${i + 1}">Hapus</button></div></div>`).join('');
    $$('.inv-baris', $('#fBaris')).forEach(row => { const r = h.baris[+row.dataset.i];
      $$('[data-f]', row).forEach(inp => { const f = inp.dataset.f;

        else if (f === 'harga' || f === 'hutang') ikatAngka(inp, n => { r[f] = n; if (f === 'harga') r._auto = false; $('[data-jml]', row).textContent = rp(jmlBaris(r)); }, true);
        else inp.addEventListener('input', () => { r[f] = inp.value; segar(); ubah(); });
        if (f === 'toko') inp.addEventListener('change', () => { isiOtomatis(r); isiUlang(row, r); });
        if (f === 'barang') inp.addEventListener('change', () => { const j = jenisBarang(r); if (j) { r.satuan = j[1]; if (r._auto !== false || !r.harga) { r.harga = 0; r._auto = true; } isiOtomatis(r); isiUlang(row, r); } }); });
      $('[data-hapus]', row).onclick = () => { if ((r.toko || r.qty) && !confirm(`Hapus baris ${r.toko || 'ini'}?`)) return; h.baris.splice(+row.dataset.i, 1); if (!h.baris.length) h.baris.push(barisBaru()); ubah(); gambarBaris(); }; });

  const tambahToko = () => { const r = barisBaru(); h.baris.push(r); gambarBaris(); ubah(); $$('#fBaris [data-f="toko"]').pop().focus(); };

  h.baris.forEach(isiOtomatis); gambarBaris(); Object.keys(DAFTAR).forEach(gambarDaftar); segar();

  $('#fSimpan').onclick = async () => {
    const baris = h.baris.filter(r => r.toko.trim() && (r.qty > 0 || r.retur > 0));

    const bersih = a => a.filter(x => (x.ket || x.toko || '').trim() || x.jumlah).map(x => ({ ...x, ...(x.ket !== undefined ? { ket: x.ket.trim() } : {}), ...(x.toko !== undefined ? { toko: x.toko.trim() } : {}) }));

  const bt = $('#fBatal'); if (bt) bt.onclick = async () => { if (!confirm(`Batalkan invoice ${h.no} (${tglPanjang(h.tgl)})? Tidak dihapus, hanya ditandai dibatalkan dan bisa dipulihkan.`)) return;

}

/* ----- PDF: hitam-putih seperti berkas Word surat jalan, siap dicetak ----- */
function teksJarang(doc, s, x, y, jarak, kanan) { const w = doc.getTextWidth(s) + jarak * Math.max(0, s.length - 1); doc.text(s, kanan ? x - w : x, y, { charSpace: jarak }); }
async function kertasBaru() { const JsPDF = await muatPdf(); return new JsPDF({ unit: 'mm', format: 'a4' }); }
// Kepala surat di halaman yang sedang aktif. kiri/kanan = [[label, isi]], judul kiri 'Kepada Yth.' kalau ada tujuan toko.
function kepalaSurat(doc, judul, kiri, kanan, kepada) { const P = INV.profil || {};
  doc.setTextColor(0); doc.setDrawColor(0);
  doc.setFont('times', 'bold'); doc.setFontSize(13); teksJarang(doc, (P.nama || '').toUpperCase(), 14, 16, 1.1);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); if (P.alamat) teksJarang(doc, P.alamat, 14, 22, .25); if (P.telp) teksJarang(doc, 'No Telp : ' + P.telp, 14, 27, .25);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(judul.length > 14 ? 15 : 17); teksJarang(doc, judul, 196, 19, judul.length > 14 ? 1.1 : 1.6, true);
  doc.setLineWidth(.5); doc.line(6, 33, 204, 33); doc.setFontSize(8.5);
  const baris = (x, y, l, isi, lebar, xi) => { doc.setFont('helvetica', 'bold'); doc.text(l, x, y); doc.setFont('helvetica', 'normal'); const t = doc.splitTextToSize(String(isi || '-'), lebar); doc.text(':', xi - 3, y); doc.text(t, xi, y); return y + 5 * t.length; };
  let yk = 41; if (kepada) { doc.setFont('helvetica', 'bold'); doc.text('Kepada Yth.', 14, yk); yk += 6; }
  kiri.forEach(([l, v]) => { yk = baris(14, yk, l, v, 62, 38); });
  let yn = 41; kanan.forEach(([l, v]) => { yn = baris(112, yn, l, v, 60, 138); });
  return Math.max(yk, yn) + 1; }
const garisTabel = { theme: 'grid', styles: { font: 'helvetica', fontSize: 9, cellPadding: 2.6, textColor: 0, lineColor: 0, lineWidth: .3, valign: 'middle' },
  headStyles: { fillColor: 255, textColor: 0, fontStyle: 'bold' }, footStyles: { fillColor: 255, textColor: 0, fontStyle: 'bold' }, margin: { left: 14, right: 14 } };
// Kotak dua kolom (Catatan | PERHATIAN/Pembayaran) dengan garis luar dan garis tengah saja, seperti di berkas Word.
function kotakCatatan(doc, y, kiri, kanan) {
  doc.autoTable({ startY: y, body: [[kiri, kanan]], theme: 'plain', styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 3, textColor: 0, minCellHeight: 22 }, margin: { left: 14, right: 14 },
    columnStyles: { 0: { cellWidth: 91 } }, tableLineColor: 0, tableLineWidth: .3,
    didDrawCell: d => { if (d.column.index === 0) { doc.setDrawColor(0); doc.setLineWidth(.3); doc.line(d.cell.x + d.cell.width, d.cell.y, d.cell.x + d.cell.width, d.cell.y + d.cell.height); } } });
  return doc.lastAutoTable.finalY; }
function ttd(doc, y, kolom) { if (y > 248) { doc.addPage(); y = 20; } doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  kolom.forEach(([atas, bawah, x, garisNama]) => { doc.setFont('helvetica', 'normal'); doc.text(atas, x, y, { align: 'center' });
    if (garisNama) { doc.setFont('helvetica', 'bold'); doc.text(garisNama, x, y + 5, { align: 'center' }); }
    if (bawah && bawah !== '...') { doc.setFont('helvetica', 'bold'); const n = bawah.toUpperCase(), w = doc.getTextWidth(n); doc.text(n, x, y + 30, { align: 'center' }); doc.setLineWidth(.3); doc.line(x - w / 2, y + 31, x + w / 2, y + 31); }
    else if (bawah === '...') { doc.setFont('helvetica', 'normal'); doc.text('( ' + '.'.repeat(40) + ' )', x, y + 30, { align: 'center' }); }
    else { doc.setLineDashPattern([1, 1], 0); doc.setLineWidth(.25); doc.line(x - 24, y + 30, x + 24, y + 30); doc.setLineDashPattern([], 0); } }); }
const namaBerkas = (jenis, h, akhir = '') => `${jenis} ${h.no} ${h.tgl}${akhir ? ' ' + akhir : ''}`.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() + '.pdf';
const infoHari = h => [['No. Invoice', h.no], ['Tanggal', `${hariTgl(h.tgl)}, ${tglSurat(h.tgl)}`], ['Ekspedisi', h.ekspedisi]];

// Invoice harian: semua toko satu lembar, dengan harga, hutang, dan rekapan akhir.
function pdfHarian(h) { return denganTunggu(async () => { const doc = await kertasBaru(), c = hitungHarian(h), P = INV.profil || {};
  const y = kepalaSurat(doc, 'INVOICE HARIAN', [['Pengantar', h.pengantar], ['Jumlah toko', c.toko + ' toko'], ['Total qty', `${c.kendi ? angkaId(c.kendi) + ' kendi curah' : '-'}${c.kg ? ' · ' + angkaId(c.kg) + ' kg' : ''}`]], infoHari(h));
  doc.autoTable({ ...garisTabel, startY: y, styles: { ...garisTabel.styles, fontSize: 8.5, cellPadding: 2.2 },
    head: [['No', 'Nama Toko', 'Barang', 'Qty', 'Berat', 'Harga', 'Jumlah', 'Hutang']],
