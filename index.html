    columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 2: { cellWidth: 25 }, 3: { halign: 'center', cellWidth: 20 }, 4: { halign: 'center', cellWidth: 15 }, 5: { halign: 'right', cellWidth: 23 }, 6: { halign: 'right', cellWidth: 27 }, 7: { halign: 'right', cellWidth: 24 } },
    didParseCell: d => { if (d.section === 'head') d.cell.styles.halign = d.column.index > 4 ? 'right' : [0, 3, 4].includes(d.column.index) ? 'center' : 'left'; } });
  let yy = doc.lastAutoTable.finalY + 5; doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); const tb = doc.splitTextToSize('Terbilang: ' + terbilang(c.jual), 182); doc.text(tb, 14, yy); yy += 4 * tb.length + 2;
  doc.autoTable({ ...garisTabel, startY: yy, tableWidth: 110, styles: { ...garisTabel.styles, fontSize: 8.5, cellPadding: 2 }, head: [[{ content: 'REKAPAN AKHIR', colSpan: 2 }]],
    body: rekapBaris(h, c).map(([l, n, t]) => [{ content: l, styles: { fontStyle: t ? 'bold' : 'normal' } }, { content: n, styles: { halign: 'right', fontStyle: t ? 'bold' : 'normal' } }]), columnStyles: { 1: { cellWidth: 38 } } });
  yy = doc.lastAutoTable.finalY + 4;
  if (h.catatan) { doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); const t = doc.splitTextToSize('Catatan: ' + h.catatan, 182); doc.text(t, 14, yy + 3); yy += 4 * t.length + 3; }
  ttd(doc, yy + 10, [['Pengantar,', h.pengantar || '...', 50], ['Hormat kami,', P.penandatangan || '...', 158, P.nama || '']]);
  doc.save(namaBerkas('Invoice Harian', h)); }); }

// Surat jalan harian: semua toko, tanpa harga, tiap toko tanda tangan di barisnya.
function pdfSjHarian(h) { return denganTunggu(async () => { const doc = await kertasBaru(), c = hitungHarian(h);
  const y = kepalaSurat(doc, 'SURAT JALAN', [['Pengantar', h.pengantar], ['Jumlah toko', c.toko + ' toko'], ['Total qty', `${c.kendi ? angkaId(c.kendi) + ' kendi curah' : '-'}${c.kg ? ' · ' + angkaId(c.kg) + ' kg' : ''}`]], infoHari(h));

  const yy = kotakCatatan(doc, doc.lastAutoTable.finalY + 4, 'Catatan:\n' + (h.catatan || ''),

function pdfNotaToko(h, pilih) { return denganTunggu(async () => { const doc = await kertasBaru(), P = INV.profil || {};

    let yy = doc.lastAutoTable.finalY + 6; doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); const tb = doc.splitTextToSize('Terbilang: ' + terbilang(total), 182); doc.text(tb, 14, yy); yy += 4 * tb.length + 2;
    const kanan = (hut ? `Dibayar: ${rp(total - hut)}\nBelum dibayar (hutang): ${rp(hut)}\n` : 'STATUS: LUNAS\n') + (P.bayar ? 'Pembayaran:\n' + P.bayar : '');

  doc.save(namaBerkas('Nota', h, pilih.length === 1 ? pilih[0] : 'semua toko')); }); }

/* ----- Excel bersusunan lembar harian PENJUALAN MINYAK MINGGU N (ExcelJS dari cdnjs) ----- */
let pustakaXl = null;
const muatExcel = () => pustakaXl ||= new Promise((ok, gagal) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
  s.onload = () => ok(window.ExcelJS); s.onerror = () => { pustakaXl = null; gagal(new Error('Gagal memuat pembuat Excel. Cek internet.')); }; document.head.append(s); });
function excelHarian(h) { return denganTunggu(async () => { const ExcelJS = await muatExcel(), c = hitungHarian(h);
  const d = new Date(h.tgl + 'T00:00:00'), HARI = hariTgl(h.tgl).toUpperCase(), BLN = BLN_L[d.getMonth()].toUpperCase();
  const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet(`${HARI} ${d.getDate()} ${BLN}`.slice(0, 31), { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  // Kolom seperti Excel penjualan: NAMA TOKO, RETUR, KEN, QTY, DUS, kolom berat (kg per kendi), HARGA, JUMLAH, TOKO BAYAR, TOKO HUTANG
  const berat = [...new Set(c.b.filter(r => (jenisBarang(r)?.[3] || 'curah') === 'curah' && r.berat).map(r => r.berat))].sort((a, b) => a - b);
  const kepala = ['NAMA TOKO', 'RETUR', 'KEN', 'QTY', 'DUS', ...berat, 'HARGA', 'JUMLAH', 'TOKO BAYAR', 'TOKO HUTANG'], N = kepala.length, kH = 6 + berat.length;
  ws.columns = kepala.map((_, i) => ({ width: i === 0 ? 34 : i >= kH - 1 ? 15 : 8 }));
  const garis = { style: 'thin', color: { argb: 'FF000000' } }, kotak = { top: garis, left: garis, bottom: garis, right: garis };
  const baris = (v, { tebal, isi } = {}) => { const r = ws.addRow(v); for (let i = 1; i <= N; i++) { const s = r.getCell(i); s.border = kotak; if (tebal) s.font = { bold: true }; if (isi) s.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: isi } }; if (i >= kH) s.numFmt = '#,##0'; } return r; };
  const judul = ws.addRow([`PENJUALAN ${(h.pengantar || '').toUpperCase()} HARI ${HARI} TGL ${d.getDate()} ${BLN} ${d.getFullYear()}`.replace(/\s+/g, ' ')]); ws.mergeCells(judul.number, 1, judul.number, N); judul.getCell(1).font = { bold: true, size: 12 };
  baris(kepala, { tebal: true, isi: 'FFE3EFE7' });
  c.b.forEach(r => { const k = jenisBarang(r)?.[3] || 'curah', v = Array(N).fill(null); v[0] = r.toko.toUpperCase() + (r.alamat && !r.toko.toUpperCase().includes(r.alamat.toUpperCase()) ? ' ' + r.alamat.toUpperCase() : '');
    if (r.retur) v[1] = r.retur; if (k === 'ken') v[2] = r.qty; else if (k === 'dus') v[4] = r.qty; else { v[3] = r.qty; const bi = berat.indexOf(r.berat); if (bi >= 0) v[5 + bi] = r.qty; }
    v[kH - 1] = r.harga || null; v[kH] = jmlBaris(r); v[kH + 1] = jmlBaris(r) - hutangBaris(r); v[kH + 2] = hutangBaris(r) || null; baris(v); });
  const tot = Array(N).fill(null); tot[0] = 'JUMLAH TOTAL SEMENTARA'; for (let i = 1; i < N; i++) if (i !== kH - 1) tot[i] = sumBy(c.b, r => { const k = jenisBarang(r)?.[3] || 'curah';
    return i === 1 ? r.retur : i === 2 ? (k === 'ken' ? r.qty : 0) : i === 3 ? (k === 'curah' ? r.qty : 0) : i === 4 ? (k === 'dus' ? r.qty : 0) : i < kH - 1 ? (k === 'curah' && r.berat === berat[i - 5] ? r.qty : 0)
      : i === kH ? jmlBaris(r) : i === kH + 1 ? jmlBaris(r) - hutangBaris(r) : hutangBaris(r); });
  baris(tot, { tebal: true, isi: 'FFFBF3E0' }); ws.addRow([]);
  const rekap = (l, n, tebal) => { const r = ws.addRow([l]); r.getCell(N).value = n; r.getCell(N).numFmt = '#,##0'; if (tebal) { r.getCell(1).font = { bold: true }; r.getCell(N).font = { bold: true }; } };
  rekap('REKAPAN AKHIR', null, true); rekap('TOTAL PENJUMLAHAN TOTAL PENJUALAN', c.jual, true); if (c.hutang) rekap('TOKO HUTANG', c.hutang);
  (h.bayarLama || []).forEach(x => rekap(('BAYAR HUTANG ' + (x.toko || '')).toUpperCase(), x.jumlah));
  (h.keluar || []).forEach(x => rekap(('PENGELUARAN ' + (x.ket || '')).toUpperCase().trim(), x.jumlah));
  (h.setor || []).forEach(x => rekap(('SETOR ' + (x.ket || '')).toUpperCase().trim(), x.jumlah));
  rekap('TOTAL KESELURUHAN SELISIH', c.selisih, true);
  const buf = await wb.xlsx.writeBuffer(), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = namaBerkas('Penjualan', h).replace(/\.pdf$/, '.xlsx'); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }); }
