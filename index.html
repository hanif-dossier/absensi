<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="application-name" content="OFU">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---------- Warna: hijau minyak tua + emas minyak goreng. Semua komponen memakai token ini. ---------- */
:root{
  --dasar:#f2f5f1; --kartu:#ffffff; --kartu2:#f6f9f5; --garis:#dfe7de; --tinta:#16302c; --redup:#5f7570;
  --utama:#0f3d3a; --utama2:#1c5a54; --emas:#d59a1c; --emas-lembut:#fbf0d3;
  --naik:#1c7a4c; --naik-lembut:#e4f4ea; --turun:#b3362a; --turun-lembut:#fbe9e6;
  --r:24px; --r-kecil:16px; --bayang:0 10px 30px rgba(15,61,58,.08);
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --dasar:#0b1614; --kartu:#12211f; --kartu2:#172a27; --garis:#25403b; --tinta:#e9f2ee; --redup:#93aaa4;
  --utama:#123f3b; --utama2:#1e615a; --emas:#e8b54a; --emas-lembut:#3a2f12;
  --naik:#5fd39a; --naik-lembut:#143224; --turun:#f08a7d; --turun-lembut:#3b1d19; --bayang:0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--dasar);color:var(--tinta);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
.bungkus{max-width:1040px;margin:0 auto;padding-inline:16px}

/* ---------- Kepala ---------- */
.kepala{background:radial-gradient(120% 140% at 0% 0%,var(--utama2),var(--utama) 60%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 0 64px;
  border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.kepala::after{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(232,181,74,.55),rgba(232,181,74,0) 65%)}
.kepala .baris{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--emas)}
.kepala h1{font-size:clamp(26px,6vw,36px);line-height:1.1;margin-top:4px}
.kepala p{margin:6px 0 0;color:#cfe3de;font-size:13.5px}
.pil{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--utama);color:#fff;transition:transform .12s,filter .12s}
.pil:hover{filter:brightness(1.08)}.pil:active{transform:scale(.97)}
.pil.emas{background:var(--emas);color:#2a1e02}
.pil.halus{background:var(--kartu2);color:var(--tinta);box-shadow:inset 0 0 0 1px var(--garis)}
.kepala .pil{white-space:nowrap}
.pil.kaca{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(6px)}
.pil.bahaya{background:var(--turun-lembut);color:var(--turun)}
.pil.kecil{padding:7px 13px;font-size:13px}
.pil:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--emas);outline-offset:2px}

/* ---------- Kartu & keping ---------- */
.kartu{background:var(--kartu);border-radius:var(--r);padding:18px;box-shadow:var(--bayang);margin-top:16px}
.kartu h2{font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.angkat{margin-top:-44px;position:relative;z-index:2}
.besar{background:linear-gradient(135deg,var(--utama2),var(--utama));color:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--bayang)}
.besar .nilai{font-family:var(--serif);font-size:clamp(34px,9vw,46px);line-height:1.05;margin-top:2px}
.keping-baris{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.keping{background:rgba(255,255,255,.13);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.keping b{font-weight:700}
.kartu .keping{background:var(--kartu2);box-shadow:inset 0 0 0 1px var(--garis)}
.keping.merah{background:var(--turun-lembut);color:var(--turun);box-shadow:none}
.keping.hijau{background:var(--naik-lembut);color:var(--naik);box-shadow:none}
.kisi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kotak{background:var(--kartu2);border-radius:var(--r-kecil);padding:12px 14px}
.kotak .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--redup);font-weight:700}
.kotak .v{font-family:var(--serif);font-size:22px;margin-top:2px}
.kotak.emas{background:var(--emas-lembut)}
.kotak.merah{background:var(--turun-lembut)}.kotak.merah .v{color:var(--turun)}
.catatan{font-size:12.5px;color:var(--redup);margin-top:10px}

/* ---------- Hari (7 pil) ---------- */
.hari7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hari{border-radius:16px;padding:9px 2px;text-align:center;background:var(--kartu2)}
.hari b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup)}
.hari span{font-size:12px;font-weight:700}
.hari.hadir{background:var(--naik-lembut)}.hari.hadir span{color:var(--naik)}
.hari.libur span{color:var(--redup);font-weight:500}
@media (max-width:430px){.hari7{grid-template-columns:repeat(4,1fr)}}

/* ---------- Daftar baris (pengganti tabel di HP) ---------- */
.baris-data{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--garis);align-items:baseline}
.baris-data:last-child{border:0}
.baris-data .kiri{min-width:0}.baris-data .kiri small{display:block;color:var(--redup);font-size:12px}
.baris-data .kanan{text-align:right;white-space:nowrap;font-weight:700}
.baris-data.total{border-top:2px solid var(--garis);border-bottom:0;font-size:16px}
.minus{color:var(--turun)}

/* ---------- Tab pemilik ---------- */
.tab-baris{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;margin:14px -16px 0;scrollbar-width:none}
.tab-baris::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:var(--kartu);color:var(--redup);box-shadow:inset 0 0 0 1px var(--garis);cursor:pointer}
.tab.aktif{background:var(--utama);color:#fff;box-shadow:none}
.tab.mati{opacity:.5;text-decoration:line-through}
.tab.tambah{background:transparent;box-shadow:inset 0 0 0 1.5px var(--emas);color:var(--emas)}

/* ---------- Baris karyawan di ringkasan ---------- */
.orang{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:var(--r-kecil);background:var(--kartu2);margin-bottom:10px;cursor:pointer;border:0;width:100%;text-align:left}
.orang:hover{filter:brightness(.98)}
.orang .nama{font-family:var(--serif);font-size:18px}
.orang .bayar{font-family:var(--serif);font-size:20px;text-align:right}
.orang .rinci{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.orang .keping{font-size:12px;padding:4px 10px;background:var(--kartu)}
.orang.kosong{opacity:.55}
.garis-batang{grid-column:1/-1;height:6px;border-radius:6px;background:var(--garis);overflow:hidden}
.garis-batang i{display:block;height:100%;background:linear-gradient(90deg,var(--emas),var(--utama2));border-radius:6px}

/* ---------- Penyunting minggu ---------- */
.minggu{background:var(--kartu2);border-radius:var(--r-kecil);padding:14px;margin-bottom:12px}
.minggu-kepala{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.minggu-kepala .no{width:74px}.minggu-kepala .per{flex:1;min-width:170px}
.isian{background:var(--kartu);border:1.5px solid var(--garis);border-radius:14px;padding:9px 10px;width:100%;min-width:0}
.isian.angka{text-align:right}
.kisi7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kisi7 label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);font-weight:700;text-align:center;margin-bottom:3px}
.kisi7 .isian{padding:8px 4px;text-align:center;font-size:13.5px}
@media (max-width:620px){.kisi7{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sub-judul{font-size:12px;font-weight:700;color:var(--redup);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hasil{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hutang-baris{display:grid;grid-template-columns:130px 1fr 110px 110px 96px 170px auto;gap:6px;margin-bottom:8px;align-items:center}
@media (max-width:820px){.hutang-baris{grid-template-columns:1fr 1fr;background:var(--kartu2);padding:10px;border-radius:var(--r-kecil)}.hutang-baris .lebar{grid-column:1/-1}}

/* ---------- Menu beranda pemilik ---------- */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-top:16px}
.tabel-pb{width:100%;border-collapse:collapse;font-size:13.5px}.tabel-pb th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);font-weight:700}
.tabel-pb th,.tabel-pb td{padding:8px 6px;border-bottom:1px solid rgba(127,127,127,.18);text-align:left;vertical-align:top}.tabel-pb tr:last-child td{border-bottom:0}
.tabel-pb .angka{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.bungkus-tabel{overflow-x:auto}
.ubin-pb{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}.ubin-pb>div{background:var(--kartu);border-radius:14px;padding:12px 14px;box-shadow:var(--bayang)}
.ubin-pb .label{margin:0}.ubin-pb .nilai{font-family:var(--serif);font-size:24px;line-height:1.1;margin-top:4px}.ubin-pb small{color:var(--redup);display:block;margin-top:4px}
.inv-item{padding:12px 0;border-bottom:1px solid rgba(127,127,127,.18)}.inv-item:last-child{border-bottom:0}
.inv-atas{display:flex;justify-content:space-between;gap:10px}
.inv-kartu-baris{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.inv-kartu{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--kartu2);border:1.5px solid var(--garis);border-radius:18px;padding:14px;cursor:pointer}
.inv-kartu:hover{border-color:var(--emas)}.inv-kartu.mati{opacity:.55}
.inv-unduh{display:flex;flex-wrap:wrap;gap:8px}
.inv-empat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 12px}
.inv-kepala{display:none}
.inv-blok-kepala{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:end;margin-bottom:10px}
.inv-blok-kepala .medan{margin:0}.inv-blok-no{grid-column:1/-1;font-family:var(--serif);font-size:20px;font-weight:700}
.inv-blok-jual{display:flex;flex-direction:column;align-items:flex-end}.inv-blok-jual small{color:var(--redup);font-size:11px;font-weight:700}.inv-blok-jual b{font-family:var(--serif);font-size:20px}
.inv-rekap{margin-top:12px;border-top:1px solid var(--garis);padding-top:10px}.inv-rekap summary{cursor:pointer;font-weight:700;font-size:14px}
.lembar-blok{margin-top:14px}.lembar-judul{font-weight:800;letter-spacing:.08em;font-size:12px;margin-bottom:6px}.lembar .lembar-blok table.rekap{margin-top:6px}
.inv-baris{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;padding:14px 0;border-bottom:1px dashed var(--garis)}
.inv-baris .medan{margin-bottom:0}.inv-baris .medan input,.inv-baris select{width:100%;padding:10px 12px;font-size:15px;border-radius:14px;background:var(--kartu2);border:1.5px solid var(--garis)}
.inv-baris .b-no{grid-column:1/-1;font-weight:800;color:var(--redup)}
.inv-baris .b-toko,.inv-baris .b-barang,.inv-baris .b-jumlah,.inv-baris .b-lain{grid-column:1/-1}
.b-jumlah{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px}.b-jumlah .b-angka{display:flex;flex-direction:column}.b-jumlah small{margin:0}
.b-aksi{display:flex;gap:6px}
.b-lain{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--kartu2);border-radius:14px;padding:10px}.b-lain .b-alamat{grid-column:1/-1}.b-lain[hidden]{display:none}
.b-lain .medan input{background:var(--kartu)}
@media (min-width:900px){
  .inv-kepala,.inv-baris{grid-template-columns:20px minmax(0,1.9fr) minmax(0,1.35fr) minmax(0,.6fr) minmax(0,.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 196px;gap:6px}
  .inv-blok-kepala{grid-template-columns:auto minmax(0,1.6fr) minmax(0,1fr) auto auto}.inv-blok-no{grid-column:auto;align-self:center;min-width:92px}
  .inv-kepala{display:grid;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--redup);padding:4px 0 6px;border-bottom:1px solid var(--garis)}
  .inv-kepala .kn{text-align:right}
  .inv-baris{padding:5px 0;align-items:center;border-bottom:1px solid rgba(127,127,127,.12)}
  .inv-baris .b-no{grid-column:auto;text-align:center;font-size:13px}
  .inv-baris .b-toko,.inv-baris .b-barang,.inv-baris .b-jumlah{grid-column:auto}
  .inv-baris>.medan>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .inv-baris>.medan input,.inv-baris>.medan select{padding:7px 8px;font-size:14px;border-radius:9px}
  .b-jumlah{flex-wrap:nowrap;gap:6px}.b-jumlah .b-angka{align-items:flex-end;flex:1;font-size:13.5px;white-space:nowrap}.b-jumlah small{font-size:11px}.b-aksi .pil{padding:5px 9px}
  .inv-baris .b-lain{grid-column:2/-1;grid-template-columns:130px minmax(0,1fr) 200px;margin:2px 0 6px}.b-lain .b-alamat{grid-column:auto}}
.inv-kecil{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;margin-bottom:8px}
.inv-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:15px}.inv-total b{font-family:var(--serif);font-size:26px}
textarea.isian{font:inherit;resize:vertical}
.lembar{background:#fff;color:#111;border-radius:18px;padding:22px 24px;font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums;box-shadow:var(--bayang)}
/* Laporan keuangan bulanan bergaya laporan publikasi bank (7 Okt 2026): pos rinci, kolom pembanding, nomor catatan */
.lk{margin-top:14px;overflow-x:auto}
.lk .kop-lk{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:2px solid #111;padding-bottom:12px}
.lk .kop-lk .jenis{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--utama2);font-weight:700}
.lk .kop-lk b{display:block;font:600 23px/1.15 var(--serif);margin-top:2px;color:var(--utama)}
.lk .kop-lk .kanan-kop{text-align:right;font-size:11.5px;color:#444}.lk .kop-lk .kanan-kop strong{display:block;font-size:13px;color:#111}
.lk .ikhtisar{font-size:12.5px;color:#333;margin:12px 0 0;max-width:72ch}
.lk h3.lk-judul{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;margin:26px 0 2px;font-weight:800;color:var(--utama)}
.lk h3.lk-judul span{font-weight:500;letter-spacing:.02em;text-transform:none;color:#555}
.lk .lk-ket{font-size:11.5px;color:#555;margin:0 0 8px;max-width:68ch}
.lk .lk-awas{font-size:11.5px;background:var(--emas-lembut);border:1px solid var(--emas);border-radius:8px;padding:8px 11px;margin:8px 0;color:#5a4410}
.lk-tabel{width:100%;border-collapse:collapse;font-size:12.5px}
.lk-tabel th,.lk-tabel td{border:0;padding:4px 6px;vertical-align:top;color:#111}
.lk-tabel thead th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1.5px solid #111;color:#333;white-space:nowrap;font-weight:700}
.lk-tabel .kanan{text-align:right;white-space:nowrap}
.lk-tabel .cat{text-align:center;width:46px;color:#666;font-size:11px}
.lk-tabel tr.judul td{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;padding-top:14px}
.lk-tabel tr.sub td:first-child{font-weight:700;padding-top:9px}
.lk-tabel tr.pos td:first-child{padding-left:16px}
.lk-tabel tr.pos2 td:first-child{padding-left:30px;color:#444}
.lk-tabel tr.jumlah td{font-weight:700;border-top:1px solid #9a9a9a}
.lk-tabel tr.total td{font-weight:800;border-top:1.5px solid #111;border-bottom:3px double #111}
.lk-tabel tr.memo td{color:#666;font-style:italic}
.lk-tabel td small{display:block;font-size:10.5px;color:#777;font-weight:400;font-style:normal}
.lk .catatan-lk{margin-top:12px;break-inside:avoid;page-break-inside:avoid}
.lk .catatan-lk h4{font-size:12px;margin:0 0 4px;font-weight:800}.lk .catatan-lk p{font-size:12px;margin:0 0 6px;color:#333;max-width:72ch}
.lk .kaki-lk{margin-top:24px;border-top:1px solid #bbb;padding-top:8px;font-size:11px;color:#666}
@media (max-width:560px){ .lembar.lk{padding:16px 10px} .lk-tabel{font-size:11px} .lk-tabel th,.lk-tabel td{padding:3px 3px} .lk-tabel thead th{font-size:9.5px;letter-spacing:.02em} .lk-tabel tr.pos td:first-child{padding-left:8px} .lk-tabel tr.pos2 td:first-child{padding-left:14px} .lk-tabel .cat{display:none} .lk-tabel td small{font-size:9.5px} .lk .kop-lk .kanan-kop{text-align:left} }
.lembar .kop{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:2px solid #111;padding-bottom:10px}
.lembar .kop>div:first-child b{font-size:17px;letter-spacing:.08em;font-family:Georgia,serif}
.lembar h3{font-size:14px;letter-spacing:.14em;margin:14px 0 8px}
.lembar table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
.lembar th,.lembar td{border:1px solid #333;padding:5px 7px;color:#111;vertical-align:top}
.lembar th{background:#eef3ef;font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left}
.lembar .kanan{text-align:right;white-space:nowrap}.lembar .kecil{font-size:11.5px;color:#444}
.lembar table.rekap{width:auto;min-width:0;max-width:100%}.lembar table.rekap td{padding:4px 10px}.lembar tr.tebal td{font-weight:700}
/* Surat jalan tersendiri (5 Okt 2026): lembar seperti berkas Word, formulir ringkas, dan mode cetak langsung dari HP */
.sj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sj-grid .medan{margin-bottom:0}.sj-grid .s-lebar{grid-column:1/-1}
.sj-baris{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--garis)}.sj-baris .medan{margin-bottom:0}.sj-baris .s-nama,.sj-baris .s-ket{grid-column:1/-1}
.sj-baris [data-hapus]{justify-self:end}
.lembar .sj-judul{font-weight:800;font-size:20px;letter-spacing:.18em;align-self:center}

/* Dua usaha dalam satu aplikasi (1 Okt 2026): lembar gaji Minyak (e.minggu) dan lembar gaji NTA (e.nta), bentuknya sama

const mingguBerisi = w => (w.hari || []).some(x => num(x) > 0) || (w.hmd || []).some(x => num(x) > 0) || num(w.hmx) > 0 || num(w.hbx) > 0;

  (e.minggu || []).forEach(w => { if (w.hbx === undefined) { const v = num(w.hb); if (v > 0 && num(w.w) >= 18) { e.hutang.push({ tgl: '', ket: 'Potongan gaji minggu ' + num(w.w), pinjam: 0, bayar: v, wk: num(w.w) }); w.hbx = 0; } else w.hbx = v; } });
  (e.nta || []).forEach(w => { if (w.hbx === undefined) w.hbx = 0; });
  const by = { minyak: {}, nta: {} }; e.hutang.forEach(d => { d.wk = num(d.wk) || 0; if (d.wk) { const u = d.usaha === 'nta' ? 'nta' : 'minyak'; by[u][d.wk] = (by[u][d.wk] || 0) + num(d.bayar); } });

/* Periode minggu berikutnya ditebak dari periode minggu sebelumnya ("14 - 19 September 2026"): tanggal terakhir di teks
   dianggap akhir minggu, lalu dicari Sabtu sesudahnya; Senin = Sabtu - 5 hari. Kalau tidak terbaca, dipakai Senin–Sabtu minggu ini. */
function akhirPeriode(per) {
  const m = [...String(per || '').matchAll(/(\d{1,2})\s+([A-Za-z]+)(?:\s+(\d{4}))?/g)].pop(); if (!m) return null;
  const bi = BLN_L.findIndex(x => x.slice(0, 3).toLowerCase() === m[2].slice(0, 3).toLowerCase());
  return bi < 0 ? null : new Date(+(m[3] || new Date().getFullYear()), bi, +m[1]); }
function periodeBerikut(per, usaha = 'minyak') {
  let sab = akhirPeriode(per);
  if (sab) sab.setDate(sab.getDate() + ((6 - sab.getDay() + 7) % 7 || 7));
  else { sab = new Date(); sab.setHours(0, 0, 0, 0); sab.setDate(sab.getDate() + (6 - sab.getDay() + 7) % 7); }
  const sen = new Date(sab); sen.setDate(sab.getDate() - (usaha === 'nta' ? 6 : 5));   // NTA: Minggu sampai Sabtu
  const t = d => d.getDate() + ' ' + BLN_L[d.getMonth()];
  if (sen.getMonth() === sab.getMonth()) return `${sen.getDate()} - ${t(sab)} ${sab.getFullYear()}`;
  return sen.getFullYear() === sab.getFullYear() ? `${t(sen)} - ${t(sab)} ${sab.getFullYear()}` : `${t(sen)} ${sen.getFullYear()} - ${t(sab)} ${sab.getFullYear()}`;
}

/* Satu tombol untuk membuka minggu baru di semua karyawan aktif sekaligus, dengan nomor dan periode yang sama.
   Yang ditawarkan: minggu terakhir kalau periodenya belum lewat dan masih ada karyawan aktif yang belum punya
   (misalnya sebagian sudah dibuat satu per satu); selain itu minggu berikutnya. Nomornya tetap bisa diganti di jendela. */
function dialogMingguSerentak() {
  const aktif = Object.entries(data).filter(([, e]) => e.aktif && ikut(e, usahaK)).sort((a, b) => a[1].nama.localeCompare(b[1].nama));
  if (!aktif.length) return status(`Belum ada karyawan aktif di ${USAHA[usahaK]}`, 'salah');
  const wl = semuaMinggu(), mx = wl.length ? wl[wl.length - 1] : 0;
  const cari = (e, w) => mingguDari(e, usahaK).find(x => num(x.w) === w);
  const perW = w => (Object.values(data).flatMap(x => mingguDari(x, usahaK)).find(x => num(x.w) === w && x.periode) || {}).periode || '';
  const tebak = w => perW(w) || periodeBerikut(perW(Math.max(0, ...wl.filter(x => x < w))), usahaK);
  const akhir = akhirPeriode(perW(mx)), kemarin = new Date(); kemarin.setHours(0, 0, 0, 0); kemarin.setDate(kemarin.getDate() - 1);
  const w0 = mx && akhir && akhir >= kemarin && aktif.some(([, e]) => !cari(e, mx)) ? mx : mx + 1;
  dialog(`<h3>Minggu baru ${USAHA[usahaK]} untuk semua karyawan ${USAHA[usahaK]}</h3>
    <label class="medan"><span>Nomor minggu</span><input id="sW" inputmode="numeric" value="${w0}"></label>
    <label class="medan"><span>Periode</span><input id="sPer" value="${esc(tebak(w0))}" placeholder="mis. 28 September - 3 Oktober 2026"></label>
    <div class="catatan" style="margin:0 0 6px">Karyawan yang dibuatkan minggu ini:</div><div id="sDaftar"></div><div id="sPesan"></div>
    <div class="tombol-baris"><button class="pil halus" data-tutup>Batal</button><button class="pil emas" id="sOk">Buat dan simpan</button></div>`, (t, tutup) => {
    let perDiketik = false;
    const isiDaftar = () => { const w = num($('#sW', t).value);
      $('#sDaftar', t).innerHTML = aktif.map(([k, e]) => { const ada = w > 0 && cari(e, w);
        return `<label style="display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:14px"><input type="checkbox" data-k="${esc(k)}" ${ada ? 'disabled' : 'checked'}> ${esc(e.nama)}${ada ? ' <span class="keping">sudah ada</span>' : ''}</label>`; }).join(''); };
    isiDaftar();
    $('#sPer', t).oninput = () => { perDiketik = true; };
    $('#sW', t).oninput = () => { const w = num($('#sW', t).value); if (!perDiketik && w > 0) $('#sPer', t).value = tebak(w); isiDaftar(); };
    $('#sOk', t).onclick = async () => { const w = num($('#sW', t).value), per = $('#sPer', t).value.trim();
      if (!(w > 0)) { $('#sPesan', t).innerHTML = '<div class="pesan-salah">Isi nomor minggu dulu.</div>'; return; }
      const pilih = $$('#sDaftar input:checked', t).map(c => c.dataset.k);
      if (!pilih.length) { $('#sPesan', t).innerHTML = `<div class="pesan-salah">Semua karyawan aktif sudah punya minggu ${w}.</div>`; return; }
      for (const k of pilih) { const e = data[k], src = mingguDari(e, usahaK);
        src.push({ w, periode: per, hari: [0, 0, 0, 0, 0, 0, 0], hmd: [0, 0, 0, 0, 0, 0, 0], hmx: 0, hm: 0, hb: 0, hbx: 0 });
        src.sort((a, b) => num(a.w) - num(b.w)); tandai(k); }
      // minggu yang sudah ada tapi periodenya masih kosong ikut diisi
      if (per) for (const [k, e] of aktif) { const x = cari(e, w); if (x && !x.periode) { x.periode = per; tandai(k); } }
      mingguRingkas = w; buka = {}; tutup(); gambar(); await simpan(); }; });
}

/* BULAN: minggu kerja digabung menjadi bulan. Satu minggu masuk ke bulan tempat hari Sabtunya jatuh (tanggal akhir di k.PER),
   karena gaji dan rekap dibuat per minggu. Minggu lama (tanpa `days`) hanya punya angka total, jadi rinciannya dicatat terpisah. */

function bulanKeu(k) { const kini = new Date(k.diambil || Date.now()), peta = {};
  for (const w of k.WK) { const d = k.D[w]; if (!d) continue;
    const m = [...String(k.PER[w] || '').matchAll(/(\d+)\s+([A-Za-z]{3})/g)].pop(); let bi = m ? BLN_P.indexOf(m[2][0].toUpperCase() + m[2].slice(1).toLowerCase()) : -1; if (bi < 0) bi = kini.getMonth();
    const th = kini.getFullYear() - (bi > kini.getMonth() + 1 ? 1 : 0), key = `${th}-${String(bi + 1).padStart(2, '0')}`;
    const b = peta[key] ??= { key, nama: BLN_L[bi] + ' ' + th, minggu: [], hari: 0, tot: { omset: 0, hpp: 0, qty: 0, lk: 0, ops: 0, gaji: 0, biayaops: 0, bersih: 0 }, pengantar: {}, jenis: {}, biaya: [], gaji: {}, opsRinci: 0, gajiRinci: 0, tanpaRinci: [] };
    b.minggu.push(w); b.hari += k.HARI[w] || 0; for (const f in b.tot) b.tot[f] += d.tot[f] || 0;
    for (const [n, v] of Object.entries(d.pengantar || {})) { const p = b.pengantar[n] ??= { qty: 0, lk: 0, ops: 0 }; p.qty += v.qty || 0; p.lk += v.lk || 0; p.ops += v.ops || 0; }
    for (const [n, v] of Object.entries(d.jenis || {})) { const j = b.jenis[n] ??= { qty: 0, omset: 0, hpp: 0 }; j.qty += v.qty; j.omset += v.omset; j.hpp += v.hpp; }
    (d.biaya || []).forEach(x => { b.biaya.push({ ...x, w }); b.opsRinci += x.nilai; });
    (d.gaji || []).forEach(x => { const g = b.gaji[x.nama] ??= { nama: x.nama, total: 0, hm: 0, hb: 0, terima: 0, n: 0 }; g.total += x.total; g.hm += x.hm; g.hb += x.hb; g.terima += x.terima; g.n++; b.gajiRinci += x.total; });
    if (!d.days) b.tanpaRinci.push(w); }
  const daftar = Object.values(peta).sort((a, b) => b.key.localeCompare(a.key)), mxW = Math.max(...k.WK);
  daftar.forEach(b => { b.minggu.sort((x, y) => x - y); b.berjalan = b.minggu.includes(mxW); b.gajiTertunda = b.berjalan && !(k.D[mxW].tot.gaji > 0) ? mxW : null; }); return daftar; }
/* Ringkasan satu BULAN dalam bentuk ALUR (omzet -> modal -> laba kotor -> biaya -> gaji -> laba bersih) + kalimat bahasa sehari-hari.
   Dipakai halaman Keuangan dan PDF supaya keduanya bercerita sama. */
function ringkasKeu(k, B, lalu) { const t = B.tot, hr = B.hari || 1;
  const alur = [['Omzet', t.omset, 'semua penjualan selama ' + B.nama, 'awal'], ['Modal minyak (HPP)', t.hpp, 'harga beli minyak yang terjual', 'kurang'],
    ['Laba kotor', t.lk, pc(t.lk / (t.omset || 1)) + ' dari omzet', 'hasil'], ['Biaya operasional', t.ops, 'bensin, parkir, makan, dan biaya harian pengantar', 'kurang']];
  if (t.gaji) alur.push(['Gaji karyawan', t.gaji, 'gaji bruto ' + B.minggu.length + ' minggu' + (B.gajiTertunda ? ' (minggu ' + B.gajiTertunda + ' belum dihitung)' : ''), 'kurang']);
  alur.push(['Laba bersih', t.bersih, pc(t.bersih / (t.omset || 1)) + ' dari omzet · ' + rp(t.bersih / (t.qty || 1)) + ' per unit', 'akhir']);
  let kalimat = `${B.nama}${B.berjalan ? ' (bulan berjalan)' : ''}: ${B.minggu.length} minggu kerja, ${B.hari} hari kerja, terjual ${ribu(t.qty)} unit dengan omzet ${rp(t.omset)}. Setelah dikurangi modal minyak ${rp(t.hpp)}, laba kotor ${rp(t.lk)} (${pc(t.lk / (t.omset || 1))}). ` +
    `Dikurangi biaya operasional ${rp(t.ops)}${t.gaji ? ' dan gaji ' + rp(t.gaji) : ''}, laba bersih ${rp(t.bersih)}, rata-rata ${rp(t.bersih / hr)} per hari kerja.`;
  if (B.gajiTertunda) kalimat += ` Gaji minggu ${B.gajiTertunda} belum masuk karena minggunya belum selesai, jadi laba bersih ini masih akan berkurang.`;
  if (lalu) { const a = t.bersih / hr, b = lalu.tot.bersih / (lalu.hari || 1), x = (a - b) / Math.abs(b || 1);
    kalimat += ` ${lalu.nama}: laba bersih ${rp(lalu.tot.bersih)} dari ${lalu.hari} hari kerja (${rp(b)} per hari), jadi rata-rata harian bulan ini ${x >= 0 ? 'naik' : 'turun'} ${Math.abs(x * 100).toFixed(1).replace('.', ',')}%.`; }
  return { t, alur, kalimat }; }
/* ---------- Laporan keuangan bergaya laporan publikasi bank (7 Okt 2026) ----------
   Pemilik: "laporan neracanya contoh seperti neraca bank-bank... laporan bulanannya tidak ada detail, hanya hasil".
   barisLK menyusun baris laba rugi (bulan ini dan bulan lalu), neraca (per hari ini, dari aset yang diisi di Bebas Hutang,
   piutang toko dari aplikasi, dan hutang bos), dan rasio. htmlLK dan pdfKeuangan memakai baris yang sama. Baris:
   { t: 'judul' | 'sub' | 'pos' | 'pos2' | 'jumlah' | 'total' | 'memo', l: label, c: nomor catatan, v: [nilai...], ket }. */
const angLK = n => n == null ? '' : typeof n === 'string' ? n : Math.round(n) === 0 ? '-' : n < 0 ? '(' + Math.round(-n).toLocaleString('id-ID') + ')' : Math.round(n).toLocaleString('id-ID');

   - Kolom Hutang = bagian penjualan hari itu yang belum dibayar.

const SATUAN = ['kendi', 'dus', 'pcs', 'kg', 'liter'];
// Angka desimal gaya Indonesia: "14,4" -> 14.4, "1.000" -> 1000, "14.4" -> 14.4
const desimal = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const angkaId = n => (Math.round((n || 0) * 100) / 100).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const tglSurat = t => { const d = new Date(t + 'T00:00:00'); return String(d.getDate()).padStart(2, '0') + ' ' + BLN_L[d.getMonth()] + ' ' + d.getFullYear(); };
const hariTgl = t => new Date(t + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long' });
const noBerikut = () => String(Math.max(0, ...INV.daftar.map(v => parseInt(v.no, 10) || 0)) + 1).padStart(3, '0');
const idBaru = h => h + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const tokoCocok = nama => (harga?.toko || []).find(t => t.nama.trim().toLowerCase() === String(nama || '').trim().toLowerCase());
const hargaPada = (t, p, tgl) => { const r = riwayat(t, p).filter(x => x.tgl <= tgl); return (r[r.length - 1] || hargaKini(t, p) || {}).harga || 0; };
const jenisBarang = b => BARANG.find(x => x[0].toLowerCase() === String(b.barang || '').trim().toLowerCase());
const jenisK = r => r.qty > 0 ? (jenisBarang(r)?.[3] || 'curah') : null;   // null = baris bayar saja
const jmlBaris = r => (r.qty || 0) * (r.harga || 0);
const hutangBaris = r => Math.min(jmlBaris(r), r.hutang || 0);
const sumBy = (a, f) => (a || []).reduce((s, x) => s + (f(x) || 0), 0);
const kunciToko = t => String(t || '').trim().replace(/\s+/g, ' ').toUpperCase();
const namaBlok = (B, i) => B.pengantar?.trim() ? (/^gudang$/i.test(B.pengantar.trim()) ? 'Gudang' : B.pengantar.trim()) : 'Mobil ' + (i + 1);
function terbilang(n) { n = Math.floor(Math.abs(n || 0)); if (!n) return 'Nol rupiah';
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const f = x => x < 12 ? s[x] : x < 20 ? f(x - 10) + ' belas' : x < 100 ? f(Math.floor(x / 10)) + ' puluh ' + f(x % 10)
    : x < 200 ? 'seratus ' + f(x - 100) : x < 1000 ? f(Math.floor(x / 100)) + ' ratus ' + f(x % 100)
    : x < 2000 ? 'seribu ' + f(x - 1000) : x < 1e6 ? f(Math.floor(x / 1000)) + ' ribu ' + f(x % 1000)
    : x < 1e9 ? f(Math.floor(x / 1e6)) + ' juta ' + f(x % 1e6) : x < 1e12 ? f(Math.floor(x / 1e9)) + ' miliar ' + f(x % 1e9) : f(Math.floor(x / 1e12)) + ' triliun ' + f(x % 1e12);
  const t = f(n).replace(/\s+/g, ' ').trim(); return t[0].toUpperCase() + t.slice(1) + ' rupiah'; }

// Bentuk lama (satu pengantar per invoice, bayarLama terpisah) diubah ke bentuk blok.
function normHarian(h) { if (!h) return h;
  if (!Array.isArray(h.blok)) {
    h.blok = [{ id: 'b1', pengantar: h.pengantar || '', ekspedisi: h.ekspedisi || 'Pick-up', keluar: h.keluar || [], setor: h.setor || [],
      baris: [...(h.baris || []), ...(h.bayarLama || []).filter(x => x.jumlah).map(x => ({ toko: x.toko || '', barang: '', qty: 0, bayar: x.jumlah }))] }];
    ['baris', 'keluar', 'setor', 'bayarLama', 'pengantar', 'ekspedisi'].forEach(k => delete h[k]); }
  h.blok.forEach(B => { B.id ||= idBaru('b'); B.baris ||= []; B.keluar ||= []; B.setor ||= []; B.baris.forEach(r => { r.id ||= idBaru('r'); }); });
  return h; }

/* ----- Modal ----- */
// Modal otomatis: rata-rata harga beli per kg pembelian curah 7 hari terakhir sampai tanggal invoice (data Pembelian
// minyak, dibaca laptop dari laporan tonase), ditimbang kg; dus dari pembelian dus terakhir; cadangan modal Excel.
let PEMBELIAN = null;
async function muatPembelian() { const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'pembelian' }); if (!r.ok) throw new Error(r.pesan); PEMBELIAN = r.nilai || { baris: [] }; return PEMBELIAN; }
function modalOtomatis(tgl) { const B = (PEMBELIAN?.baris || []).filter(b => b.tanggal <= (tgl || hariIni())), d = new Date((tgl || hariIni()) + 'T00:00:00'); d.setDate(d.getDate() - 6); const batas = isoTgl(d);
  const cur = B.filter(b => b.satuan !== 'dus' && b.kg > 0 && b.hargaKg > 0); let pakai = cur.filter(b => b.tanggal >= batas);
  if (!pakai.length && cur.length) { const t = cur.map(b => b.tanggal).sort().pop(); pakai = cur.filter(b => b.tanggal === t); }
  const dus = B.filter(b => b.satuan === 'dus' && b.hargaDus > 0).sort((a, b) => a.tanggal.localeCompare(b.tanggal)).pop();
  const kg = pakai.length ? Math.round(sumBy(pakai, b => b.kg * b.hargaKg) / sumBy(pakai, b => b.kg)) : 0, t = pakai.map(b => b.tanggal).sort();
  return { kg: kg || MODAL_EXCEL.kg || 0, dus: dus?.hargaDus || MODAL_EXCEL.dus || 0,
    ketKg: kg ? `rata-rata ${pakai.length} pembelian ${t[0] === t.at(-1) ? tglPendek(t[0]) : tglPendek(t[0]) + '–' + tglPendek(t.at(-1))}` : MODAL_EXCEL.kg ? 'modal Excel terakhir' : '',
    ketDus: dus ? `pembelian dus ${tglPendek(dus.tanggal)}` : MODAL_EXCEL.dus ? 'modal Excel terakhir' : '' }; }
// Modal satu baris: curah = qty x berat (kosong = 14,4 kg) x modal per kg; dus = qty x modal per dus; kendi kosong 0.
// Urutan: modal di baris itu, modal hari itu, modal otomatis.
const modalSatuan = (h, r, cad) => { const j = jenisK(r); if (!j || j === 'ken') return 0; if (r.modal) return r.modal;
  if (j === 'dus' ? h.modalDus : h.modalKg) return j === 'dus' ? h.modalDus : h.modalKg; const a = cad || modalOtomatis(h.tgl); return (j === 'dus' ? a.dus : a.kg) || 0; };
const modalBaris = (h, r, cad) => { const j = jenisK(r), m = modalSatuan(h, r, cad); return !j || j === 'ken' ? 0 : j === 'dus' ? (r.qty || 0) * m : (r.qty || 0) * (r.berat || 14.4) * m; };
const minyakBaris = r => { const j = jenisK(r); return j === 'curah' || j === 'dus'; };

/* ----- Hitungan (sama dengan REKAPAN AKHIR tiap blok di Excel) -----
   uang yang harus ada = penjualan - hutang hari ini + bayar hutang lama;  selisih = uang yang harus ada - pengeluaran - setoran */
function hitungBlok(h, B) { const b = (B.baris || []).filter(r => r.toko && (r.qty || r.retur || r.bayar));
  const jual = sumBy(b, jmlBaris), hutang = sumBy(b, hutangBaris), lama = sumBy(b, r => r.bayar), keluar = sumBy(B.keluar, x => x.jumlah), setor = sumBy(B.setor, x => x.jumlah), harus = jual - hutang + lama;
  const om = sumBy(b.filter(minyakBaris), jmlBaris), modal = Math.round(sumBy(b, r => modalBaris(h, r)));
  return { B, b, jual, hutang, lama, keluar, setor, harus, selisih: harus - keluar - setor, toko: new Set(b.filter(r => r.qty > 0).map(r => kunciToko(r.toko))).size,
    kendi: sumBy(b.filter(r => jenisK(r) === 'curah'), r => r.qty), dus: sumBy(b.filter(r => jenisK(r) === 'dus'), r => r.qty), kg: sumBy(b.filter(r => jenisK(r) === 'curah'), r => (r.berat || 14.4) * r.qty), retur: sumBy(b, r => r.retur),
    omsetMinyak: om, modal, laba: om - modal }; }
function hitungHarian(h) { const bl = (h.blok || []).map(B => hitungBlok(h, B)), S = f => sumBy(bl, x => x[f]);
  const b = bl.flatMap(x => x.b);
  return { bl, b, jual: S('jual'), hutang: S('hutang'), lama: S('lama'), keluar: S('keluar'), setor: S('setor'), harus: S('harus'), selisih: S('selisih'), toko: new Set(b.filter(r => r.qty > 0).map(r => kunciToko(r.toko))).size,
    kendi: S('kendi'), dus: S('dus'), kg: S('kg'), retur: S('retur'), omsetMinyak: S('omsetMinyak'), modal: S('modal'), laba: S('laba') }; }
// Baris rekapan akhir satu blok: [label, nilai (teks), tebal]
function rekapBaris(c) { const B = c.B, r = [['Total penjualan', rp(c.jual), true]];
  if (c.hutang) r.push(['Toko hutang', '- ' + rp(c.hutang)]);
  c.b.filter(x => x.bayar).forEach(x => r.push(['Bayar hutang ' + x.toko, '+ ' + rp(x.bayar)]));
  r.push(['Uang yang harus ada', rp(c.harus), true]);
  (B.keluar || []).filter(x => x.jumlah).forEach(x => r.push(['Pengeluaran ' + (x.ket || ''), '- ' + rp(x.jumlah)]));
  (B.setor || []).filter(x => x.jumlah).forEach(x => r.push(['Setor ' + (x.ket || ''), '- ' + rp(x.jumlah)]));
  r.push([c.selisih ? (c.selisih > 0 ? 'Selisih (uang kurang)' : 'Selisih (uang lebih)') : 'Selisih', c.selisih ? rp(Math.abs(c.selisih)) : 'Rp 0 (cocok)', true]);
  return r.map(([l, n, t]) => [l.trim(), n, t]); }

// Buku hutang per toko: + bon lama dari LAPORAN HUTANG PENJUALAN.xlsx (INV.awal, diimpor 30 Sep 2026), + hutang dari
// penjualan di invoice, - bayar (kolom Bayar di invoice dan bayar langsung). Sisa > 0 = masih hutang. Bayar melunasi bon
// yang paling lama dulu, jadi bon yang dicetak adalah bon yang benar-benar belum lunas. Kendi kosong dari Excel dicatat
// terpisah (jumlah kendi yang belum kembali), dikurangi retur kendi di invoice.
const jalurToko = k => INV.jalur?.[k] || (INV.awal || []).find(x => kunciToko(x.toko) === k)?.jalur || 'Belum ada jalur';
function bukuHutang() { const per = {};
  const catat = (toko, x) => { const k = kunciToko(toko); if (!k) return; const t = per[k] ||= { k, toko: toko.trim(), hutang: 0, bayar: 0, kendi: 0, riwayat: [] };
    t.riwayat.push(x); if (x.hutang) t.hutang += x.hutang; if (x.bayar) t.bayar += x.bayar; if (x.kendi) t.kendi += x.kendi; };
  (INV.awal || []).forEach(x => catat(x.toko, { tgl: x.tgl || '', hutang: x.jumlah || 0, kendi: x.kendi || 0, ket: 'bon lama' + (x.kendi ? ` / ${x.kendi} ken kosong` : '') + (x.jalur ? ' · ' + x.jalur : ''), awal: x.id, jalur: x.jalur }));
  INV.daftar.filter(h => !h.batal).forEach(h => h.blok.forEach((B, i) => B.baris.forEach(r => {
    if (hutangBaris(r) > 0) catat(r.toko, { tgl: h.tgl, hutang: hutangBaris(r), ket: `${r.barang} ${angkaId(r.qty)} ${r.satuan || ''} · ${namaBlok(B, i)}` });
    if (r.bayar > 0) catat(r.toko, { tgl: h.tgl, bayar: r.bayar, ket: 'bayar lewat ' + namaBlok(B, i) });
    if (r.retur > 0 && per[kunciToko(r.toko)]?.kendi) catat(r.toko, { tgl: h.tgl, kendi: -r.retur, ket: `retur ${angkaId(r.retur)} kendi · ${namaBlok(B, i)}` }); })));
  (INV.bayar || []).forEach(x => catat(x.toko, { tgl: x.tgl, bayar: x.jumlah, ket: x.ket || 'bayar langsung', id: x.id }));
  return Object.values(per).map(t => { t.riwayat.sort((a, b) => (a.tgl || '').localeCompare(b.tgl || ''));
    let sisaBayar = t.bayar; const bon = t.riwayat.filter(x => x.hutang > 0).map(x => { const lunas = Math.min(sisaBayar, x.hutang); sisaBayar -= lunas; return { ...x, dibayar: lunas, sisa: x.hutang - lunas }; });
    return { ...t, sisa: t.hutang - t.bayar, kendi: Math.max(0, t.kendi), bon, jalur: jalurToko(t.k) }; }); }

async function muatInvoice() { const r = await rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'invoice' }); if (!r.ok) throw new Error(r.pesan);
  const v = r.nilai || {}; v.profil = v.profil || {}; v.daftar = Array.isArray(v.daftar) ? v.daftar : []; v.bayar = Array.isArray(v.bayar) ? v.bayar : []; v.awal = Array.isArray(v.awal) ? v.awal : []; v.jalur = v.jalur || {}; v.daftar.forEach(normHarian); return v; }

  const r = await rpc('minyak_invoice_tulis', { p_token: sesi.baca().token, p_nilai: v }); if (!r.ok) throw new Error(r.pesan); INV = v; keu = null; return v; }

let hutJalur = '';

      ${t.riwayat.map(x => `<div class="inv-atas" style="margin-top:6px"><span class="catatan" style="margin:0">${x.tgl ? esc(tglPanjang(x.tgl)) : 'tanpa tanggal'} · ${esc(x.ket)}</span><span class="catatan" style="margin:0;white-space:nowrap">${x.hutang ? '+ ' + rp(x.hutang) : x.bayar ? '- ' + rp(x.bayar) : ''}${x.id && !bacaSaja ? ` <button class="pil halus kecil" data-hapusbayar="${esc(x.id)}" aria-label="Hapus bayar">✕</button>` : ''}</span></div>`).join('')}</details>`;

// Cetak bon hutang seperti LAPORAN HUTANG PENJUALAN.xlsx: per jalur, TGL | NAMA TOKO / ALAMAT | TOTAL, satu halaman per jalur.
// Hanya bon yang masih ada sisanya (bayar melunasi bon tertua dulu); kendi kosong yang belum kembali ikut ditulis.
function pdfHutang(jalurPilih) { return denganTunggu(async () => { const doc = await kertasBaru(), P = INV.profil || {}, buku = bukuHutang();
  // Bon dikelompokkan menurut jalur bon itu sendiri (toko bisa punya bon di dua jalur, mis. curah dan dus Sumo).
  const semuaBon = buku.flatMap(t => t.bon.filter(x => x.sisa > 0).map(x => ({ t, x, j: x.jalur || t.jalur })));
  const jalur = [...new Set([...semuaBon.map(b => b.j), ...buku.filter(t => t.kendi > 0).map(t => t.jalur)])].filter(j => !jalurPilih || j === jalurPilih).sort(); if (!jalur.length) throw new Error('Tidak ada hutang untuk dicetak.');
  const tglIni = tglSurat(hariIni());
  jalur.forEach((j, i) => { if (i) doc.addPage();
    const toko = buku.filter(t => semuaBon.some(b => b.t === t && b.j === j) || (t.kendi > 0 && t.jalur === j)).sort((a, b) => a.toko.localeCompare(b.toko));
    const rows = toko.flatMap(t => { const bon = semuaBon.filter(b => b.t === t && b.j === j).map(b => b.x), ken = t.kendi && t.jalur === j ? ` / ${t.kendi} KEN KOSONG` : '';
      if (!bon.length) { const k = t.riwayat.find(x => x.kendi > 0); return [[k?.tgl ? tglPendekAngka(k.tgl) : '', t.toko.toUpperCase() + ken, '', '']]; }
      return bon.map((x, n) => [x.tgl ? tglPendekAngka(x.tgl) : '', t.toko.toUpperCase() + (n === bon.length - 1 ? ken : ''), rp(x.sisa), x.dibayar ? 'sisa dari ' + rp(x.hutang) : '']); });
    const tot = sumBy(semuaBon.filter(b => b.j === j), b => b.x.sisa), kendi = sumBy(toko.filter(t => t.jalur === j), t => t.kendi);
    const y = kepalaSurat(doc, 'BON HUTANG', [['Jalur', j], ['Jumlah toko', toko.length + ' toko'], ['Kendi kosong', kendi + ' kendi']], [['Per tanggal', tglIni], ['Total hutang', rp(tot)]]);
    doc.autoTable({ ...garisTabel, startY: y, styles: { ...garisTabel.styles, fontSize: 8.8, cellPadding: 2.2 }, head: [['No', 'TGL', 'NAMA TOKO / ALAMAT', 'TOTAL', 'KETERANGAN']],
      body: rows.map((r, n) => [n + 1, ...r]), foot: [[{ content: 'JUMLAH TOTAL', colSpan: 3, styles: { halign: 'right' } }, { content: rp(tot), styles: { halign: 'right' } }, '']],
      columnStyles: { 0: { cellWidth: 9, halign: 'center' }, 1: { cellWidth: 22, halign: 'center' }, 3: { cellWidth: 30, halign: 'right' }, 4: { cellWidth: 36 } },
      didParseCell: d => { if (d.section === 'head' && [0, 1].includes(d.column.index)) d.cell.styles.halign = 'center'; if (d.section === 'head' && d.column.index === 3) d.cell.styles.halign = 'right'; } });
    ttd(doc, doc.lastAutoTable.finalY + 12, [['Penagih,', '...', 50], ['Hormat kami,', P.penandatangan || '...', 158, P.nama || '']]); });
  doc.save(`Bon Hutang ${jalurPilih || 'semua jalur'} ${hariIni()}.pdf`.replace(/[\\/:*?"<>|]+/g, ' ')); }); }
const tglPendekAngka = t => { const d = new Date(t + 'T00:00:00'); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };

/* ----- Surat Jalan tersendiri (5 Okt 2026) -----
   Pemilik mencatat penjualan di Excel; aplikasi hanya membuatkan surat jalan untuk barang yang dibawa pengantar (toko luar kota
   perlu bukti pengiriman). Disimpan di minyak_nilai kunci 'surat-jalan' lewat minyak_nilai_tulis; kepala surat memakai profil
   invoice (nama usaha, alamat, telepon, penanda tangan). Tidak masuk invoice, keuangan, maupun laporan. ----- */
let SJ = null, sjCari = '';
const SJ_BARANG = ['Minyak Curah', 'Minyak Dus', 'Kendi Kosong'];
const normSJ = s => { s.barang = Array.isArray(s.barang) ? s.barang : []; s.barang.forEach(b => { b.nama = b.nama || ''; b.qty = +b.qty || 0; b.satuan = b.satuan || 'kendi'; b.berat = +b.berat || 0; b.ket = b.ket || ''; }); ['pengantar', 'ekspedisi', 'plat', 'kepada', 'telp', 'alamat', 'catatan'].forEach(k => { s[k] = s[k] || ''; }); return s; };
async function muatSJ() { const [r] = await Promise.all([rpc('minyak_ambil_nilai', { p_token: sesi.baca().token, p_kunci: 'surat-jalan' }), INV ? null : muatInvoice().then(v => { INV = v; })]);
  if (!r.ok) throw new Error(r.pesan); const v = r.nilai || {}; v.daftar = Array.isArray(v.daftar) ? v.daftar : []; v.daftar.forEach(normSJ); return v; }
// Simpan: ambil versi terbaru dulu lalu terapkan perubahan, supaya dua HP yang menyimpan bergantian tidak saling menimpa.
async function simpanSJ(ubah) { const v = await muatSJ(); ubah(v); const r = await rpc('minyak_nilai_tulis', { p_token: sesi.baca().token, p_kunci: 'surat-jalan', p_nilai: v }); if (!r.ok) throw new Error(r.pesan); SJ = v; return v; }
const noSJ = () => String(Math.max(0, ...SJ.daftar.map(s => parseInt(s.no, 10) || 0)) + 1).padStart(3, '0');
// Baris yang berisi, jumlah per satuan, dan total kg (qty x berat per satuan).
function hitungSJ(s) { const b = (s.barang || []).filter(x => x.nama.trim() && x.qty > 0), per = {}; b.forEach(x => { const k = (x.satuan || 'pcs').toLowerCase(); per[k] = (per[k] || 0) + x.qty; }); const kg = sumBy(b, x => x.qty * x.berat);
  return { b, per, kg, jumlah: Object.entries(per).map(([k, n]) => angkaId(n) + ' ' + k).join(', '), ringkas: Object.entries(per).map(([k, n]) => angkaId(n) + ' ' + k).join(' · ') || '-' }; }

async function layarSuratJalan() {
  akar.innerHTML = kepalaPemilik('Surat Jalan', 'Bukti barang yang dibawa pengantar, untuk ditandatangani penerima. Dibuat dari HP, bisa dicetak atau diunduh PDF, tanpa harga.', true) +
